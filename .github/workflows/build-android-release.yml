          # As variáveis precisam estar disponíveis NESTA etapa,
          # porque é aqui que o Gradle lê System.getenv(...).
          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "ERRO: ANDROID_KEYSTORE_PASSWORD não chegou ao Gradle."
            exit 1
          }

          test -n "$ANDROID_KEY_ALIAS" || {
            echo "ERRO: ANDROID_KEY_ALIAS não chegou ao Gradle."
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "ERRO: ANDROID_KEY_PASSWORD não chegou ao Gradle."
            exit 1
          }

          cd "$PROJECT_DIR/android"
          chmod +x gradlew

          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Diagnóstico de empacotamento Android
        if: failure()
        shell: bash
        run: |
          set +e
          echo "=== APKs encontrados ==="
          find "$PROJECT_DIR/android" -type f -name "*.apk" -print
          echo "=== Relatório de problemas ==="
          if [ -f "$PROJECT_DIR/android/build/reports/problems/problems-report.html" ]; then
            grep -oE '.{0,160}(packageRelease|error|Exception|Caused by).{0,300}' "$PROJECT_DIR/android/build/reports/problems/problems-report.html" | head -40 || true
          fi
          echo "=== Relatórios de packaging ==="
          find "$PROJECT_DIR/android/app/build" -type f \( -name "*.txt" -o -name "*.log" \) -print | head -50 || true

      - name: Localizar APK final
        shell: bash
        run: |
          set -e
          APK="$PROJECT_DIR/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERRO: APK release não encontrado."
            find "$PROJECT_DIR/android" -type f -name "*.apk" -print
            exit 1
          fi
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Validar permissões do APK
        shell: bash
        run: |
          set -e
          APK="$APK_PATH"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$AAPT" || { echo "ERRO: aapt não encontrado."; exit 1; }
          "$AAPT" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          for PERM in READ_CONTACTS WRITE_CONTACTS RECORD_AUDIO CAMERA; do
            FULL="android.permission.$PERM"
            grep -q "$FULL" /tmp/apk-permissions.txt || { echo "ERRO: $FULL não está no APK."; exit 1; }
            echo "OK NO APK: $FULL"
          done
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q 'launchMode.*singleTask' || { echo "ERRO: launchMode=singleTask não encontrado no APK."; exit 1; }
          echo "OK NO APK: launchMode=singleTask"

      - name: Validar assinatura do APK
        shell: bash
        run: |
          set -e
          APK="$APK_PATH"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER" || { echo "ERRO: apksigner não encontrado."; exit 1; }
          "$APKSIGNER" verify --verbose "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: gestao-sacerdotista-aime-v138-agenda
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 1

      - name: Limpar arquivo temporário de assinatura
        if: always()
        shell: bash
        run: |
          rm -f "$PROJECT_DIR/android/app/release-key.jks" 2>/dev/null || true

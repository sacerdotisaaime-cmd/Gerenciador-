            @PluginMethod
            public void getSharedMedia(
              PluginCall call
            ) {

              JSArray array =
                new JSArray();


              File[] files =
                inboxDir().listFiles();


              if (files != null) {

                for (File file : files) {

                  if (
                    file.isFile() &&
                    !file.getName()
                      .endsWith(".tmp")
                  ) {

                    array.put(
                      metadata(file)
                    );
                  }
                }
              }


              JSObject result =
                new JSObject();


              result.put(
                "items",
                array
              );


              call.resolve(result);
            }


            @PluginMethod
            public void listSharedMedia(
              PluginCall call
            ) {

              getSharedMedia(call);
            }


            @PluginMethod
            public void readSharedMedia(
              PluginCall call
            ) {

              String id =
                call.getString(
                  "id",
                  ""
                );


              File file =
                findById(id);


              if (
                file == null ||
                !file.exists()
              ) {

                call.reject(
                  "SHARED_MEDIA_NOT_FOUND"
                );

                return;
              }


              try {

                java.io.ByteArrayOutputStream output =
                  new java.io.ByteArrayOutputStream();


                try (
                  FileInputStream input =
                    new FileInputStream(file)
                ) {

                  byte[] buffer =
                    new byte[8192];

                  int read;


                  while (
                    (read = input.read(buffer)) != -1
                  ) {

                    output.write(
                      buffer,
                      0,
                      read
                    );
                  }
                }


                String[] parts =
                  file.getName()
                    .split("__", -1);


                String mime =
                  parts.length >= 2
                    ? decode(parts[1])
                    : "application/octet-stream";


                JSObject result =
                  metadata(file);


                result.put(
                  "data",
                  "data:" +
                  mime +
                  ";base64," +
                  Base64.encodeToString(
                    output.toByteArray(),
                    Base64.NO_WRAP
                  )
                );


                call.resolve(result);


              } catch (Exception ex) {

                call.reject(
                  "SHARED_MEDIA_READ_ERROR",
                  ex.getMessage()
                );
              }
            }


            @PluginMethod
            public void deleteSharedMedia(
              PluginCall call
            ) {

              String id =
                call.getString(
                  "id",
                  ""
                );


              File file =
                findById(id);


              JSObject result =
                new JSObject();


              result.put(
                "ok",
                file == null ||
                file.delete()
              );


              call.resolve(result);
            }



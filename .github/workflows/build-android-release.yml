      # ============================================================
      # 15. ANDROID MANIFEST
      # ============================================================

      - name: Configurar AndroidManifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )

          # ======================================================
          # PERMISSÕES
          # ======================================================

          permissions = [
              "android.permission.READ_CONTACTS",
              "android.permission.WRITE_CONTACTS",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
          ]

          marker = "<application"

          if marker not in text:

              raise SystemExit(
                  "ERRO: <application> não encontrado."
              )

          additions = ""

          for permission in permissions:

              if (
                  f'android:name="{permission}"'
                  not in text
              ):

                  additions += (
                      f'    <uses-permission '
                      f'android:name="{permission}" />\n'
                  )

          if additions:

              text = text.replace(
                  marker,
                  additions + marker,
                  1
              )

          # ======================================================
          # MAIN ACTIVITY
          # ======================================================

          activity_pattern = (
              r'<activity\b'
              r'[^>]*'
              r'android:name="\.MainActivity"'
              r'[^>]*>'
              r'.*?'
              r'</activity>'
          )

          match = re.search(
              activity_pattern,
              text,
              flags=re.S
          )

          if not match:

              raise SystemExit(
                  "ERRO: MainActivity não encontrada."
              )

          activity =
          block = match.group(0)

          # Remove atributos antigos para recriar
          # de maneira determinística.

          block = re.sub(
              r'\s+android:exported="[^"]*"',
              '',
              block
          )

          block = re.sub(
              r'\s+android:grantUriPermissions="[^"]*"',
              '',
              block
          )

          block = re.sub(
              r'\s+android:launchMode="[^"]*"',
              '',
              block
          )

          block = block.replace(
              "<activity",
              '<activity '
              'android:exported="true" '
              'android:grantUriPermissions="true" '
              'android:launchMode="singleTask"',
              1
          )

          # ======================================================
          # REMOVER FILTROS DE SHARE ANTIGOS
          # ======================================================

          block = re.sub(
              r'\s*<intent-filter>'
              r'\s*<action\s+'
              r'android:name="android.intent.action.SEND"'
              r'\s*/>'
              r'.*?</intent-filter>',
              '',
              block,
              flags=re.S
          )

          block = re.sub(
              r'\s*<intent-filter>'
              r'\s*<action\s+'
              r'android:name="android.intent.action.SEND_MULTIPLE"'
              r'\s*/>'
              r'.*?</intent-filter>',
              '',
              block,
              flags=re.S
          )

          # ======================================================
          # FILTROS NOVOS
          # ======================================================

          filters = """
              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="audio/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND_MULTIPLE" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="audio/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="image/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND_MULTIPLE" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="image/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="*/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND_MULTIPLE" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="*/*" />
              </intent-filter>
          """

          block = block.replace(
              "</activity>",
              filters + "\n</activity>",
              1
          )

          text = (
              text[:match.start()]
              + block
              + text[match.end():]
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "AndroidManifest.xml atualizado."
          )
          PY

      # ============================================================
      # 16. VALIDAÇÃO COMPLETA ANTES DO GRADLE
      # ============================================================

      - name: Auditoria pré-Gradle
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao/MainActivity.java"

          BRIDGE="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao/PermissionBridgePlugin.java"

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          VARIABLES="$PROJECT_DIR/android/variables.gradle"

          BUILD="$PROJECT_DIR/android/app/build.gradle"

          echo "=================================================="
          echo "AUDITORIA PRÉ-GRADLE"
          echo "=================================================="

          # --------------------------------------------------------
          # ARQUIVOS
          # --------------------------------------------------------

          for file in \
            "$MAIN" \
            "$BRIDGE" \
            "$MANIFEST" \
            "$BUILD"
          do

            test -s "$file" || {
              echo "ERRO: arquivo ausente ou vazio:"
              echo "$file"
              exit 1
            }

          done

          # --------------------------------------------------------
          # SDK
          # --------------------------------------------------------

          if [ -f "$VARIABLES" ]; then

            grep -Eq \
              '^\s*compileSdkVersion = 35\s*$' \
              "$VARIABLES" || {
                echo "ERRO: compileSdkVersion != 35"
                exit 1
              }

            grep -Eq \
              '^\s*targetSdkVersion = 35\s*$' \
              "$VARIABLES" || {
                echo "ERRO: targetSdkVersion != 35"
                exit 1
              }

            grep -Eq \
              '^\s*minSdkVersion = 26\s*$' \
              "$VARIABLES" || {
                echo "ERRO: minSdkVersion != 26"
                exit 1
              }

          else

            grep -Eq \
              '^\s*compileSdk 35\s*$' \
              "$BUILD" || {
                echo "ERRO: compileSdk 35 não encontrado."
                exit 1
              }

            grep -Eq \
              '^\s*minSdk 26\s*$' \
              "$BUILD" || {
                echo "ERRO: minSdk 26 não encontrado."
                exit 1
              }

            grep -Eq \
              '^\s*targetSdk 35\s*$' \
              "$BUILD" || {
                echo "ERRO: targetSdk 35 não encontrado."
                exit 1
              }

          fi

          # --------------------------------------------------------
          # VERSÃO
          # --------------------------------------------------------

          grep -q \
            'versionCode 120' \
            "$BUILD" || {
              echo "ERRO: versionCode 120 ausente."
              exit 1
            }

          grep -q \
            'versionName "1.20.0"' \
            "$BUILD" || {
              echo "ERRO: versionName 1.20.0 ausente."
              exit 1
            }

          # --------------------------------------------------------
          # PROTEÇÃO CONTRA O ERRO 35()
          # --------------------------------------------------------

          if grep -Eq \
              'compileSdk.*35[[:space:]]*\(' \
              "$BUILD"
          then

            echo \
              "ERRO: compileSdk ainda está sendo interpretado como função 35()."

            exit 1
          fi

          # --------------------------------------------------------
          # MAIN ACTIVITY
          # --------------------------------------------------------

          grep -q \
            'PermissionBridgePlugin' \
            "$MAIN" || {
              echo "ERRO: PermissionBridge não registrado."
              exit 1
            }

          grep -q \
            'handleSharedIntent' \
            "$MAIN" || {
              echo "ERRO: handleSharedIntent ausente."
              exit 1
            }

          grep -q \
            'getIntent()' \
            "$MAIN" || {
              echo "ERRO: Intent inicial ausente."
              exit 1
            }

          grep -q \
            'onNewIntent' \
            "$MAIN" || {
              echo "ERRO: onNewIntent ausente."
              exit 1
            }

          # --------------------------------------------------------
          # BRIDGE
          # --------------------------------------------------------

          grep -q \
            'ACTION_SEND' \
            "$BRIDGE" || {
              echo "ERRO: ACTION_SEND ausente."
              exit 1
            }

          grep -q \
            'ACTION_SEND_MULTIPLE' \
            "$BRIDGE" || {
              echo "ERRO: ACTION_SEND_MULTIPLE ausente."
              exit 1
            }

          grep -q \
            'EXTRA_STREAM' \
            "$BRIDGE" || {
              echo "ERRO: EXTRA_STREAM ausente."
              exit 1
            }

          grep -q \
            'getClipData' \
            "$BRIDGE" || {
              echo "ERRO: ClipData ausente."
              exit 1
            }

          grep -q \
            'openInputStream' \
            "$BRIDGE" || {
              echo "ERRO: cópia do URI ausente."
              exit 1
            }

          grep -q \
            'shared-media-inbox' \
            "$BRIDGE" || {
              echo "ERRO: inbox persistente ausente."
              exit 1
            }

          grep -q \
            'notifyListeners("sharedMedia"' \
            "$BRIDGE" || {
              echo "ERRO: evento sharedMedia ausente."
              exit 1
            }

          grep -q \
            'getSharedMedia' \
            "$BRIDGE" || {
              echo "ERRO: getSharedMedia ausente."
              exit 1
            }

          grep -q \
            'listSharedMedia' \
            "$BRIDGE" || {
              echo "ERRO: listSharedMedia ausente."
              exit 1
            }

          grep -q \
            'readSharedMedia' \
            "$BRIDGE" || {
              echo "ERRO: readSharedMedia ausente."
              exit 1
            }

          grep -q \
            'claimInitialSync' \
            "$BRIDGE" || {
              echo "ERRO: claimInitialSync ausente."
              exit 1
            }

          grep -q \
            'put("data"' \
            "$BRIDGE" || {
              echo "ERRO: readSharedMedia sem retorno data."
              exit 1
            }

          # --------------------------------------------------------
          # MANIFEST
          # --------------------------------------------------------

          grep -q \
            'android.permission.READ_CONTACTS' \
            "$MANIFEST" || {
              echo "ERRO: READ_CONTACTS ausente."
              exit 1
            }

          grep -q \
            'android.permission.WRITE_CONTACTS' \
            "$MANIFEST" || {
              echo "ERRO: WRITE_CONTACTS ausente."
              exit 1
            }

          grep -q \
            'android.permission.RECORD_AUDIO' \
            "$MANIFEST" || {
              echo "ERRO: RECORD_AUDIO ausente."
              exit 1
            }

          grep -q \
            'android.permission.CAMERA' \
            "$MANIFEST" || {
              echo "ERRO: CAMERA ausente."
              exit 1
            }

          grep -q \
            'android:launchMode="singleTask"' \
            "$MANIFEST" || {
              echo "ERRO: singleTask ausente."
              exit 1
            }

          grep -q \
            'android:grantUriPermissions="true"' \
            "$MANIFEST" || {
              echo "ERRO: grantUriPermissions ausente."
              exit 1
            }

          grep -q \
            'android.intent.action.SEND' \
            "$MANIFEST" || {
              echo "ERRO: SEND ausente."
              exit 1
            }

          grep -q \
            'android.intent.action.SEND_MULTIPLE' \
            "$MANIFEST" || {
              echo "ERRO: SEND_MULTIPLE ausente."
              exit 1
            }

          grep -q \
            'android:mimeType="audio/\*"' \
            "$MANIFEST" || {
              echo "ERRO: audio/* ausente."
              exit 1
            }

          grep -q \
            'android:mimeType="image/\*"' \
            "$MANIFEST" || {
              echo "ERRO: image/* ausente."
              exit 1
            }

          grep -q \
            'android:mimeType="\*/\*"' \
            "$MANIFEST" || {
              echo "ERRO: */* ausente."
              exit 1
            }

          echo
          echo "=================================================="
          echo "AUDITORIA PRÉ-GRADLE: OK"
          echo "=================================================="

      # ============================================================
      # 17. CRIAR KEYSTORE TEMPORÁRIA
      # ============================================================

      - name: Criar keystore temporária
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE="$PROJECT_DIR/android/release-key.jks"

          printf '%s' \
            "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE"

          test -s "$KEYSTORE"

          chmod 600 "$KEYSTORE"

          echo \
            "KEYSTORE_PATH=$GITHUB_WORKSPACE/$KEYSTORE" \
            >> "$GITHUB_ENV"

          echo "Keystore criada."

      # ============================================================
      # 18. COMPILAR RELEASE
      # ============================================================

      - name: Compilar APK Release
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          echo "=================================================="
          echo "EXECUTANDO GRADLE"
          echo "=================================================="

          ./gradlew \
            clean \
            assembleRelease \
            --no-daemon \
            --stacktrace

          echo
          echo "=================================================="
          echo "GRADLE FINALIZADO"
          echo "=================================================="

      # ============================================================
      # 19. LOCALIZAR APK
      # ============================================================

      - name: Localizar APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(
            find \
              "$PROJECT_DIR/android/app/build/outputs/apk" \
              -type f \
              -name '*.apk' \
              | sort \
              | head -n 1
          )

          if [ -z "$APK" ]; then

            echo "ERRO: nenhum APK foi gerado."

            find \
              "$PROJECT_DIR/android" \
              -type f \
              -name '*.apk' \
              -print || true

            exit 1
          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/app-release-unsigned.apk"

          echo \
            "APK_UNSIGNED=$GITHUB_WORKSPACE/app-release-unsigned.apk" \
            >> "$GITHUB_ENV"

          echo "APK encontrado:"

          ls -lh "$APK"

      # ============================================================
      # 20. ASSINAR APK
      # ============================================================

      - name: Assinar APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APKSIGNER=$(
            find \
              "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )

          ZIPALIGN=$(
            find \
              "$ANDROID_HOME/build-tools" \
              -type f \
              -name zipalign \
              | sort -V \
              | tail -n 1
          )

          test -x "$APKSIGNER" || {
            echo "ERRO: apksigner não encontrado."
            exit 1
          }

          test -x "$ZIPALIGN" || {
            echo "ERRO: zipalign não encontrado."
            exit 1
          }

          echo "Validando keystore..."

          keytool \
            -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          echo "Keystore válida."

          echo "Alinhando APK..."

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$APK_UNSIGNED" \
            "$GITHUB_WORKSPACE/app-release-aligned.apk"

          echo "Assinando APK..."

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/app-release.apk" \
            "$GITHUB_WORKSPACE/app-release-aligned.apk"

          test -s \
            "$GITHUB_WORKSPACE/app-release.apk"

          echo "APK assinado."

      # ============================================================
      # 21. VALIDAR APK FINAL
      # ============================================================

      - name: Validar APK final
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/app-release.apk"

          AAPT=$(
            find \
              "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt \
              | sort -V \
              | tail -n 1
          )

          APKSIGNER=$(
            find \
              "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )

          test -x "$AAPT" || {
            echo "ERRO: aapt não encontrado."
            exit 1
          }

          test -x "$APKSIGNER" || {
            echo "ERRO: apksigner não encontrado."
            exit 1
          }

          echo "=================================================="
          echo "VALIDANDO ASSINATURA"
          echo "=================================================="

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK"

          echo
          echo "=================================================="
          echo "VALIDANDO PERMISSÕES"
          echo "=================================================="

          "$AAPT" \
            dump permissions \
            "$APK" \
            | tee /tmp/apk-permissions.txt

          for perm in \
            READ_CONTACTS \
            WRITE_CONTACTS \
            RECORD_AUDIO \
            CAMERA
          do

            grep -q \
              "android.permission.$perm" \
              /tmp/apk-permissions.txt || {

                echo \
                  "ERRO: android.permission.$perm não está no APK."

                exit 1
            }

          done

          echo
          echo "=================================================="
          echo "VALIDANDO MANIFEST FINAL DO APK"
          echo "=================================================="

          "$AAPT" \
            dump xmltree \
            "$APK" \
            AndroidManifest.xml \
            > /tmp/final-manifest.txt

          grep -q \
            'singleTask' \
            /tmp/final-manifest.txt || {

            echo \
              "ERRO: singleTask não está no APK."

            exit 1
          }

          grep -q \
            'audio/\*' \
            /tmp/final-manifest.txt || {

            echo \
              "ERRO: audio/* não está no APK."

            exit 1
          }

          grep -q \
            'image/\*' \
            /tmp/final-manifest.txt || {

            echo \
              "ERRO: image/* não está no APK."

            exit 1
          }

          grep -q \
            '\*/\*' \
            /tmp/final-manifest.txt || {

            echo \
              "ERRO: */* não está no APK."

            exit 1
          }

          grep -q \
            'android.intent.action.SEND' \
            /tmp/final-manifest.txt || {

            echo \
              "ERRO: ACTION_SEND não está no APK."

            exit 1
          }

          grep -q \
            'android.intent.action.SEND_MULTIPLE' \
            /tmp/final-manifest.txt || {

            echo \
              "ERRO: ACTION_SEND_MULTIPLE não está no APK."

            exit 1
          }

          grep -q \
            'grantUriPermissions' \
            /tmp/final-manifest.txt || {

            echo \
              "ERRO: grantUriPermissions não está no APK."

            exit 1
          }

          echo
          echo "=================================================="
          echo "APK FINAL VALIDADO"
          echo "=================================================="

          ls -lh "$APK"

          echo
          echo "SHA256:"

          sha256sum "$APK"

      # ============================================================
      # 22. DISPONIBILIZAR APK
      # ============================================================

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: gestao-sacerdotista-aime-v120-whatsapp-audio-share
          path: app-release.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 23. LIMPEZA
      # ============================================================

      - name: Limpar arquivos temporários
        if: always()
        shell: bash
        run: |
          rm -f \
            "$PROJECT_DIR/android/release-key.jks" \
            "$PROJECT_DIR/android/app/release-key.jks" \
            app-release-unsigned.apk \
            app-release-aligned.apk \
            2>/dev/null || true

          echo "Limpeza concluída."

name: Build Android APK - V120 - WHATSAPP AUDIO SHARE - FIXED

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: MARCADOR - V120 INICIADO
        run: |
          echo "=================================================="
          echo "GESTÃO SACERDOTISTA AIMÊ - V120"
          echo "WHATSAPP AUDIO SHARE"
          echo "=================================================="
          echo "Commit: $GITHUB_SHA"
          echo "Run: $GITHUB_RUN_NUMBER"
          echo "=================================================="


      # ============================================================
      # NODE
      # ============================================================

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # JAVA
      # ============================================================

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      # ============================================================
      # SECRETS
      # ============================================================

      - name: Validar secrets de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "VALIDANDO SECRETS"
          echo "=================================================="

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          echo "Secrets de assinatura encontrados."


      # ============================================================
      # LOCALIZAR ZIP
      # ============================================================

      - name: Encontrar ZIP do projeto
        run: |
          set -e

          echo "=================================================="
          echo "PROCURANDO ZIP DO PROJETO"
          echo "=================================================="

          find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            -print \
            | sort

          ZIP_COUNT=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            | wc -l)

          if [ "$ZIP_COUNT" -ne 1 ]; then
            echo "ERRO: esperado exatamente 1 ZIP."
            echo "Quantidade encontrada: $ZIP_COUNT"
            exit 1
          fi

          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "ZIP selecionado:"
          echo "$ZIP_FILE"


      # ============================================================
      # DESCOMPACTAR
      # ============================================================

      - name: Descompactar projeto
        run: |
          set -e

          echo "=================================================="
          echo "DESCOMPACTANDO PROJETO"
          echo "=================================================="

          rm -rf app
          mkdir -p app

          unzip -q "$ZIP_FILE" -d app

          echo "Projeto descompactado."


      # ============================================================
      # LOCALIZAR PROJETO
      # ============================================================

      - name: Localizar projeto
        run: |
          set -e

          echo "=================================================="
          echo "LOCALIZANDO PACKAGE.JSON"
          echo "=================================================="

          PACKAGE_JSON=$(find app \
            -name package.json \
            -not -path "*/node_modules/*" \
            -type f \
            | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERRO: package.json não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto:"
          echo "$PROJECT_DIR"


      # ============================================================
      # DEPENDÊNCIAS
      # ============================================================

      - name: Ajustar dependências
        run: |
          set -e

          cd "$PROJECT_DIR"

          node <<'NODE'
          const fs = require("fs");

          const file = "package.json";

          const pkg = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          pkg.dependencies = pkg.dependencies || {};

          pkg.dependencies["@capacitor/core"] = "^7.4.3";
          pkg.dependencies["@capacitor/android"] = "^7.4.3";
          pkg.dependencies["@capacitor/camera"] = "^7.0.5";
          pkg.dependencies["@capacitor/share"] = "^7.0.2";
          pkg.dependencies["@capacitor/filesystem"] = "^7.0.2";
          pkg.dependencies["@capacitor-community/contacts"] = "7.2.0";
          pkg.dependencies["capacitor-voice-recorder"] = "7.0.6";
          pkg.dependencies["@capacitor/barcode-scanner"] = "2.0.4";

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + "\n"
          );
          NODE

          rm -rf node_modules
          rm -f package-lock.json

          echo "Dependências ajustadas."


      # ============================================================
      # NPM INSTALL
      # ============================================================

      - name: Instalar dependências
        run: |
          set -e

          cd "$PROJECT_DIR"

          npm install

          npm install -D @capacitor/cli@7.4.3

          echo "Dependências instaladas."


      # ============================================================
      # BUILD WEB
      # ============================================================

      - name: Compilar aplicação web
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "COMPILANDO APLICAÇÃO WEB"
          echo "=================================================="

          npx vite build


      # ============================================================
      # CAPACITOR ANDROID
      # ============================================================

      - name: Adicionar Android
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap add android


      # ============================================================
      # MIN SDK
      # ============================================================

      - name: Ajustar SDK Android
        run: |
          set -e

          VARIABLES="$PROJECT_DIR/android/variables.gradle"

          if [ -f "$VARIABLES" ]; then
            sed -i \
              -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 26/g' \
              "$VARIABLES"
          fi

          echo "minSdk configurado."


      # ============================================================
      # CAP SYNC
      # ============================================================

      - name: Sincronizar Capacitor
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap sync android


      # ============================================================
      # PERMISSION BRIDGE
      # ============================================================

      - name: Criar PermissionBridge
        run: |
          set -e

          MAIN_DIR="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao"

          mkdir -p "$MAIN_DIR"

          cat > "$MAIN_DIR/PermissionBridgePlugin.java" <<'JAVA'
          package com.sacerdotisaaime.gestao;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ContentResolver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.provider.Settings;
          import android.util.Log;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginMethod;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.Locale;

          @CapacitorPlugin(
              name = "PermissionBridge"
          )
          public class PermissionBridgePlugin extends Plugin {

              private static final String TAG =
                  "PermissionBridge";

              private static final String INBOX =
                  "shared-media-inbox";

              private static final long MAX_AUDIO_BYTES =
                  50L * 1024L * 1024L;

              private static final long MAX_PHOTO_BYTES =
                  20L * 1024L * 1024L;

              private static final int REQUEST_CONTACTS =
                  5011;

              private static final int REQUEST_MICROPHONE =
                  5012;


              // ==================================================
              // LIFECYCLE
              // ==================================================

              @Override
              public void load() {
                  super.load();

                  Activity activity =
                      getActivity();

                  if (activity != null) {
                      processIntent(
                          activity.getIntent()
                      );
                  }
              }


              // ==================================================
              // PERMISSIONS
              // ==================================================

              @PluginMethod
              public void requestContactsPermission(
                  PluginCall call
              ) {

                  Activity activity =
                      getActivity();

                  if (activity == null) {
                      call.reject(
                          "Activity indisponível"
                      );
                      return;
                  }

                  if (
                      ContextCompat.checkSelfPermission(
                          activity,
                          Manifest.permission.READ_CONTACTS
                      ) == PackageManager.PERMISSION_GRANTED
                  ) {

                      JSObject result =
                          new JSObject();

                      result.put(
                          "granted",
                          true
                      );

                      call.resolve(result);
                      return;
                  }

                  ActivityCompat.requestPermissions(
                      activity,
                      new String[] {
                          Manifest.permission.READ_CONTACTS,
                          Manifest.permission.WRITE_CONTACTS
                      },
                      REQUEST_CONTACTS
                  );

                  JSObject result =
                      new JSObject();

                  result.put(
                      "granted",
                      false
                  );

                  result.put(
                      "requested",
                      true
                  );

                  call.resolve(result);
              }


              @PluginMethod
              public void requestMicrophonePermission(
                  PluginCall call
              ) {

                  Activity activity =
                      getActivity();

                  if (activity == null) {
                      call.reject(
                          "Activity indisponível"
                      );
                      return;
                  }

                  if (
                      ContextCompat.checkSelfPermission(
                          activity,
                          Manifest.permission.RECORD_AUDIO
                      ) == PackageManager.PERMISSION_GRANTED
                  ) {

                      JSObject result =
                          new JSObject();

                      result.put(
                          "granted",
                          true
                      );

                      call.resolve(result);
                      return;
                  }

                  ActivityCompat.requestPermissions(
                      activity,
                      new String[] {
                          Manifest.permission.RECORD_AUDIO
                      },
                      REQUEST_MICROPHONE
                  );

                  JSObject result =
                      new JSObject();

                  result.put(
                      "granted",
                      false
                  );

                  result.put(
                      "requested",
                      true
                  );

                  call.resolve(result);
              }


              // ==================================================
              // SETTINGS
              // ==================================================

              @PluginMethod
              public void openSettings(
                  PluginCall call
              ) {

                  try {

                      Intent intent =
                          new Intent(
                              Settings.ACTION_APPLICATION_DETAILS_SETTINGS
                          );

                      intent.setData(
                          Uri.parse(
                              "package:" +
                              getContext().getPackageName()
                          )
                      );

                      getContext().startActivity(
                          intent
                      );

                      call.resolve();

                  } catch (Exception e) {

                      call.reject(
                          "Não foi possível abrir configurações",
                          e
                      );
                  }
              }


              // ==================================================
              // INBOX
              // ==================================================

              private File getInboxDirectory() {

                  File dir =
                      new File(
                          getContext().getFilesDir(),
                          INBOX
                      );

                  if (!dir.exists()) {
                      //noinspection ResultOfMethodCallIgnored
                      dir.mkdirs();
                  }

                  return dir;
              }


              private String sanitizeFileName(
                  String name
              ) {

                  if (
                      name == null ||
                      name.trim().isEmpty()
                  ) {
                      name = "shared-media";
                  }

                  return name.replaceAll(
                      "[^a-zA-Z0-9._-]",
                      "_"
                  );
              }


              // ==================================================
              // BYTE SIGNATURE
              // ==================================================

              private boolean byteAt(
                  byte[] data,
                  int length,
                  int index,
                  int expected
              ) {

                  if (
                      index < 0 ||
                      index >= length
                  ) {
                      return false;
                  }

                  return
                      (data[index] & 0xff) ==
                      (expected & 0xff);
              }


              private boolean signature(
                  byte[] data,
                  int length,
                  int... values
              ) {

                  if (
                      length < values.length
                  ) {
                      return false;
                  }

                  for (
                      int i = 0;
                      i < values.length;
                      i++
                  ) {

                      if (
                          !byteAt(
                              data,
                              length,
                              i,
                              values[i]
                          )
                      ) {
                          return false;
                      }
                  }

                  return true;
              }


              // ==================================================
              // MIME DETECTION
              // ==================================================

              private String detectMime(
                  File file
              ) {

                  try (
                      FileInputStream input =
                          new FileInputStream(file)
                  ) {

                      byte[] h =
                          new byte[64];

                      int length =
                          input.read(h);

                      if (length <= 0) {
                          return null;
                      }


                      // JPEG

                      if (
                          signature(
                              h,
                              length,
                              0xff,
                              0xd8,
                              0xff
                          )
                      ) {
                          return "image/jpeg";
                      }


                      // PNG

                      if (
                          signature(
                              h,
                              length,
                              0x89,
                              0x50,
                              0x4e,
                              0x47,
                              0x0d,
                              0x0a,
                              0x1a,
                              0x0a
                          )
                      ) {
                          return "image/png";
                      }


                      // WEBP

                      if (
                          length >= 12 &&
                          byteAt(h, length, 0, 'R') &&
                          byteAt(h, length, 1, 'I') &&
                          byteAt(h, length, 2, 'F') &&
                          byteAt(h, length, 3, 'F') &&
                          byteAt(h, length, 8, 'W') &&
                          byteAt(h, length, 9, 'E') &&
                          byteAt(h, length, 10, 'B') &&
                          byteAt(h, length, 11, 'P')
                      ) {
                          return "image/webp";
                      }


                      // OGG

                      if (
                          signature(
                              h,
                              length,
                              'O',
                              'g',
                              'g',
                              'S'
                          )
                      ) {
                          return "audio/ogg";
                      }


                      // WAV

                      if (
                          length >= 12 &&
                          byteAt(h, length, 0, 'R') &&
                          byteAt(h, length, 1, 'I') &&
                          byteAt(h, length, 2, 'F') &&
                          byteAt(h, length, 3, 'F') &&
                          byteAt(h, length, 8, 'W') &&
                          byteAt(h, length, 9, 'A') &&
                          byteAt(h, length, 10, 'V') &&
                          byteAt(h, length, 11, 'E')
                      ) {
                          return "audio/wav";
                      }


                      // WEBM

                      if (
                          signature(
                              h,
                              length,
                              0x1a,
                              0x45,
                              0xdf,
                              0xa3
                          )
                      ) {
                          return "audio/webm";
                      }


                      // MP3 ID3

                      if (
                          signature(
                              h,
                              length,
                              'I',
                              'D',
                              '3'
                          )
                      ) {
                          return "audio/mpeg";
                      }


                      // MP3 FRAME

                      if (length >= 2) {

                          int first =
                              h[0] & 0xff;

                          int second =
                              h[1] & 0xff;

                          if (
                              first == 0xff &&
                              (second & 0xe0) == 0xe0
                          ) {
                              return "audio/mpeg";
                          }
                      }


                      // MP4 / M4A / M4B / HEIC

                      if (length >= 12) {

                          boolean isFtyp =
                              byteAt(h, length, 4, 'f') &&
                              byteAt(h, length, 5, 't') &&
                              byteAt(h, length, 6, 'y') &&
                              byteAt(h, length, 7, 'p');

                          if (isFtyp) {

                              String full =
                                  new String(
                                      h,
                                      0,
                                      length,
                                      java.nio.charset.StandardCharsets.US_ASCII
                                  ).toLowerCase(
                                      Locale.US
                                  );

                              if (
                                  full.contains("m4a") ||
                                  full.contains("m4b")
                              ) {
                                  return "audio/mp4";
                              }

                              if (
                                  full.contains("heic") ||
                                  full.contains("heix") ||
                                  full.contains("hevc") ||
                                  full.contains("hevx")
                              ) {
                                  return "image/heic";
                              }

                              return "video/mp4";
                          }
                      }

                  } catch (Exception e) {

                      Log.e(
                          TAG,
                          "Erro detectando MIME",
                          e
                      );
                  }

                  return null;
              }


              // ==================================================
              // EXTENSION
              // ==================================================

              private String extensionFromMime(
                  String mime
              ) {

                  if (mime == null) {
                      return null;
                  }

                  String lower =
                      mime.toLowerCase(
                          Locale.US
                      );

                  if (
                      lower.equals("image/jpeg")
                  ) {
                      return ".jpg";
                  }

                  if (
                      lower.equals("image/png")
                  ) {
                      return ".png";
                  }

                  if (
                      lower.equals("image/webp")
                  ) {
                      return ".webp";
                  }

                  if (
                      lower.equals("image/heic")
                  ) {
                      return ".heic";
                  }

                  if (
                      lower.equals("audio/ogg")
                  ) {
                      return ".ogg";
                  }

                  if (
                      lower.equals("audio/wav") ||
                      lower.equals("audio/x-wav")
                  ) {
                      return ".wav";
                  }

                  if (
                      lower.equals("audio/mpeg")
                  ) {
                      return ".mp3";
                  }

                  if (
                      lower.equals("audio/mp4")
                  ) {
                      return ".m4a";
                  }

                  if (
                      lower.equals("audio/webm")
                  ) {
                      return ".webm";
                  }

                  return null;
              }


              private boolean hasKnownExtension(
                  String name
              ) {

                  if (name == null) {
                      return false;
                  }

                  String lower =
                      name.toLowerCase(
                          Locale.US
                      );

                  String[] extensions = {
                      ".jpg",
                      ".jpeg",
                      ".png",
                      ".webp",
                      ".heic",
                      ".heif",
                      ".ogg",
                      ".opus",
                      ".wav",
                      ".mp3",
                      ".m4a",
                      ".m4b",
                      ".mp4",
                      ".webm"
                  };

                  for (
                      String ext :
                      extensions
                  ) {

                      if (
                          lower.endsWith(ext)
                      ) {
                          return true;
                      }
                  }

                  return false;
              }


              // ==================================================
              // COPIAR ARQUIVO
              // ==================================================
              //
              // CORREÇÃO DO ERRO ANTERIOR:
              // FileInputStream/FileOutputStream agora estão
              // protegidos por try/catch IOException.
              //

              private boolean copyFile(
                  File temp,
                  File output
              ) {

                  try {

                      File parent =
                          output.getParentFile();

                      if (
                          parent != null &&
                          !parent.exists()
                      ) {

                          if (
                              !parent.mkdirs() &&
                              !parent.exists()
                          ) {
                              return false;
                          }
                      }


                      try (
                          FileInputStream input =
                              new FileInputStream(temp);

                          FileOutputStream out =
                              new FileOutputStream(output)
                      ) {

                          byte[] buffer =
                              new byte[8192];

                          int read;

                          while (
                              (read =
                                  input.read(buffer)
                              ) != -1
                          ) {

                              out.write(
                                  buffer,
                                  0,
                                  read
                              );
                          }

                          out.flush();
                      }

                      return true;

                  } catch (IOException e) {

                      Log.e(
                          TAG,
                          "Erro ao copiar arquivo compartilhado",
                          e
                      );

                      if (output.exists()) {
                          //noinspection ResultOfMethodCallIgnored
                          output.delete();
                      }

                      return false;
                  }
              }


              // ==================================================
              // NOME DO ARQUIVO
              // ==================================================

              private String queryDisplayName(
                  Uri uri
              ) {

                  try {

                      android.database.Cursor cursor =
                          getContext()
                              .getContentResolver()
                              .query(
                                  uri,
                                  null,
                                  null,
                                  null,
                                  null
                              );

                      if (cursor != null) {

                          int nameIndex =
                              cursor.getColumnIndex(
                                  android.provider.OpenableColumns.DISPLAY_NAME
                              );

                          if (
                              cursor.moveToFirst() &&
                              nameIndex >= 0 &&
                              !cursor.isNull(nameIndex)
                          ) {

                              String name =
                                  cursor.getString(
                                      nameIndex
                                  );

                              cursor.close();

                              return name;
                          }

                          cursor.close();
                      }

                  } catch (Exception e) {

                      Log.w(
                          TAG,
                          "Erro obtendo nome do arquivo",
                          e
                      );
                  }

                  return "shared-media";
              }


              // ==================================================
              // SALVAR URI
              // ==================================================

              private JSObject saveUri(
                  Uri uri,
                  String originalName,
                  String suppliedMime
              ) {

                  if (uri == null) {
                      return null;
                  }

                  ContentResolver resolver =
                      getContext()
                          .getContentResolver();


                  String name =
                      sanitizeFileName(
                          originalName
                      );

                  if (
                      name.trim().isEmpty()
                  ) {
                      name = "shared-media";
                  }


                  String mime =
                      suppliedMime;


                  if (
                      mime == null ||
                      mime.trim().isEmpty() ||
                      mime.equals("*/*")
                  ) {

                      try {
                          mime =
                              resolver.getType(uri);
                      } catch (Exception ignored) {
                      }
                  }


                  File inbox =
                      getInboxDirectory();


                  File temp =
                      new File(
                          inbox,
                          ".tmp_" +
                          System.currentTimeMillis() +
                          "_" +
                          Math.abs(
                              uri.toString().hashCode()
                          )
                      );


                  String baseName =
                      System.currentTimeMillis() +
                      "_" +
                      name;


                  File output =
                      new File(
                          inbox,
                          baseName
                      );


                  try {

                      try (
                          InputStream input =
                              resolver.openInputStream(uri);

                          FileOutputStream out =
                              new FileOutputStream(temp)
                      ) {

                          if (input == null) {
                              return null;
                          }

                          byte[] buffer =
                              new byte[8192];

                          long total = 0;

                          int read;

                          while (
                              (read =
                                  input.read(buffer)
                              ) != -1
                          ) {

                              total += read;

                              long limit =
                                  MAX_AUDIO_BYTES;

                              if (
                                  mime != null &&
                                  mime.startsWith(
                                      "image/"
                                  )
                              ) {
                                  limit =
                                      MAX_PHOTO_BYTES;
                              }

                              String lower =
                                  name.toLowerCase(
                                      Locale.US
                                  );

                              if (
                                  lower.endsWith(".jpg") ||
                                  lower.endsWith(".jpeg") ||
                                  lower.endsWith(".png") ||
                                  lower.endsWith(".webp") ||
                                  lower.endsWith(".heic") ||
                                  lower.endsWith(".heif")
                              ) {
                                  limit =
                                      MAX_PHOTO_BYTES;
                              }

                              if (
                                  total > limit
                              ) {

                                  Log.e(
                                      TAG,
                                      "Arquivo excede o limite permitido."
                                  );

                                  return null;
                              }

                              out.write(
                                  buffer,
                                  0,
                                  read
                              );
                          }

                          out.flush();
                      }


                      String detectedMime =
                          detectMime(temp);

                      if (
                          detectedMime != null
                      ) {
                          mime =
                              detectedMime;
                      }


                      if (
                          mime == null ||
                          mime.trim().isEmpty()
                      ) {
                          mime =
                              "application/octet-stream";
                      }


                      // Adicionar extensão quando não existir

                      if (
                          !hasKnownExtension(name)
                      ) {

                          String extension =
                              extensionFromMime(
                                  mime
                              );

                          if (
                              extension != null
                          ) {

                              output =
                                  new File(
                                      inbox,
                                      baseName +
                                      extension
                                  );
                          }
                      }


                      if (
                          !copyFile(
                              temp,
                              output
                          )
                      ) {
                          return null;
                      }


                      if (
                          temp.exists()
                      ) {
                          //noinspection ResultOfMethodCallIgnored
                          temp.delete();
                      }


                      JSObject result =
                          new JSObject();

                      result.put(
                          "id",
                          output.getName()
                      );

                      result.put(
                          "name",
                          output.getName()
                      );

                      result.put(
                          "path",
                          output.getAbsolutePath()
                      );

                      result.put(
                          "mimeType",
                          mime
                      );

                      result.put(
                          "size",
                          output.length()
                      );

                      result.put(
                          "createdAt",
                          System.currentTimeMillis()
                      );

                      return result;

                  } catch (Exception e) {

                      Log.e(
                          TAG,
                          "Erro salvando mídia compartilhada",
                          e
                      );

                      if (
                          temp.exists()
                      ) {
                          //noinspection ResultOfMethodCallIgnored
                          temp.delete();
                      }

                      if (
                          output.exists()
                      ) {
                          //noinspection ResultOfMethodCallIgnored
                          output.delete();
                      }

                      return null;
                  }
              }


              // ==================================================
              // PROCESSAR INTENT
              // ==================================================

              public static void handleSharedIntent(
                  Intent intent
              ) {

                  /*
                   * O processamento efetivo acontece na instância
                   * do plugin quando o Capacitor carrega.
                   *
                   * Este método existe para manter a chamada
                   * compatível com MainActivity.
                   */
              }


              private void processIntent(
                  Intent intent
              ) {

                  if (intent == null) {
                      return;
                  }


                  String action =
                      intent.getAction();


                  if (
                      !Intent.ACTION_SEND.equals(action) &&
                      !Intent.ACTION_SEND_MULTIPLE.equals(action)
                  ) {
                      return;
                  }


                  ArrayList<Uri> uris =
                      new ArrayList<>();


                  Uri single =
                      intent.getParcelableExtra(
                          Intent.EXTRA_STREAM
                      );

                  if (single != null) {
                      uris.add(single);
                  }


                  ClipData clipData =
                      intent.getClipData();

                  if (clipData != null) {

                      for (
                          int i = 0;
                          i < clipData.getItemCount();
                          i++
                      ) {

                          Uri uri =
                              clipData
                                  .getItemAt(i)
                                  .getUri();

                          if (
                              uri != null &&
                              !uris.contains(uri)
                          ) {
                              uris.add(uri);
                          }
                      }
                  }


                  if (
                      uris.isEmpty()
                  ) {
                      return;
                  }


                  ArrayList<JSObject> saved =
                      new ArrayList<>();


                  String suppliedMime =
                      intent.getType();


                  for (
                      Uri uri :
                      uris
                  ) {

                      String name =
                          queryDisplayName(uri);

                      JSObject item =
                          saveUri(
                              uri,
                              name,
                              suppliedMime
                          );

                      if (item != null) {
                          saved.add(item);
                      }
                  }


                  if (
                      saved.isEmpty()
                  ) {
                      return;
                  }


                  JSArray array =
                      new JSArray();


                  for (
                      JSObject item :
                      saved
                  ) {
                      array.put(item);
                  }


                  JSObject event =
                      new JSObject();

                  event.put(
                      "items",
                      array
                  );

                  event.put(
                      "count",
                      saved.size()
                  );


                  notifyListeners(
                      "sharedMedia",
                      event,
                      true
                  );
              }


              // ==================================================
              // INITIAL SYNC
              // ==================================================

              @PluginMethod
              public void claimInitialSync(
                  PluginCall call
              ) {

                  JSObject result =
                      new JSObject();

                  result.put(
                      "items",
                      listFiles()
                  );

                  call.resolve(result);
              }


              @PluginMethod
              public void getSharedMedia(
                  PluginCall call
              ) {

                  JSObject result =
                      new JSObject();

                  result.put(
                      "items",
                      listFiles()
                  );

                  call.resolve(result);
              }


              @PluginMethod
              public void listSharedMedia(
                  PluginCall call
              ) {

                  JSObject result =
                      new JSObject();

                  result.put(
                      "items",
                      listFiles()
                  );

                  call.resolve(result);
              }


              // ==================================================
              // LISTAR ARQUIVOS
              // ==================================================

              private JSArray listFiles() {

                  JSArray array =
                      new JSArray();


                  File dir =
                      getInboxDirectory();


                  File[] files =
                      dir.listFiles();


                  if (
                      files == null
                  ) {
                      return array;
                  }


                  for (
                      File file :
                      files
                  ) {

                      if (
                          !file.isFile()
                      ) {
                          continue;
                      }


                      if (
                          file.getName()
                              .startsWith(".tmp_")
                      ) {
                          continue;
                      }


                      String mime =
                          detectMime(file);


                      if (
                          mime == null
                      ) {
                          mime =
                              "application/octet-stream";
                      }


                      JSObject item =
                          new JSObject();

                      item.put(
                          "id",
                          file.getName()
                      );

                      item.put(
                          "name",
                          file.getName()
                      );

                      item.put(
                          "path",
                          file.getAbsolutePath()
                      );

                      item.put(
                          "mimeType",
                          mime
                      );

                      item.put(
                          "size",
                          file.length()
                      );

                      item.put(
                          "createdAt",
                          file.lastModified()
                      );


                      array.put(item);
                  }


                  return array;
              }


              // ==================================================
              // READ MEDIA
              // ==================================================

              @PluginMethod
              public void readSharedMedia(
                  PluginCall call
              ) {

                  String id =
                      call.getString("id");


                  if (
                      id == null ||
                      id.trim().isEmpty()
                  ) {

                      call.reject(
                          "ID da mídia não informado"
                      );

                      return;
                  }


                  File file =
                      new File(
                          getInboxDirectory(),
                          sanitizeFileName(id)
                      );


                  if (
                      !file.exists() ||
                      !file.isFile()
                  ) {

                      call.reject(
                          "Mídia não encontrada"
                      );

                      return;
                  }


                  JSObject result =
                      new JSObject();

                  result.put(
                      "id",
                      file.getName()
                  );

                  result.put(
                      "name",
                      file.getName()
                  );

                  result.put(
                      "path",
                      file.getAbsolutePath()
                  );

                  result.put(
                      "mimeType",
                      detectMime(file)
                  );

                  result.put(
                      "size",
                      file.length()
                  );


                  call.resolve(result);
              }


              // ==================================================
              // DELETE MEDIA
              // ==================================================

              @PluginMethod
              public void deleteSharedMedia(
                  PluginCall call
              ) {

                  String id =
                      call.getString("id");


                  if (
                      id == null ||
                      id.trim().isEmpty()
                  ) {

                      call.reject(
                          "ID da mídia não informado"
                      );

                      return;
                  }


                  File file =
                      new File(
                          getInboxDirectory(),
                          sanitizeFileName(id)
                      );


                  if (
                      !file.exists()
                  ) {
                      call.resolve();
                      return;
                  }


                  if (
                      !file.delete()
                  ) {

                      call.reject(
                          "Não foi possível excluir a mídia"
                      );

                      return;
                  }


                  call.resolve();
              }


              // ==================================================
              // NOVA INTENT
              // ==================================================

              @Override
              protected void handleOnNewIntent(
                  Intent intent
              ) {

                  super.handleOnNewIntent(
                      intent
                  );

                  processIntent(intent);
              }
          }

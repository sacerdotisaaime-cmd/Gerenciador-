      # ============================================================
      # MANIFEST
      # ============================================================

      - name: Configurar Manifest para compartilhamento
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # PERMISSÕES
          # --------------------------------------------------------

          permissions = [
              "android.permission.READ_CONTACTS",
              "android.permission.WRITE_CONTACTS",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
          ]

          for permission in permissions:

              if permission not in text:

                  text = text.replace(
                      "<application",
                      f'    <uses-permission android:name="{permission}" />\n'
                      "<application",
                      1
                  )

          # --------------------------------------------------------
          # MAIN ACTIVITY
          # --------------------------------------------------------

          start = text.find(
              '<activity android:name=".MainActivity"'
          )

          if start < 0:

              start = text.find(
                  'android:name=".MainActivity"'
              )

              if start >= 0:

                  start = text.rfind(
                      "<activity",
                      0,
                      start
                  )

          if start < 0:

              raise SystemExit(
                  "ERRO: MainActivity não encontrada."
              )

          end = text.find(
              "</activity>",
              start
          )

          if end < 0:

              raise SystemExit(
                  "ERRO: fechamento da MainActivity não encontrado."
              )

          end += len("</activity>")

          activity = text[start:end]

          # Remove atributos anteriores.

          activity = re.sub(
              r'\s+android:exported="[^"]*"',
              '',
              activity
          )

          activity = re.sub(
              r'\s+android:grantUriPermissions="[^"]*"',
              '',
              activity
          )

          activity = re.sub(
              r'\s+android:launchMode="[^"]*"',
              '',
              activity
          )

          activity = activity.replace(
              "<activity",
              '<activity '
              'android:exported="true" '
              'android:grantUriPermissions="true" '
              'android:launchMode="singleTask"',
              1
          )

          # Remove filtros SEND antigos.

          activity = re.sub(
              r'\s*<intent-filter>'
              r'.*?'
              r'</intent-filter>',
              '',
              activity,
              flags=re.S
          )

          filters = """
              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="audio/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND_MULTIPLE" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="audio/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="image/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND_MULTIPLE" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="image/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="*/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND_MULTIPLE" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="*/*" />
              </intent-filter>
          """

          activity = activity.replace(
              "</activity>",
              filters + "\n</activity>",
              1
          )

          text = (
              text[:start]
              + activity
              + text[end:]
          )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY


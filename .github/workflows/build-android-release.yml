          grep -q \
            'image/\*' \
            "$FINAL_MANIFEST" || {
              echo "ERRO: image/* não encontrado no APK."
              exit 1
            }

          grep -q \
            '\*/\*' \
            "$FINAL_MANIFEST" || {
              echo "ERRO: */* não encontrado no APK."
              exit 1

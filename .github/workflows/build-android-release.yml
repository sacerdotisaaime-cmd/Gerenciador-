          deps = []
          if "com.google.android.gms:play-services-auth:21.6.0" not in text:
              deps.append("    implementation 'com.google.android.gms:play-services-auth:21.6.0'")
          if "com.journeyapps:zxing-android-embedded:4.3.0" not in text:
              deps.append("    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'")
          if deps:
              block = "dependencies {\n" + "\n".join(deps) + "\n"
              if "dependencies {" in text:
                  text = text.replace("dependencies {", block, 1)
              else:
                  text += "\n" + block + "}\n"

          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.55.0"', text, count=1)
          text = re.sub(r'versionCode\s+\d+', 'versionCode 155', text, count=1)

          if 'signingConfigs {' not in text:
              signing = '''
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              '''
              text = text.replace('android {', 'android {' + signing, 1)
          elif 'signingConfigs.release' not in text:
              text = text.replace('signingConfigs {', '''signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              ''', 1)

          build_types = re.search(r'buildTypes\s*\{', text)
          if not build_types:
              text += '''
              \nbuildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              '''
          else:
              tail = text[build_types.end():]
              release = re.search(r'release\s*\{', tail)
              if not release:
                  pos = build_types.end()
                  text = text[:pos] + '''
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
                  ''' + text[pos:]
              elif 'signingConfig signingConfigs.release' not in tail[release.end():release.end()+2500]:
                  pos = build_types.end() + release.end()
                  text = text[:pos] + '''
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  ''' + text[pos:]

          path.write_text(text)
          PY

          keytool -list \
            -keystore "$PROJECT_DIR/android/app/release-key.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "Keystore e alias validados."

      - name: Validar Manifest
        shell: bash
        run: |
          set -e
          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          for PERM in INTERNET READ_CONTACTS WRITE_CONTACTS RECORD_AUDIO CAMERA POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM SYSTEM_ALERT_WINDOW; do
            FULL="android.permission.$PERM"
            grep -q "$FULL" "$MANIFEST" || { echo "ERRO: $FULL não está no Manifest."; exit 1; }
            echo "OK: $FULL"
          done
          grep -q 'android:launchMode="singleTask"' "$MANIFEST" || { echo "ERRO: MainActivity sem launchMode=singleTask."; exit 1; }
          echo "OK: MainActivity launchMode=singleTask"
          grep -q 'android.intent.action.SEND' "$MANIFEST" || { echo "ERRO: filtro ACTION_SEND ausente."; exit 1; }
          grep -q 'android.intent.action.SEND_MULTIPLE' "$MANIFEST" || { echo "ERRO: filtro ACTION_SEND_MULTIPLE ausente."; exit 1; }
          echo "OK: filtros de compartilhamento presentes."

      - name: Gerar APK RELEASE
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          # As variáveis precisam estar disponíveis NESTA etapa,
          # porque é aqui que o Gradle lê System.getenv(...).
          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "ERRO: ANDROID_KEYSTORE_PASSWORD não chegou ao Gradle."
            exit 1
          }

          test -n "$ANDROID_KEY_ALIAS" || {
            echo "ERRO: ANDROID_KEY_ALIAS não chegou ao Gradle."
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "ERRO: ANDROID_KEY_PASSWORD não chegou ao Gradle."
            exit 1
          }

          cd "$PROJECT_DIR/android"
          chmod +x gradlew

          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Diagnóstico de empacotamento Android
        if: failure()
        shell: bash
        run: |
          set +e
          echo "=== APKs encontrados ==="
          find "$PROJECT_DIR/android" -type f -name "*.apk" -print
          echo "=== Relatório de problemas ==="
          if [ -f "$PROJECT_DIR/android/build/reports/problems/problems-report.html" ]; then
            grep -oE '.{0,160}(packageRelease|error|Exception|Caused by).{0,300}' "$PROJECT_DIR/android/build/reports/problems/problems-report.html" | head -40 || true
          fi
          echo "=== Relatórios de packaging ==="
          find "$PROJECT_DIR/android/app/build" -type f \( -name "*.txt" -o -name "*.log" \) -print | head -50 || true

      - name: Localizar APK final
        shell: bash
        run: |
          set -e
          APK="$PROJECT_DIR/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERRO: APK release não encontrado."
            find "$PROJECT_DIR/android" -type f -name "*.apk" -print
            exit 1
          fi
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Validar permissões do APK
        shell: bash
        run: |
          set -e
          APK="$APK_PATH"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$AAPT" || { echo "ERRO: aapt não encontrado."; exit 1; }
          "$AAPT" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          for PERM in READ_CONTACTS WRITE_CONTACTS RECORD_AUDIO CAMERA; do
            FULL="android.permission.$PERM"
            grep -q "$FULL" /tmp/apk-permissions.txt || { echo "ERRO: $FULL não está no APK."; exit 1; }
            echo "OK NO APK: $FULL"
          done
          echo "OK: launchMode=singleTask já validado no AndroidManifest antes da compilação."

      - name: Validar assinatura do APK
        shell: bash
        run: |
          set -e
          APK="$APK_PATH"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER" || { echo "ERRO: apksigner não encontrado."; exit 1; }
          "$APKSIGNER" verify --verbose "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: gestao-sacerdotista-aime-v138-agenda
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 1

      - name: Limpar arquivo temporário de assinatura
        if: always()
        shell: bash
        run: |
          rm -f "$PROJECT_DIR/android/app/release-key.jks" 2>/dev/null || true

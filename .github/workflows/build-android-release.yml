

name: Build Android APK - V131 - GOOGLE DRIVE - BASE V120

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Validar secrets de assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ERRO: ANDROID_KEYSTORE_BASE64 vazio"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ERRO: ANDROID_KEYSTORE_PASSWORD vazio"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ERRO: ANDROID_KEY_ALIAS vazio"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ERRO: ANDROID_KEY_PASSWORD vazio"; exit 1; }
          echo "Secrets de assinatura reconhecidas."

      - name: Encontrar ZIP do projeto
        shell: bash
        run: |
          set -e
          mapfile -t ZIPS < <(find . -maxdepth 2 -type f -iname ".zip" ! -path "./.git/" | sort)
          COUNT="${#ZIPS[@]}"
          if [ "$COUNT" -eq 0 ]; then
            echo "ERRO: nenhum ZIP foi encontrado."
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "ERRO: foram encontrados vários ZIPs. Deixe somente o ZIP da versão que será compilada."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi
          ZIP_FILE="${ZIPS[0]}"
          echo "ZIP selecionado: $ZIP_FILE"
          ls -lh "$ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Descompactar projeto
        shell: bash
        run: |
          set -e
          rm -rf app
          mkdir -p app
          unzip -q "$ZIP_FILE" -d app

      - name: Localizar projeto
        shell: bash
        run: |
          set -e
          PROJECT_PACKAGE=$(find app -name package.json -not -path "/node_modules/" -print | head -n 1)
          if [ -z "$PROJECT_PACKAGE" ]; then
            echo "ERRO: package.json não encontrado."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_PACKAGE")
          echo "Projeto: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Ajustar dependências
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          node <<'NODE'
          const fs = require('fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          const deps = pkg.dependencies || (pkg.dependencies = {});
          deps['@capacitor/core'] = '^7.4.3';
          deps['@capacitor/android'] = '^7.4.3';
          deps['@capacitor/camera'] = '^7.0.5';
          deps['@capacitor/share'] = '^7.0.2';
          deps['@capacitor/filesystem'] = '^7.0.2';
          deps['@capacitor-community/contacts'] = '7.2.0';
          deps['capacitor-voice-recorder'] = '7.0.6';
          deps['@capacitor/barcode-scanner'] = '2.0.4';
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          rm -rf node_modules
          rm -f package-lock.json

      - name: Instalar dependências
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm install
          npm install -D @capacitor/cli@7.4.3

      - name: Compilar aplicação web
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          npx vite build

      - name: Adicionar Android
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Ajustar SDK Android
        shell: bash
        run: |
          set -e
          VARIABLES="$PROJECT_DIR/android/variables.gradle"
          if [ -f "$VARIABLES" ]; then
            sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' "$VARIABLES"
          fi

      - name: Sincronizar Capacitor
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Criar PermissionBridge
        shell: bash
        run: |
          set -e
          ANDROID_SRC="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao"
          mkdir -p "$ANDROID_SRC"
          cat > "$ANDROID_SRC/PermissionBridgePlugin.java" <<'JAVA'
          package com.sacerdotisaaime.gestao;

          import android.Manifest;
          import android.app.PendingIntent;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.Collections;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import androidx.annotation.Keep;
          import com.google.android.gms.auth.api.identity.AuthorizationRequest;
          import com.google.android.gms.auth.api.identity.AuthorizationResult;
          import com.google.android.gms.auth.api.identity.Identity;
          import com.google.android.gms.common.api.ApiException;
          import com.google.android.gms.common.api.CommonStatusCodes;
          import com.google.android.gms.common.api.Scope;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.provider.OpenableColumns;
          import android.provider.Settings;
          import android.util.Base64;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.IOException;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.List;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @Keep
          @CapacitorPlugin(
            name = "PermissionBridge",
            permissions = {
              @Permission(alias = "contacts", strings = {
                Manifest.permission.READ_CONTACTS,
                Manifest.permission.WRITE_CONTACTS
              }),
              @Permission(alias = "microphone", strings = {
                Manifest.permission.RECORD_AUDIO
              })
            }
          )
          public class PermissionBridgePlugin extends Plugin {
            private static PermissionBridgePlugin instance;
            private static Intent pendingSharedIntent;
            private static boolean initialSyncClaimed = false;
            private static boolean sharedLaunch = false;
            private static final String INBOX_DIR = "shared-media-inbox";
            private static final long MAX_AUDIO_BYTES = 50L * 1024L * 1024L;
            private static final long MAX_PHOTO_BYTES = 20L * 1024L * 1024L;
            private static final String DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
            private static final int GOOGLE_AUTH_REQUEST_CODE = 9417;
            private PluginCall pendingGoogleAuthCall;
            private String googleAccessToken;
            private String googleAccountEmail;
            private final ExecutorService driveExecutor = Executors.newSingleThreadExecutor();

            @Override public void load() {
              super.load();
              instance = this;
              Intent pending = pendingSharedIntent;
              pendingSharedIntent = null;
              if (pending != null) handleSharedIntent(pending);
            }

            private File inboxDir() {
              File dir = new File(getContext().getFilesDir(), INBOX_DIR);
              if (!dir.exists()) dir.mkdirs();
              return dir;
            }

            private String typeFor(Uri uri) {
              try { return getContext().getContentResolver().getType(uri); } catch (Exception ignored) { return null; }
            }

            private String displayName(Uri uri) {
              try {
                android.database.Cursor cursor = getContext().getContentResolver().query(uri, new String[]{OpenableColumns.DISPLAY_NAME}, null, null, null);
                if (cursor != null) {
                  try { if (cursor.moveToFirst()) return cursor.getString(0); } finally { cursor.close(); }
                }
              } catch (Exception ignored) {}
              return null;
            }

            private String b64(String value) {
              return Base64.encodeToString((value == null ? "" : value).getBytes(java.nio.charset.StandardCharsets.UTF_8), Base64.URL_SAFE | Base64.NO_WRAP | Base64.NO_PADDING);
            }
            private String unb64(String value) {
              try { return new String(Base64.decode(value, Base64.URL_SAFE), java.nio.charset.StandardCharsets.UTF_8); } catch (Exception ignored) { return ""; }
            }
            private String[] parse(File file) { return file.getName().split("__", -1); }

            private JSObject metadata(File file) {
              String[] p = parse(file);
              JSObject o = new JSObject();
              if (p.length < 5) return o;
              o.put("id", p[0]);
              o.put("kind", p[3]);
              o.put("mimeType", unb64(p[1]));
              o.put("name", unb64(p[2]));
              o.put("size", file.length());
              o.put("receivedAt", new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", java.util.Locale.US).format(new java.util.Date(file.lastModified())));
              return o;
            }

            private File findById(String id) {
              if (id == null || id.trim().isEmpty()) return null;
              File[] files = inboxDir().listFiles();
              if (files == null) return null;
              for (File file : files) if (file.getName().startsWith(id + "__")) return file;
              return null;
            }

            private boolean startsWith(byte[] data, int len, int... signature) {
              if (len < signature.length) return false;
              for (int i = 0; i < signature.length; i++) if ((data[i] & 0xFF) != (signature[i] & 0xFF)) return false;
              return true;
            }

            private String sniffKindAndMime(File file) throws Exception {
              byte[] h = new byte[64];
              int len = 0;
              try (InputStream input = new FileInputStream(file)) {
                while (len < h.length) {
                  int n = input.read(h, len, h.length - len);
                  if (n < 0) break;
                  if (n == 0) continue;
                  len += n;
                }
              }
              // JPEG
              if (len >= 3 && (h[0] & 0xff) == 0xff && (h[1] & 0xff) == 0xd8 && (h[2] & 0xff) == 0xff) return "photo|image/jpeg";
              // PNG
              if (startsWith(h, len, (byte)0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a)) return "photo|image/png";
              // WebP
              if (len >= 12 && startsWith(h, len, 0x52,0x49,0x46,0x46) && h[8]=='W' && h[9]=='E' && h[10]=='B' && h[11]=='P') return "photo|image/webp";
              // Ogg/Opus
              if (startsWith(h, len, 0x4f,0x67,0x67,0x53)) return "audio|audio/ogg";
              // WAV
              if (len >= 12 && startsWith(h, len, 0x52,0x49,0x46,0x46) && h[8]=='W' && h[9]=='A' && h[10]=='V' && h[11]=='E') return "audio|audio/wav";
              // MP3 with ID3
              if (startsWith(h, len, 0x49,0x44,0x33)) return "audio|audio/mpeg";
              // MP3 frame sync / AAC ADTS
              if (len >= 2 && (h[0] & 0xff) == 0xff && (h[1] & 0xe0) == 0xe0) return "audio|audio/mpeg";
              // HEIC/HEIF photos also use an ISO-BMFF/ftyp header. Check their brand first.
              if (len >= 12 && h[4]=='f' && h[5]=='t' && h[6]=='y' && h[7]=='p') {
                String brand = new String(h, 8, 4, java.nio.charset.StandardCharsets.US_ASCII);
                if (brand.equals("heic") || brand.equals("heix") || brand.equals("hevc") || brand.equals("hevx") || brand.equals("mif1") || brand.equals("msf1")) return "photo|image/heic";
                if (brand.equals("M4A ") || brand.equals("M4B ")) return "audio|audio/mp4";
              }
              if (startsWith(h, len, 0x1a,0x45,0xdf,0xa3)) return "audio|audio/webm";
              return null;
            }

            private String extensionFor(String mime, String originalName) {
              String lower = originalName == null ? "" : originalName.toLowerCase(java.util.Locale.US);
              if (lower.matches(".*\.(ogg|opus|m4a|aac|mp3|wav|amr|3gp|webm|mp4)$")) return lower.substring(lower.lastIndexOf('.') + 1);
              if (mime.contains("ogg")) return "ogg";
              if (mime.contains("mpeg")) return "mp3";
              if (mime.contains("wav")) return "wav";
              if (mime.contains("webm")) return "webm";
              if (mime.contains("mp4")) return "m4a";
              if (mime.contains("png")) return "png";
              if (mime.contains("webp")) return "webp";
              if (mime.contains("heic")) return "heic";
              return mime.contains("jpeg") ? "jpg" : "bin";
            }

            private void storeUri(Uri uri) {
              if (uri == null) return;
              String mime = typeFor(uri);
              String name = displayName(uri);
              String lowerName = name == null ? "" : name.toLowerCase(java.util.Locale.US);
              String lowerMime = mime == null ? "" : mime.toLowerCase(java.util.Locale.US);
              boolean hintedAudio = lowerMime.startsWith("audio/") || lowerName.matches(".\.(ogg|opus|m4a|aac|mp3|wav|amr|3gp|webm|mp4)$");
              boolean hintedPhoto = lowerMime.startsWith("image/") || lowerName.matches(".\.(jpg|jpeg|png|webp|heic|gif)$");
              long max = hintedPhoto && !hintedAudio ? MAX_PHOTO_BYTES : MAX_AUDIO_BYTES;
              String tempId = "media-temp-" + System.currentTimeMillis() + "-" + Math.abs(uri.toString().hashCode());
              File temp = new File(inboxDir(), tempId + ".tmp");
              long total = 0;
              try (InputStream input = getContext().getContentResolver().openInputStream(uri); FileOutputStream output = new FileOutputStream(temp)) {
                if (input == null) throw new Exception("STREAM_UNAVAILABLE");
                byte[] buffer = new byte[8192];
                int read;
                while ((read = input.read(buffer)) != -1) {
                  total += read;
                  if (total > max) throw new Exception("MEDIA_TOO_LARGE");
                  output.write(buffer, 0, read);
                }
                output.flush();
              } catch (Exception ex) {
                try { temp.delete(); } catch (Exception ignored) {}
                notifyReceiveError(uri, ex.getMessage() == null ? "RECEIVE_FAILED" : ex.getMessage());
                return;
              }

              String sniff = null;
              try { sniff = sniffKindAndMime(temp); } catch (Exception ignored) {}
              boolean audio = hintedAudio || (sniff != null && sniff.startsWith("audio|"));
              boolean photo = hintedPhoto || (sniff != null && sniff.startsWith("photo|"));
              if (photo && total > MAX_PHOTO_BYTES) {
                try { temp.delete(); } catch (Exception ignored) {}
                notifyReceiveError(uri, "MEDIA_TOO_LARGE");
                return;
              }
              if (!audio && !photo) {
                try { temp.delete(); } catch (Exception ignored) {}
                notifyReceiveError(uri, "UNRECOGNIZED_MEDIA");
                return;
              }
              if (sniff != null) {
                String[] parts = sniff.split("\|", 2);
                if (parts.length == 2) {
                  if (mime == null || mime.trim().isEmpty() || mime.equalsIgnoreCase("application/octet-stream") || mime.equalsIgnoreCase("/")) mime = parts[1];
                  if (name == null || name.trim().isEmpty() || !name.contains(".")) name = (audio ? "audio-whatsapp." : "foto-whatsapp.") + extensionFor(parts[1], name);
                }
              }
              if (mime == null || mime.trim().isEmpty() || mime.equals("/") || mime.equalsIgnoreCase("application/octet-stream")) mime = audio ? "audio/" : "image/";
              if (name == null || name.trim().isEmpty()) name = audio ? "audio-whatsapp." + extensionFor(mime, name) : "foto-whatsapp." + extensionFor(mime, name);
              String id = "media-" + System.currentTimeMillis() + "-" + Math.abs((uri.toString() + total).hashCode());
              File out = new File(inboxDir(), id + "" + b64(mime) + "" + b64(name) + "__" + (audio ? "audio" : "photo") + "__1.bin");
              if (!temp.renameTo(out)) {
                try (FileInputStream in = new FileInputStream(temp); FileOutputStream os = new FileOutputStream(out)) {
                  byte[] buffer = new byte[8192];
                  int n;
                  while ((n=in.read(buffer))!=-1) os.write(buffer,0,n);
                } catch (IOException e) {
                  throw new RuntimeException("Falha ao copiar mídia compartilhada para o armazenamento persistente.", e);
                }
                temp.delete();
              }
              JSObject event = metadata(out);
              instance.notifyListeners("sharedMedia", event);
            }

            private void notifyReceiveError(Uri uri, String code) {
              JSObject event = new JSObject();
              event.put("ok", false);
              event.put("code", code);
              event.put("uri", uri == null ? "" : uri.toString());
              if (instance != null) instance.notifyListeners("sharedMediaError", event);
            }

            public static void handleSharedIntent(Intent intent) {
              if (intent == null) return;
              if (instance == null) {
                pendingSharedIntent = new Intent(intent);
                return;
              }
              String action = intent.getAction();
              if (!Intent.ACTION_SEND.equals(action) && !Intent.ACTION_SEND_MULTIPLE.equals(action)) return;
              sharedLaunch = true;
              try {
                java.util.ArrayList<Uri> received = new java.util.ArrayList<>();

                if (intent.getClipData() != null) {
                  android.content.ClipData clip = intent.getClipData();
                  for (int i = 0; i < clip.getItemCount(); i++) {
                    Uri uri = clip.getItemAt(i).getUri();
                    if (uri != null && !received.contains(uri)) received.add(uri);
                  }
                }

                if (Intent.ACTION_SEND_MULTIPLE.equals(action)) {
                  java.util.ArrayList<Uri> uris = intent.getParcelableArrayListExtra(Intent.EXTRA_STREAM);
                  if (uris != null) {
                    for (Uri uri : uris) {
                      if (uri != null && !received.contains(uri)) received.add(uri);
                    }
                  }
                } else {
                  Uri uri = null;
                  try { uri = intent.getParcelableExtra(Intent.EXTRA_STREAM); } catch (Exception ignored) {}
                  if (uri != null && !received.contains(uri)) received.add(uri);
                }

                for (Uri uri : received) instance.storeUri(uri);
              } catch (Exception ex) {
                if (instance != null) instance.notifyReceiveError(null, ex.getMessage() == null ? "INTENT_READ_FAILED" : ex.getMessage());
              }
            }

            @PluginMethod
            public void claimInitialSync(PluginCall call) {
              boolean first = !initialSyncClaimed;
              initialSyncClaimed = true;
              JSObject result = new JSObject();
              result.put("firstProcess", first);
              result.put("sharedLaunch", sharedLaunch);
              sharedLaunch = false;
              call.resolve(result);
            }

            @PluginMethod
            public void getSharedMedia(PluginCall call) {
              File[] files = inboxDir().listFiles();
              JSArray arr = new JSArray();
              if (files != null) for (File file : files) if (file.isFile()) arr.put(metadata(file));
              JSObject result = new JSObject();
              result.put("pending", arr.length() > 0);
              result.put("items", arr);
              call.resolve(result);
            }

            @PluginMethod
            public void listSharedMedia(PluginCall call) {
              File[] files = inboxDir().listFiles();
              JSArray arr = new JSArray();
              if (files != null) for (File file : files) if (file.isFile()) arr.put(metadata(file));
              JSObject result = new JSObject(); result.put("items", arr); call.resolve(result);
            }

            @PluginMethod
            public void readSharedMedia(PluginCall call) {
              String id = call.getString("id", "");
              File file = findById(id);
              if (file == null || !file.exists()) { JSObject r = new JSObject(); r.put("ok", false); call.resolve(r); return; }
              try {
                ByteArrayOutputStream output = new ByteArrayOutputStream();
                try (InputStream input = new FileInputStream(file)) { byte[] buffer = new byte[8192]; int read; while ((read=input.read(buffer))!=-1) output.write(buffer,0,read); }
                JSObject r = metadata(file);
                r.put("ok", true);
                String mime = r.getString("mimeType", "application/octet-stream");
                r.put("data", "data:" + mime + ";base64," + Base64.encodeToString(output.toByteArray(), Base64.NO_WRAP));
                call.resolve(r);
              } catch (Exception ex) { call.reject("SHARED_MEDIA_READ_ERROR", ex.getMessage() == null ? "READ_FAILED" : ex.getMessage()); }
            }

            @PluginMethod
            public void deleteSharedMedia(PluginCall call) {
              String id = call.getString("id", "");
              File file = findById(id);
              JSObject r = new JSObject(); r.put("ok", file == null || file.delete()); call.resolve(r);
            }

            @PluginMethod public void requestContacts(PluginCall call) { if (getPermissionState("contacts") == PermissionState.GRANTED) { JSObject r=new JSObject();r.put("granted",true);r.put("state","granted");call.resolve(r);return;} requestPermissionForAlias("contacts",call,"contactsPermissionResult"); }

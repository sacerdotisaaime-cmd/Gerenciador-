          grep -q \
            'grantUriPermissions' \
            "$FINAL_MANIFEST" || {
              echo "ERRO: grantUriPermissions não encontrado no APK."
              exit 1
            }

          echo "OK NO APK: singleTask + grantUriPermissions + SEND + SEND_MULTIPLE + áudio + foto + MIME genérico"


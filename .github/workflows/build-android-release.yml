          ls -lh "$APK_PATH"


      # ============================================================
      # 27 - UPLOAD DO APK
      # ============================================================

      - name: Disponibilizar APK V120
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gestao-sacerdotista-aime-v120-whatsapp-audio-share
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # 28 - FINAL
      # ============================================================

      - name: Finalizar V120
        if: success()
        shell: bash
        run: |
          echo "=================================================="
          echo "V120 CONCLUÍDO"
          echo "APK GERADO"
          echo "APK ENVIADO COMO ARTEFATO"
          echo "=================================================="


      # ============================================================
      # 29 - LIMPEZA
      # ============================================================

      - name: Limpar keystore temporária
        if: always()
        shell: bash
        run: |
          if [ -n "$PROJECT_DIR" ]; then
            rm -f \
              "$PROJECT_DIR/android/app/release-key.jks" \
              2>/dev/null || true
          fi

          grep -q \
            'android.intent.action.SEND' \
            "$FINAL_MANIFEST" || {
              echo "ERRO: ACTION_SEND não encontrado no APK."
              exit 1
            }

          grep -q \
            'android.intent.action.SEND_MULTIPLE' \
            "$FINAL_MANIFEST" || {
              echo "ERRO: ACTION_SEND_MULTIPLE não encontrado no APK."
              exit 1

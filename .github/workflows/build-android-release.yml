          }


          python3 - "$APP_GRADLE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          text = path.read_text()


          # ----------------------------------------------------------
          # VERSION CODE
          # ----------------------------------------------------------

          if re.search(
              r'versionCode\s+["\']?\d+["\']?',
              text
          ):

              text = re.sub(
                  r'versionCode\s+["\']?\d+["\']?',
                  'versionCode 120',
                  text,
                  count=1
              )

          else:

              text = text.replace(
                  'defaultConfig {',
                  'defaultConfig {\n        versionCode 120',
                  1
              )


          # ----------------------------------------------------------
          # VERSION NAME
          # ----------------------------------------------------------

          if re.search(
              r'versionName\s+["\'][^"\']+["\']',
              text
          ):

              text = re.sub(
                  r'versionName\s+["\'][^"\']+["\']',
                  'versionName "1.20.0"',
                  text,
                  count=1
              )

          else:

              text = text.replace(
                  'defaultConfig {',
                  'defaultConfig {\n        versionName "1.20.0"',
                  1
              )


          # ----------------------------------------------------------
          # SIGNING CONFIG
          # ----------------------------------------------------------

          if 'signingConfigs' not in text:

              signing = '''
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              '''

              text = text.replace(
                  'android {',
                  'android {' + signing,
                  1
              )

          elif 'signingConfigs.release' not in text:

              signing = '''
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              '''

              text = text.replace(
                  'signingConfigs {',
                  'signingConfigs {' + signing,
                  1
              )


          # ----------------------------------------------------------
          # BUILD TYPE RELEASE
          # ----------------------------------------------------------

          if 'signingConfig signingConfigs.release' not in text:

              release_match = re.search(
                  r'buildTypes\s*\{',
                  text
              )

              if release_match:

                  pos = release_match.end()

                  text = (
                      text[:pos]
                      +
                      '''
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
                  '''
                      +
                      text[pos:]
                  )

              else:

                  text += '''
                  
                  buildTypes {
                      release {
                          signingConfig signingConfigs.release
                          minifyEnabled false
                          shrinkResources false
                      }
                  }
                  '''


          path.write_text(text)

          print("build.gradle configurado.")

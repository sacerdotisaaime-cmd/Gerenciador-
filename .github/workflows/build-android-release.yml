name: V119 - Gerar APK RELEASE

on:
  workflow_dispatch:

jobs:
  build-v119:
    runs-on: ubuntu-latest

    env:
      ZIP_FILE: ./Gestao_Sacerdotista_Aime_V119_CAIXA_MIDIAS_WHATSAPP_CORRIGIDA.zip
      PROJECT_DIR: app

      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/21.0.12-1/x64
      JAVA_HOME_21_X64: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/21.0.12-1/x64
      MAVEN_ARGS: -ntp

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 21
      # ============================================================

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # 3. LOCALIZAR ZIP
      # ============================================================

      - name: Verificar ZIP V119
        shell: bash
        run: |
          set -e

          echo "Arquivos disponíveis:"
          find . -maxdepth 3 -type f | sort

          test -f "$ZIP_FILE" || {
            echo "ERRO: ZIP da V119 não encontrado:"
            echo "$ZIP_FILE"
            exit 1
          }

          echo "OK: ZIP encontrado."


      # ============================================================
      # 4. EXTRAIR PROJETO
      # ============================================================

      - name: Extrair projeto Android
        shell: bash
        run: |
          set -e

          rm -rf "$PROJECT_DIR"

          mkdir -p "$PROJECT_DIR"

          unzip -q "$ZIP_FILE" -d "$PROJECT_DIR"

          echo "Conteúdo extraído:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -300


      # ============================================================
      # 5. LOCALIZAR RAIZ REAL DO PROJETO
      # ============================================================

      - name: Encontrar projeto Gradle
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "Projeto encontrado diretamente em $PROJECT_DIR."

          elif [ -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "Projeto encontrado em $PROJECT_DIR/android."

          else
            FOUND="$(find "$PROJECT_DIR" -type f -name gradlew | head -n 1)"

            test -n "$FOUND" || {
              echo "ERRO: gradlew não encontrado."
              exit 1
            }

            ROOT="$(dirname "$FOUND")"

            echo "Projeto Gradle encontrado em:"
            echo "$ROOT"
          fi


      # ============================================================
      # 6. DEFINIR ANDROID_DIR
      # ============================================================

      - name: Definir diretório Android
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "ANDROID_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          elif [ -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "ANDROID_DIR=$PROJECT_DIR/android" >> "$GITHUB_ENV"

          else
            FOUND="$(find "$PROJECT_DIR" -type f -name gradlew | head -n 1)"
            ROOT="$(dirname "$FOUND")"

            echo "ANDROID_DIR=$ROOT" >> "$GITHUB_ENV"
          fi


      # ============================================================
      # 7. MOSTRAR ESTRUTURA
      # ============================================================

      - name: Verificar estrutura Android
        shell: bash
        run: |
          set -e

          echo "ANDROID_DIR:"
          echo "$ANDROID_DIR"

          test -f "$ANDROID_DIR/gradlew" || {
            echo "ERRO: gradlew não encontrado."
            exit 1
          }

          test -d "$ANDROID_DIR/app" || {
            echo "ERRO: pasta app não encontrada."
            exit 1
          }

          echo "OK: estrutura Android encontrada."


      # ============================================================
      # 8. LOCALIZAR KEYSTORE
      # ============================================================

      - name: Configurar keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$ANDROID_DIR/app/release-key.jks"

          if [ -f "$KEYSTORE" ]; then
            echo "OK: release-key.jks já existe."

          else
            FOUND="$(find "$ANDROID_DIR" -type f -name 'release-key.jks' | head -n 1 || true)"

            if [ -n "$FOUND" ]; then
              cp "$FOUND" "$KEYSTORE"
              echo "OK: keystore copiado."

            else
              echo "ERRO: release-key.jks não encontrado."
              exit 1
            fi
          fi

          test -s "$KEYSTORE" || {
            echo "ERRO: keystore vazio."
            exit 1
          }


      # ============================================================
      # 9. VALIDAR KEYSTORE
      # ============================================================

      - name: Validar assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          keytool -list \
            -keystore "$ANDROID_DIR/app/release-key.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          echo "OK: keystore e alias validados."


      # ============================================================
      # 10. VALIDAR RECEIVER NATIVO
      # ============================================================

      - name: Validar PermissionBridgePlugin
        shell: bash
        run: |
          set -e

          BRIDGE="$ANDROID_DIR/app/src/main/java/com/sacerdotisaime/gestao/PermissionBridgePlugin.java"

          if [ ! -f "$BRIDGE" ]; then
            BRIDGE="$(find "$ANDROID_DIR/app/src/main/java" \
              -name PermissionBridgePlugin.java \
              | head -n 1)"
          fi

          test -n "$BRIDGE" || {
            echo "ERRO: PermissionBridgePlugin.java não encontrado."
            exit 1
          }

          grep -q 'ACTION_SEND_MULTIPLE' "$BRIDGE" || {
            echo "ERRO: ACTION_SEND_MULTIPLE ausente."
            exit 1
          }

          grep -q 'EXTRA_STREAM' "$BRIDGE" || {
            echo "ERRO: EXTRA_STREAM ausente."
            exit 1
          }

          grep -q 'getClipData' "$BRIDGE" || {
            echo "ERRO: ClipData ausente."
            exit 1
          }

          echo "OK: receptor nativo validado."


      # ============================================================
      # 11. VALIDAR MAINACTIVITY
      # ============================================================

      - name: Validar MainActivity
        shell: bash
        run: |
          set -e

          MAIN="$(find "$ANDROID_DIR/app/src/main/java" \
            -name MainActivity.java \
            | head -n 1)"

          test -n "$MAIN" || {
            echo "ERRO: MainActivity.java não encontrada."
            exit 1
          }

          grep -q 'handleSharedIntent' "$MAIN" || {
            echo "ERRO: MainActivity não chama handleSharedIntent."
            exit 1
          }

          echo "OK: MainActivity validada."


      # ============================================================
      # 12. CORRIGIR BUILD.GRADLE
      #
      # IMPORTANTE:
      # ionbarcode-android 1.2.1 exige minSdk 26.
      # ============================================================

      - name: Corrigir configuração Android V119
        shell: bash
        run: |
          set -e

          APP_GRADLE="$ANDROID_DIR/app/build.gradle"

          test -f "$APP_GRADLE" || {
            echo "ERRO: build.gradle não encontrado."
            exit 1
          }

          python3 - "$APP_GRADLE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          # ========================================================
          # VERSION NAME
          # ========================================================

          if re.search(r'\bversionName\s+"[^"]+"', text):
              text = re.sub(
                  r'\bversionName\s+"[^"]+"',
                  'versionName "1.19.0"',
                  text,
                  count=1
              )

          # ========================================================
          # VERSION CODE
          # ========================================================

          if re.search(r'\bversionCode\s+\d+', text):
              text = re.sub(
                  r'\bversionCode\s+\d+',
                  'versionCode 119',
                  text,
                  count=1
              )

          # ========================================================
          # MIN SDK 26
          # ========================================================

          if re.search(r'\bminSdkVersion\s+\d+', text):

              text = re.sub(
                  r'\bminSdkVersion\s+\d+',
                  'minSdkVersion 26',
                  text,
                  count=1
              )

          elif re.search(r'\bminSdk\s+\d+', text):

              text = re.sub(
                  r'\bminSdk\s+\d+',
                  'minSdk 26',
                  text,
                  count=1
              )

          else:

              match = re.search(
                  r'defaultConfig\s*\{',
                  text
              )

              if not match:
                  raise SystemExit(
                      "ERRO: defaultConfig não encontrado."
                  )

              pos = match.end()

              text = (
                  text[:pos]
                  + '\n        minSdkVersion 26\n'
                  + text[pos:]
              )

          # ========================================================
          # SIGNING CONFIG
          # ========================================================

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''

          if 'signingConfigs {' not in text:

              match = re.search(
                  r'android\s*\{',
                  text
              )

              if not match:
                  raise SystemExit(
                      "ERRO: bloco android não encontrado."
                  )

              pos = match.end()

              text = (
                  text[:pos]
                  + '\n'
                  + signing_block
                  + text[pos:]
              )

          elif 'signingConfigs.release' not in text:

              text = text.replace(
                  'signingConfigs {',
                  '''signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              ''',
                  1
              )

          # ========================================================
          # BUILD TYPE RELEASE
          # ========================================================

          if re.search(r'buildTypes\s*\{', text):

              if re.search(
                  r'release\s*\{[^}]*signingConfig',
                  text,
                  re.S
              ):
                  pass

              else:

                  match = re.search(
                      r'buildTypes\s*\{',
                      text
                  )

                  pos = match.end()

                  text = (
                      text[:pos]
                      + '''
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              '''
                      + text[pos:]
                  )

          else:

              text += '''

              android {
                  buildTypes {
                      release {
                          signingConfig signingConfigs.release
                          minifyEnabled false
                      }
                  }
              }
              '''

          path.write_text(text)

          print("OK: versionName 1.19.0")
          print("OK: versionCode 119")
          print("OK: minSdk 26")
          print("OK: assinatura release")
          PY


      # ============================================================
      # 13. MOSTRAR CONFIGURAÇÃO FINAL
      # ============================================================

      - name: Conferir configuração V119
        shell: bash
        run: |
          set -e

          APP_GRADLE="$ANDROID_DIR/app/build.gradle"

          echo ""
          echo "=============================================="
          echo " CONFIGURAÇÃO FINAL V119"
          echo "=============================================="

          grep -nE \
            'versionCode|versionName|minSdk|minSdkVersion|signingConfig|storeFile' \
            "$APP_GRADLE" || true

          echo "=============================================="


      # ============================================================
      # 14. VALIDAÇÃO OBRIGATÓRIA V119
      # ============================================================

      - name: Validar V119
        shell: bash
        run: |
          set -e

          APP_GRADLE="$ANDROID_DIR/app/build.gradle"

          grep -q \
            'versionCode 119' \
            "$APP_GRADLE" || {
              echo "ERRO: versionCode 119 não encontrado."
              exit 1
          }

          grep -q \
            'versionName "1.19.0"' \
            "$APP_GRADLE" || {
              echo "ERRO: versionName 1.19.0 não encontrado."
              exit 1
          }

          grep -Eq \
            'minSdkVersion 26|minSdk 26' \
            "$APP_GRADLE" || {
              echo "ERRO: minSdk 26 não encontrado."
              exit 1
          }

          grep -q \
            'signingConfig signingConfigs.release' \
            "$APP_GRADLE" || {
              echo "ERRO: signingConfig release não encontrado."
              exit 1
          }

          echo ""
          echo "=============================================="
          echo " V119 VALIDADA"
          echo " versionCode : 119"
          echo " versionName : 1.19.0"
          echo " minSdk      : 26"
          echo " assinatura  : OK"
          echo "=============================================="


      # ============================================================
      # 15. GERAR APK RELEASE
      # ============================================================

      - name: Gerar APK RELEASE
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew

          ./gradlew clean assembleRelease --no-daemon --stacktrace


      # ============================================================
      # 16. LOCALIZAR APK
      # ============================================================

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          APK="$(find "$ANDROID_DIR/app/build/outputs/apk/release" \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          test -n "$APK" || {
            echo "ERRO: APK RELEASE não foi gerado."
            exit 1
          }

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" "./Gestao_Sacerdotista_Aime_V119.apk"

          echo "APK_FINAL=./Gestao_Sacerdotista_Aime_V119.apk" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 17. LOCALIZAR AAPT
      # ============================================================

      - name: Localizar AAPT
        shell: bash
        run: |
          set -e

          AAPT="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name aapt \
            | sort -V \
            | tail -n 1)"

          test -n "$AAPT" || {
            echo "ERRO: aapt não encontrado."
            exit 1
          }

          echo "AAPT=$AAPT" >> "$GITHUB_ENV"

          echo "OK: AAPT:"
          echo "$AAPT"


      # ============================================================
      # 18. VALIDAR PERMISSÕES
      # ============================================================

      - name: Validar permissões no APK
        shell: bash
        run: |
          set -e

          "$AAPT" dump permissions "$APK_FINAL" \
            | tee /tmp/apk-permissions.txt

          for PERM in \
            READ_CONTACTS \
            WRITE_CONTACTS \
            RECORD_AUDIO \
            CAMERA
          do
            FULL="android.permission.$PERM"

            grep -q "$FULL" /tmp/apk-permissions.txt || {
              echo "ERRO: $FULL não está no APK."
              exit 1
            }
          done

          echo "OK: permissões principais encontradas."


      # ============================================================
      # 19. MANIFEST FINAL
      # ============================================================

      - name: Extrair Manifest final
        shell: bash
        run: |
          set -e

          "$AAPT" dump xmltree \
            "$APK_FINAL" \
            AndroidManifest.xml \
            | tee /tmp/final-v119-manifest.txt


      # ============================================================
      # 20. VALIDAR SINGLE TASK
      # ============================================================

      - name: Validar singleTask
        shell: bash
        run: |
          set -e

          grep -q \
            'singleTask' \
            /tmp/final-v119-manifest.txt || {
              echo "ERRO: singleTask não entrou no APK."
              exit 1
          }

          echo "OK NO APK: singleTask"


      # ============================================================
      # 21. VALIDAR ACTION SEND
      # ============================================================

      - name: Validar ACTION_SEND
        shell: bash
        run: |
          set -e

          grep -q \
            'android.intent.action.SEND' \
            /tmp/final-v119-manifest.txt || {
              echo "ERRO: ACTION_SEND não entrou no APK."
              exit 1
          }

          echo "OK NO APK: ACTION_SEND"


      # ============================================================
      # 22. VALIDAR SEND MULTIPLE
      # ============================================================

      - name: Validar ACTION_SEND_MULTIPLE
        shell: bash
        run: |
          set -e

          grep -q \
            'android.intent.action.SEND_MULTIPLE' \
            /tmp/final-v119-manifest.txt || {
              echo "ERRO: ACTION_SEND_MULTIPLE não entrou no APK."
              exit 1
          }

          echo "OK NO APK: ACTION_SEND_MULTIPLE"


      # ============================================================
      # 23. VALIDAR AUDIO
      # ============================================================

      - name: Validar audio
        shell: bash
        run: |
          set -e

          grep -q \
            'audio/' \
            /tmp/final-v119-manifest.txt || {
              echo "ERRO: audio/* não entrou no APK."
              exit 1
          }

          echo "OK NO APK: audio/*"


      # ============================================================
      # 24. VALIDAR IMAGEM
      # ============================================================

      - name: Validar imagem
        shell: bash
        run: |
          set -e

          grep -q \
            'image/' \
            /tmp/final-v119-manifest.txt || {
              echo "ERRO: image/* não entrou no APK."
              exit 1
          }

          echo "OK NO APK: image/*"


      # ============================================================
      # 25. VALIDAR CONTENT URI
      # ============================================================

      - name: Validar content URI
        shell: bash
        run: |
          set -e

          grep -q \
            'content' \
            /tmp/final-v119-manifest.txt || {
              echo "ERRO: suporte a content URI não encontrado."
              exit 1
          }

          echo "OK NO APK: content URI"


      # ============================================================
      # 26. RESUMO FINAL
      # ============================================================

      - name: Resultado V119
        shell: bash
        run: |
          set -e

          echo ""
          echo "=================================================="
          echo "          V119 VALIDADA NO APK FINAL"
          echo "=================================================="
          echo ""
          echo "singleTask        : OK"
          echo "ACTION_SEND       : OK"
          echo "SEND_MULTIPLE     : OK"
          echo "audio/*           : OK"
          echo "image/*           : OK"
          echo "content URI       : OK"
          echo "minSdk 26         : OK"
          echo "assinatura        : OK"
          echo ""
          echo "=================================================="


      # ============================================================
      # 27. SALVAR APK
      # ============================================================

      - name: Publicar APK V119
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-Sacerdotista-Aime-V119
          path: Gestao_Sacerdotista_Aime_V119.apk
          if-no-files-found: error


      # ============================================================
      # 28. SALVAR MANIFEST DE DIAGNÓSTICO
      # ============================================================

      - name: Publicar diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: V119-diagnostico
          path: |
            /tmp/final-v119-manifest.txt
            /tmp/apk-permissions.txt
          if-no-files-found: warn

      - name: Configurar AndroidManifest
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import re
          import sys

          manifest = Path(sys.argv[1])

          text = manifest.read_text(
              encoding="utf-8"
          )


          # ==================================================
          # PERMISSIONS
          # ==================================================

          permissions = [
              '<uses-permission android:name="android.permission.READ_CONTACTS" />',
              '<uses-permission android:name="android.permission.WRITE_CONTACTS" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
          ]

          for permission in permissions:

              if permission not in text:

                  text = text.replace(
                      "<application",
                      permission +
                      "\n\n    <application",
                      1
                  )


          # ==================================================
          # MAIN ACTIVITY
          # ==================================================

          activity_block = r'''
              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:launchMode="singleTask"
                  android:grantUriPermissions="true">

                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>

                  <intent-filter>
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="audio/*" />
                  </intent-filter>

                  <intent-filter>
                      <action android:name="android.intent.action.SEND_MULTIPLE" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="audio/*" />
                  </intent-filter>

                  <intent-filter>
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="image/*" />
                  </intent-filter>

                  <intent-filter>
                      <action android:name="android.intent.action.SEND_MULTIPLE" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="image/*" />
                  </intent-filter>

                  <intent-filter>
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="*/*" />
                  </intent-filter>

                  <intent-filter>
                      <action android:name="android.intent.action.SEND_MULTIPLE" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="*/*" />
                  </intent-filter>

              </activity>
          '''


          # ==================================================
          # REMOVER MAINACTIVITY EXISTENTE
          # ==================================================

          pattern = re.compile(
              r'\s*<activity\b[^>]*android:name="\.MainActivity"[^>]*>.*?</activity>',
              re.DOTALL
          )

          text = pattern.sub(
              "",
              text
          )


          # ==================================================
          # LOCALIZAR APPLICATION
          # ==================================================

          application_end = text.find(
              "</application>"
          )

          if application_end == -1:

              raise SystemExit(
                  "ERRO: </application> não encontrado no Manifest."
              )


          # ==================================================
          # INSERIR MAINACTIVITY
          # ==================================================

          text = (
              text[:application_end]
              + activity_block
              + "\n"
              + text[application_end:]
          )


          # ==================================================

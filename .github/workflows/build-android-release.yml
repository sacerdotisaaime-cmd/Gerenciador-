              encoding="utf-8"
          )


          # ----------------------------------------------------------
          # VERSION CODE
          # ----------------------------------------------------------

          if re.search(
              r'versionCode\s+\d+',
              text
          ):

              text = re.sub(
                  r'versionCode\s+\d+',
                  'versionCode 120',
                  text,
                  count=1
              )

          else:

              text = text.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        versionCode 120",
                  1
              )


          # ----------------------------------------------------------
          # VERSION NAME
          # ----------------------------------------------------------

          if re.search(
              r'versionName\s+"[^"]+"',
              text
          ):

              text = re.sub(
                  r'versionName\s+"[^"]+"',
                  'versionName "1.20.0"',
                  text,
                  count=1
              )

          else:

              text = text.replace(
                  "defaultConfig {",
                  'defaultConfig {\n        versionName "1.20.0"',
                  1
              )


          # ----------------------------------------------------------
          # SIGNING CONFIG
          # ----------------------------------------------------------

          if "signingConfigs" not in text:

              signing_config = """
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              """

              text = text.replace(
                  "android {",
                  "android {\n" + signing_config,
                  1
              )


          # ----------------------------------------------------------
          # RELEASE BUILD TYPE
          # ----------------------------------------------------------

          if "signingConfig signingConfigs.release" not in text:

              if re.search(
                  r'buildTypes\s*\{',
                  text
              ):

                  text = re.sub(
                      r'(buildTypes\s*\{)',
                      r'''\1
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
                  ''',
                      text,
                      count=1
                  )

              else:

                  text += """

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
              """


          path.write_text(
              text,
              encoding="utf-8"
          )


          print(
              "build.gradle configurado."

          if 'signingConfigs {' not in text:
              signing = '''
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              '''
              text = text.replace('android {', 'android {' + signing, 1)
          elif 'signingConfigs.release' not in text:
              text = text.replace('signingConfigs {', '''signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              ''', 1)

          build_types = re.search(r'buildTypes\s*{', text)
          if not build_types:
              text += '''
              \nbuildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              '''
          else:
              tail = text[build_types.end():]
              release = re.search(r'release\s*{', tail)
              if not release:
                  pos = build_types.end()
                  text = text[:pos] + '''
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
                  ''' + text[pos:]
              elif 'signingConfig signingConfigs.release' not in tail[release.end():release.end()+2500]:
                  pos = build_types.end() + release.end()
                  text = text[:pos] + '''
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  ''' + text[pos:]

          path.write_text(text)
          PY

          keytool -list \
            -keystore "$PROJECT_DIR/android/app/release-key.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "Keystore e alias validados."

      - name: Validar Manifest
        shell: bash
        run: |
          set -e
          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          for PERM in READ_CONTACTS WRITE_CONTACTS RECORD_AUDIO CAMERA; do
            FULL="android.permission.$PERM"
            grep -q "$FULL" "$MANIFEST" || { echo "ERRO: $FULL não está no Manifest."; exit 1; }
            echo "OK: $FULL"
          done
          grep -q 'android:launchMode="singleTask"' "$MANIFEST" || { echo "ERRO: MainActivity sem launchMode=singleTask."; exit 1; }
          echo "OK: MainActivity launchMode=singleTask"
          grep -q 'android.intent.action.SEND' "$MANIFEST" || { echo "ERRO: filtro ACTION_SEND ausente."; exit 1; }
          grep -q 'android.intent.action.SEND_MULTIPLE' "$MANIFEST" || { echo "ERRO: filtro ACTION_SEND_MULTIPLE ausente."; exit 1; }
          grep -q 'android:mimeType="image/*"' "$MANIFEST" || { echo "ERRO: filtro image/* ausente."; exit 1; }
          grep -q 'android:mimeType="audio/*"' "$MANIFEST" || { echo "ERRO: filtro audio/* ausente."; exit 1; }
          grep -q 'android:mimeType="*/*"' "$MANIFEST" || { echo "ERRO: filtro / ausente."; exit 1; }
          echo "OK: filtros de compartilhamento presentes para áudio, foto e MIME genérico."

      - name: Validar código nativo de compartilhamento antes do build
        shell: bash
        run: |
          set -e
          MAIN="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao/MainActivity.java"
          BRIDGE="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao/PermissionBridgePlugin.java"
          grep -q 'PermissionBridgePlugin.handleSharedIntent(getIntent())' "$MAIN" || { echo "ERRO: MainActivity não processa o Intent inicial."; exit 1; }
          grep -q 'PermissionBridgePlugin.handleSharedIntent(intent)' "$MAIN" || { echo "ERRO: onNewIntent não encaminha o compartilhamento."; exit 1; }
          grep -q 'singleTask' "$PROJECT_DIR/android/app/src/main/AndroidManifest.xml" || { echo "ERRO: singleTask não configurado."; exit 1; }
          grep -q 'ACTION_SEND_MULTIPLE' "$BRIDGE" || { echo "ERRO: PermissionBridge sem SEND_MULTIPLE."; exit 1; }
          grep -q 'EXTRA_STREAM' "$BRIDGE" || { echo "ERRO: PermissionBridge sem EXTRA_STREAM."; exit 1; }
          grep -q 'getClipData' "$BRIDGE" || { echo "ERRO: PermissionBridge sem ClipData."; exit 1; }
          grep -q 'openInputStream' "$BRIDGE" || { echo "ERRO: PermissionBridge não copia o arquivo recebido."; exit 1; }
          grep -q 'shared-media-inbox' "$BRIDGE" || { echo "ERRO: inbox persistente ausente."; exit 1; }
          grep -q 'notifyListeners("sharedMedia"' "$BRIDGE" || { echo "ERRO: evento sharedMedia ausente."; exit 1; }
          grep -q 'getSharedMedia' "$BRIDGE" || { echo "ERRO: leitura da Caixa de Mídias ausente."; exit 1; }
          grep -q 'readSharedMedia' "$BRIDGE" || { echo "ERRO: leitura do áudio recebido ausente."; exit 1; }
          echo "OK: receptor nativo + cópia persistente + evento + leitura validados."

      - name: Validar Google Drive nativo
        shell: bash
        run: |
          set -e
          PLUGIN="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao/PermissionBridgePlugin.java"
          MAIN="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao/MainActivity.java"
          grep -q 'connectGoogleDrive' "$PLUGIN"
          grep -q 'uploadBackupToGoogleDrive' "$PLUGIN"
          grep -q 'handleGoogleAuthorizationResult' "$MAIN"
          grep -q 'play-services-auth:21.6.0' "$PROJECT_DIR/android/app/build.gradle"
          echo "OK: Google Drive nativo + OAuth + upload + dependência presentes."

      - name: Gerar APK RELEASE
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          # As variáveis precisam estar disponíveis NESTA etapa,
          # porque é aqui que o Gradle lê System.getenv(...).
          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "ERRO: ANDROID_KEYSTORE_PASSWORD não chegou ao Gradle."
            exit 1
          }

          test -n "$ANDROID_KEY_ALIAS" || {
            echo "ERRO: ANDROID_KEY_ALIAS não chegou ao Gradle."
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "ERRO: ANDROID_KEY_PASSWORD não chegou ao Gradle."
            exit 1
          }

          cd "$PROJECT_DIR/android"
          chmod +x gradlew

          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Localizar APK final
        shell: bash
        run: |
          set -e
          APK="$PROJECT_DIR/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERRO: APK release não encontrado."
            find "$PROJECT_DIR/android" -type f -name "*.apk" -print
            exit 1
          fi
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Validar permissões do APK
        shell: bash
        run: |
          set -e
          APK="$APK_PATH"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$AAPT" || { echo "ERRO: aapt não encontrado."; exit 1; }
          "$AAPT" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          for PERM in READ_CONTACTS WRITE_CONTACTS RECORD_AUDIO CAMERA; do
            FULL="android.permission.$PERM"
            grep -q "$FULL" /tmp/apk-permissions.txt || { echo "ERRO: $FULL não está no APK."; exit 1; }
            echo "OK NO APK: $FULL"
          done
          FINAL_MANIFEST=/tmp/final-v120-manifest.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee "$FINAL_MANIFEST" >/dev/null
          grep -q 'launchMode.singleTask' "$FINAL_MANIFEST" || { echo "ERRO: launchMode=singleTask não encontrado no APK."; exit 1; }
          grep -q 'audio/*' "$FINAL_MANIFEST" || { echo "ERRO: audio/ não encontrado no APK."; exit 1; }
          grep -q 'image/*' "$FINAL_MANIFEST" || { echo "ERRO: image/* não encontrado no APK."; exit 1; }
          grep -q '*/*' "$FINAL_MANIFEST" || { echo "ERRO: / não encontrado no APK."; exit 1; }
          grep -q 'android.intent.action.SEND' "$FINAL_MANIFEST" || { echo "ERRO: ACTION_SEND não encontrado no APK."; exit 1; }
          grep -q 'android.intent.action.SEND_MULTIPLE' "$FINAL_MANIFEST" || { echo "ERRO: ACTION_SEND_MULTIPLE não encontrado no APK."; exit 1; }
          grep -q 'grantUriPermissions' "$FINAL_MANIFEST" || { echo "ERRO: grantUriPermissions não encontrado no APK."; exit 1; }
          echo "OK NO APK: singleTask + grantUriPermissions + SEND + SEND_MULTIPLE + áudio + foto + MIME genérico"

      - name: Validar assinatura do APK
        shell: bash
        run: |
          set -e
          APK="$APK_PATH"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER" || { echo "ERRO: apksigner não encontrado."; exit 1; }
          "$APKSIGNER" verify --verbose "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: gestao-sacerdotista-aime-v131-google-drive
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 1

      - name: Limpar arquivo temporário de assinatura
        if: always()
        shell: bash
        run: |
          rm -f "$PROJECT_DIR/android/app/release-key.jks" 2>/dev/null || true

name: V119 - Gerar APK RELEASE

on:
  workflow_dispatch:

jobs:
  build-v119:
    runs-on: ubuntu-latest

    env:
      ZIP_FILE: ./Gestao_Sacerdotista_Aime_V119_CAIXA_MIDIAS_WHATSAPP_CORRIGIDA.zip

      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1 - BAIXAR REPOSITÓRIO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4


      # ============================================================
      # 2 - CONFIGURAR JAVA
      # ============================================================

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # 3 - ENCONTRAR ZIP
      # ============================================================

      - name: Localizar ZIP V119
        shell: bash
        run: |
          set -e

          echo "Procurando ZIP da V119..."

          ZIP_FOUND="$(find . \
            -type f \
            -iname '*V119*.zip' \
            | head -n 1)"

          if [ -z "$ZIP_FOUND" ]; then
            echo "ERRO: ZIP V119 não encontrado."
            echo ""
            echo "Arquivos encontrados:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP_FOUND"

          echo "ZIP_REAL=$ZIP_FOUND" >> "$GITHUB_ENV"


      # ============================================================
      # 4 - EXTRAIR ZIP
      # ============================================================

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ./projeto-v119

          mkdir -p ./projeto-v119

          unzip -q "$ZIP_REAL" -d ./projeto-v119

          echo ""
          echo "Projeto extraído."
          echo ""
          echo "Estrutura encontrada:"
          find ./projeto-v119 \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -500


      # ============================================================
      # 5 - LOCALIZAR GRADLEW AUTOMATICAMENTE
      # ============================================================

      - name: Encontrar projeto Gradle
        shell: bash
        run: |
          set -e

          echo "Procurando gradlew dentro do ZIP..."

          GRADLEW="$(find ./projeto-v119 \
            -type f \
            -name gradlew \
            | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "ERRO: gradlew não encontrado dentro do ZIP."
            echo ""
            echo "Arquivos encontrados:"
            find ./projeto-v119 \
              -maxdepth 8 \
              -type f \
              | sort
            exit 1
          fi

          ANDROID_DIR="$(dirname "$GRADLEW")"

          echo ""
          echo "=================================================="
          echo "GRADLEW ENCONTRADO:"
          echo "$GRADLEW"
          echo ""
          echo "ANDROID_DIR:"
          echo "$ANDROID_DIR"
          echo "=================================================="

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 6 - VALIDAR PROJETO
      # ============================================================

      - name: Validar estrutura Android
        shell: bash
        run: |
          set -e

          test -f "$ANDROID_DIR/gradlew" || {
            echo "ERRO: gradlew não encontrado em:"
            echo "$ANDROID_DIR"
            exit 1
          }

          test -f "$ANDROID_DIR/settings.gradle" \
            || test -f "$ANDROID_DIR/settings.gradle.kts" \
            || {
              echo "ERRO: settings.gradle não encontrado."
              exit 1
            }

          echo "OK: projeto Gradle válido."


      # ============================================================
      # 7 - ENCONTRAR APP MODULE
      # ============================================================

      - name: Encontrar módulo app
        shell: bash
        run: |
          set -e

          if [ -f "$ANDROID_DIR/app/build.gradle" ]; then

            APP_DIR="$ANDROID_DIR/app"

          elif [ -f "$ANDROID_DIR/app/build.gradle.kts" ]; then

            APP_DIR="$ANDROID_DIR/app"

          else

            BUILD_FILE="$(find "$ANDROID_DIR" \
              -mindepth 2 \
              -maxdepth 5 \
              \( -name build.gradle -o -name build.gradle.kts \) \
              | head -n 1)"

            if [ -z "$BUILD_FILE" ]; then
              echo "ERRO: build.gradle do módulo app não encontrado."
              exit 1
            fi

            APP_DIR="$(dirname "$BUILD_FILE")"

          fi

          echo ""
          echo "APP_DIR:"
          echo "$APP_DIR"

          test -d "$APP_DIR" || {
            echo "ERRO: APP_DIR inválido."
            exit 1
          }

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 8 - CONFIGURAR KEYSTORE
      # ============================================================

      - name: Localizar release-key.jks
        shell: bash
        run: |
          set -e

          KEYSTORE="$APP_DIR/release-key.jks"

          if [ -f "$KEYSTORE" ]; then

            echo "OK: release-key.jks encontrado em:"
            echo "$KEYSTORE"

          else

            FOUND_KEYSTORE="$(find "$ANDROID_DIR" \
              -type f \
              -name 'release-key.jks' \
              | head -n 1)"

            if [ -z "$FOUND_KEYSTORE" ]; then
              echo "ERRO: release-key.jks não encontrado."
              exit 1
            fi

            cp "$FOUND_KEYSTORE" "$KEYSTORE"

            echo "Keystore copiado para:"
            echo "$KEYSTORE"

          fi

          test -s "$KEYSTORE" || {
            echo "ERRO: keystore vazio."
            exit 1
          }


      # ============================================================
      # 9 - VALIDAR KEYSTORE
      # ============================================================

      - name: Validar assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          keytool -list \
            -keystore "$APP_DIR/release-key.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          echo "OK: keystore e alias válidos."


      # ============================================================
      # 10 - CORRIGIR BUILD.GRADLE
      #     V119 / VERSION CODE 119 / MIN SDK 26
      # ============================================================

      - name: Corrigir configuração V119
        shell: bash
        run: |
          set -e

          BUILD_FILE="$APP_DIR/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then

            BUILD_FILE="$APP_DIR/build.gradle.kts"

          fi

          test -f "$BUILD_FILE" || {
            echo "ERRO: arquivo build.gradle não encontrado."
            exit 1
          }

          echo "Build file:"
          echo "$BUILD_FILE"

          python3 - "$BUILD_FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          text = path.read_text()

          # ========================================================
          # VERSION NAME
          # ========================================================

          if re.search(r'versionName\s+"[^"]+"', text):

              text = re.sub(
                  r'versionName\s+"[^"]+"',
                  'versionName "1.19.0"',
                  text,
                  count=1
              )

          # ========================================================
          # VERSION CODE
          # ========================================================

          if re.search(r'versionCode\s+\d+', text):

              text = re.sub(
                  r'versionCode\s+\d+',
                  'versionCode 119',
                  text,
                  count=1
              )

          # ========================================================
          # MIN SDK
          # ========================================================

          if re.search(r'minSdkVersion\s+\d+', text):

              text = re.sub(
                  r'minSdkVersion\s+\d+',
                  'minSdkVersion 26',
                  text,
                  count=1
              )

          elif re.search(r'minSdk\s+\d+', text):

              text = re.sub(
                  r'minSdk\s+\d+',
                  'minSdk 26',
                  text,
                  count=1
              )

          else:

              m = re.search(
                  r'defaultConfig\s*\{',
                  text
              )

              if m:

                  pos = m.end()

                  text = (
                      text[:pos]
                      + '\n        minSdkVersion 26\n'
                      + text[pos:]
                  )

              else:

                  raise SystemExit(
                      "ERRO: defaultConfig não encontrado."
                  )

          # ========================================================
          # SIGNING CONFIG
          # ========================================================

          signing_config = '''
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''

          if 'signingConfigs {' not in text:

              m = re.search(
                  r'android\s*\{',
                  text
              )

              if not m:

                  raise SystemExit(
                      "ERRO: bloco android não encontrado."
                  )

              pos = m.end()

              text = (
                  text[:pos]
                  + '\n'
                  + signing_config
                  + text[pos:]
              )

          # ========================================================
          # BUILD TYPE RELEASE
          # ========================================================

          release_pattern = re.compile(
              r'release\s*\{[^{}]*\}',
              re.S
          )

          releases = release_pattern.findall(text)

          if releases:

              if not any(
                  'signingConfig signingConfigs.release' in r
                  for r in releases
              ):

                  first = releases[0]

                  new = first.rstrip('}') + '''
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }'''

                  text = text.replace(
                      first,
                      new,
                      1
                  )

          else:

              m = re.search(
                  r'buildTypes\s*\{',
                  text
              )

              if m:

                  pos = m.end()

                  block = '''
                      release {
                          signingConfig signingConfigs.release
                          minifyEnabled false
                      }
                  '''

                  text = (
                      text[:pos]
                      + block
                      + text[pos:]
                  )

              else:

                  raise SystemExit(
                      "ERRO: buildTypes não encontrado."
                  )

          path.write_text(text)

          print("")
          print("==========================================")
          print("CONFIGURAÇÃO V119 APLICADA")
          print("versionName = 1.19.0")
          print("versionCode = 119")
          print("minSdk = 26")
          print("release signing = configurado")
          print("==========================================")
          PY


      # ============================================================
      # 11 - MOSTRAR CONFIGURAÇÃO
      # ============================================================

      - name: Conferir configuração
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "BUILD.GRADLE FINAL"
          echo "=========================================="

          grep -nE \
            'versionCode|versionName|minSdk|minSdkVersion|signingConfig|storeFile' \
            "$APP_DIR/build.gradle" \
            || true

          echo "=========================================="


      # ============================================================
      # 12 - VALIDAR V119
      # ============================================================

      - name: Validar V119
        shell: bash
        run: |
          set -e

          BUILD_FILE="$APP_DIR/build.gradle"

          grep -q \
            'versionCode 119' \
            "$BUILD_FILE" || {
              echo "ERRO: versionCode 119 não encontrado."
              exit 1
          }

          grep -q \
            'versionName "1.19.0"' \
            "$BUILD_FILE" || {
              echo "ERRO: versionName 1.19.0 não encontrado."
              exit 1
          }

          grep -Eq \
            'minSdkVersion 26|minSdk 26' \
            "$BUILD_FILE" || {
              echo "ERRO: minSdk 26 não encontrado."
              exit 1
          }

          grep -q \
            'signingConfig signingConfigs.release' \
            "$BUILD_FILE" || {
              echo "ERRO: assinatura release não configurada."
              exit 1
          }

          echo ""
          echo "V119 VALIDADA COM SUCESSO."


      # ============================================================
      # 13 - DAR PERMISSÃO AO GRADLE
      # ============================================================

      - name: Preparar Gradle
        shell: bash
        run: |
          set -e

          chmod +x "$ANDROID_DIR/gradlew"

          test -x "$ANDROID_DIR/gradlew" || {
            echo "ERRO: gradlew não executável."
            exit 1
          }

          echo "OK: gradlew pronto."


      # ============================================================
      # 14 - BUILD RELEASE
      # ============================================================

      - name: Gerar APK RELEASE
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 15 - LOCALIZAR APK
      # ============================================================

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          APK="$(find "$APP_DIR/build/outputs/apk/release" \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then

            echo "ERRO: APK não foi gerado."

            echo ""
            echo "Arquivos de build:"
            find "$APP_DIR/build" \
              -type f \
              | sort \
              | tail -100

            exit 1
          fi

          echo ""
          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" \
            "./Gestao_Sacerdotista_Aime_V119.apk"

          echo "APK_FINAL=./Gestao_Sacerdotista_Aime_V119.apk" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 16 - ENCONTRAR AAPT
      # ============================================================

      - name: Encontrar AAPT
        shell: bash
        run: |
          set -e

          AAPT="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name aapt \
            | sort -V \
            | tail -n 1)"

          test -n "$AAPT" || {
            echo "ERRO: aapt não encontrado."
            exit 1
          }

          echo "AAPT=$AAPT" >> "$GITHUB_ENV"

          echo "AAPT encontrado:"
          echo "$AAPT"


      # ============================================================
      # 17 - VALIDAR PERMISSÕES
      # ============================================================

      - name: Validar permissões
        shell: bash
        run: |
          set -e

          "$AAPT" dump permissions "$APK_FINAL" \
            | tee /tmp/apk-permissions.txt

          echo ""
          echo "Permissões encontradas no APK."


      # ============================================================
      # 18 - MANIFEST FINAL
      # ============================================================

      - name: Extrair Manifest
        shell: bash
        run: |
          set -e

          "$AAPT" dump xmltree \
            "$APK_FINAL" \
            AndroidManifest.xml \
            | tee /tmp/final-v119-manifest.txt


      # ============================================================
      # 19 - VALIDAR SHARE
      # ============================================================

      - name: Validar compartilhamento
        shell: bash
        run: |
          set -e

          MANIFEST="/tmp/final-v119-manifest.txt"

          echo ""
          echo "Validando ACTION_SEND..."

          grep -q \
            'android.intent.action.SEND' \
            "$MANIFEST" || {
              echo "ERRO: ACTION_SEND não encontrado."
              exit 1
          }

          echo "OK: ACTION_SEND"

          echo ""
          echo "Validando ACTION_SEND_MULTIPLE..."

          grep -q \
            'android.intent.action.SEND_MULTIPLE' \
            "$MANIFEST" || {
              echo "ERRO: ACTION_SEND_MULTIPLE não encontrado."
              exit 1
          }

          echo "OK: ACTION_SEND_MULTIPLE"

          echo ""
          echo "Validando image/*..."

          grep -q \
            'image/' \
            "$MANIFEST" || {
              echo "ERRO: image/* não encontrado."
              exit 1
          }

          echo "OK: image/*"

          echo ""
          echo "Validando audio/*..."

          grep -q \
            'audio/' \
            "$MANIFEST" || {
              echo "ERRO: audio/* não encontrado."
              exit 1
          }

          echo "OK: audio/*"


      # ============================================================
      # 20 - PUBLICAR APK
      # ============================================================

      - name: Publicar APK V119
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-Sacerdotista-Aime-V119
          path: Gestao_Sacerdotista_Aime_V119.apk
          if-no-files-found: error


      # ============================================================
      # 21 - PUBLICAR DIAGNÓSTICO
      # ============================================================

      - name: Publicar diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: V119-diagnostico
          path: |
            /tmp/final-v119-manifest.txt
            /tmp/apk-permissions.txt
          if-no-files-found: warn


      # ============================================================
      # 22 - RESULTADO
      # ============================================================

      - name: Resultado final
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "       GESTÃO SACERDOTISTA AIMÊ - V119"
          echo "=================================================="
          echo ""
          echo "APK RELEASE GERADO COM SUCESSO"
          echo ""
          echo "Version Code : 119"
          echo "Version Name : 1.19.0"
          echo "Min SDK      : 26"
          echo "Assinatura   : OK"
          echo "Share Audio  : OK"
          echo "Share Foto   : OK"
          echo ""
          echo "=================================================="

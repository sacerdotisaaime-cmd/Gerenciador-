name: Build Android APK - V120 - WHATSAPP AUDIO SHARE - FIXED

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # 1. PREPARAÇÃO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ============================================================
      # 2. VALIDAR CHAVES DE ASSINATURA
      # ============================================================

      - name: Validar secrets de assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERRO: ANDROID_KEYSTORE_BASE64 vazio"
            exit 1
          }

          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "ERRO: ANDROID_KEYSTORE_PASSWORD vazio"
            exit 1
          }

          test -n "$ANDROID_KEY_ALIAS" || {
            echo "ERRO: ANDROID_KEY_ALIAS vazio"
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "ERRO: ANDROID_KEY_PASSWORD vazio"
            exit 1
          }

          echo "Secrets de assinatura reconhecidas."

      # ============================================================
      # 3. ENCONTRAR ZIP
      # ============================================================

      - name: Encontrar ZIP do projeto
        shell: bash
        run: |
          set -e

          mapfile -t ZIPS < <(
            find . \
              -maxdepth 2 \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | sort
          )

          COUNT="${#ZIPS[@]}"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERRO: nenhum ZIP foi encontrado."
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "ERRO: foram encontrados vários ZIPs."
            echo "Deixe somente o ZIP da versão que será compilada."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIPS[0]}"

          echo "ZIP selecionado:"
          echo "$ZIP_FILE"

          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ============================================================
      # 4. DESCOMPACTAR
      # ============================================================

      - name: Descompactar projeto
        shell: bash
        run: |
          set -e

          rm -rf app
          mkdir -p app

          unzip -q "$ZIP_FILE" -d app

      # ============================================================
      # 5. LOCALIZAR PROJETO
      # ============================================================

      - name: Localizar projeto
        shell: bash
        run: |
          set -e

          PROJECT_PACKAGE=$(
            find app \
              -name package.json \
              -not -path "*/node_modules/*" \
              -print \
              | head -n 1
          )

          if [ -z "$PROJECT_PACKAGE" ]; then
            echo "ERRO: package.json não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_PACKAGE")

          echo "Projeto encontrado em:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 6. DEPENDÊNCIAS
      # ============================================================

      - name: Ajustar dependências
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          node <<'NODE'
          const fs = require('fs');

          const file = 'package.json';

          const pkg = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          const deps =
            pkg.dependencies ||
            (pkg.dependencies = {});

          deps['@capacitor/core'] = '^7.4.3';
          deps['@capacitor/android'] = '^7.4.3';
          deps['@capacitor/camera'] = '^7.0.5';
          deps['@capacitor/share'] = '^7.0.2';
          deps['@capacitor/filesystem'] = '^7.0.2';
          deps['@capacitor-community/contacts'] = '7.2.0';
          deps['capacitor-voice-recorder'] = '7.0.6';
          deps['@capacitor/barcode-scanner'] = '2.0.4';

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + '\n'
          );
          NODE

          rm -rf node_modules
          rm -f package-lock.json

      - name: Instalar dependências
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npm install
          npm install -D @capacitor/cli@7.4.3

      # ============================================================
      # 7. BUILD WEB
      # ============================================================

      - name: Compilar aplicação web
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx vite build

      # ============================================================
      # 8. ANDROID
      # ============================================================

      - name: Adicionar Android
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap add android

      - name: Ajustar SDK Android
        shell: bash
        run: |
          set -e

          VARIABLES="$PROJECT_DIR/android/variables.gradle"

          if [ -f "$VARIABLES" ]; then
            sed -i \
              's/minSdkVersion = [0-9]*/minSdkVersion = 26/' \
              "$VARIABLES"
          fi

      - name: Sincronizar Capacitor
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap sync android

      # ============================================================
      # 9. PERMISSION BRIDGE
      #
      # RECEBE:
      # - WhatsApp
      # - SEND
      # - SEND_MULTIPLE
      # - áudio
      # - fotos
      # - MIME genérico
      #
      # SALVA EM:
      # shared-media-inbox
      # ============================================================

      - name: Criar PermissionBridge
        shell: bash
        run: |
          set -e

          ANDROID_SRC="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao"

          mkdir -p "$ANDROID_SRC"

          cat > "$ANDROID_SRC/PermissionBridgePlugin.java" <<'JAVA'
          package com.sacerdotisaaime.gestao;

          import android.Manifest;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.OpenableColumns;
          import android.provider.Settings;
          import android.util.Base64;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.util.ArrayList;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;

          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
            name = "PermissionBridge",
            permissions = {
              @Permission(
                alias = "contacts",
                strings = {
                  Manifest.permission.READ_CONTACTS,
                  Manifest.permission.WRITE_CONTACTS
                }
              ),
              @Permission(
                alias = "microphone",
                strings = {
                  Manifest.permission.RECORD_AUDIO
                }
              )
            }
          )
          public class PermissionBridgePlugin extends Plugin {

            private static PermissionBridgePlugin instance;

            private static Intent pendingSharedIntent;

            private static boolean initialSyncClaimed = false;

            private static boolean sharedLaunch = false;

            private static final String INBOX_DIR =
              "shared-media-inbox";

            private static final long MAX_AUDIO_BYTES =
              50L * 1024L * 1024L;

            private static final long MAX_PHOTO_BYTES =
              20L * 1024L * 1024L;

            @Override
            public void load() {
              super.load();

              instance = this;

              Intent pending = pendingSharedIntent;

              pendingSharedIntent = null;

              if (pending != null) {
                handleSharedIntent(pending);
              }
            }

            private File inboxDir() {

              File dir = new File(
                getContext().getFilesDir(),
                INBOX_DIR
              );

              if (!dir.exists()) {
                dir.mkdirs();
              }

              return dir;
            }

            private String typeFor(Uri uri) {

              try {
                return getContext()
                  .getContentResolver()
                  .getType(uri);

              } catch (Exception ignored) {
                return null;
              }
            }

            private String displayName(Uri uri) {

              try {

                android.database.Cursor cursor =
                  getContext()
                    .getContentResolver()
                    .query(
                      uri,
                      new String[]{
                        OpenableColumns.DISPLAY_NAME
                      },
                      null,
                      null,
                      null
                    );

                if (cursor != null) {

                  try {

                    if (cursor.moveToFirst()) {
                      return cursor.getString(0);
                    }

                  } finally {
                    cursor.close();
                  }
                }

              } catch (Exception ignored) {}

              return null;
            }

            private String b64(String value) {

              return Base64.encodeToString(
                (
                  value == null
                    ? ""
                    : value
                ).getBytes(
                  java.nio.charset.StandardCharsets.UTF_8
                ),
                Base64.URL_SAFE |
                Base64.NO_WRAP |
                Base64.NO_PADDING
              );
            }

            private String unb64(String value) {

              try {

                return new String(
                  Base64.decode(
                    value,
                    Base64.URL_SAFE
                  ),
                  java.nio.charset.StandardCharsets.UTF_8
                );

              } catch (Exception ignored) {
                return "";
              }
            }

            private String[] parse(File file) {

              return file
                .getName()
                .split("__", -1);
            }

            private JSObject metadata(File file) {

              String[] p = parse(file);

              JSObject o = new JSObject();

              if (p.length < 5) {
                return o;
              }

              o.put("id", p[0]);
              o.put("kind", p[3]);
              o.put("mimeType", unb64(p[1]));
              o.put("name", unb64(p[2]));
              o.put("size", file.length());

              o.put(
                "receivedAt",
                new java.text.SimpleDateFormat(
                  "yyyy-MM-dd'T'HH:mm:ss.SSSXXX",
                  java.util.Locale.US
                ).format(
                  new java.util.Date(
                    file.lastModified()
                  )
                )
              );

              return o;
            }

            private File findById(String id) {

              if (
                id == null ||
                id.trim().isEmpty()
              ) {
                return null;
              }

              File[] files =
                inboxDir().listFiles();

              if (files == null) {
                return null;
              }

              for (File file : files) {

                if (
                  file.getName()
                    .startsWith(id + "__")
                ) {
                  return file;
                }
              }

              return null;
            }

            private boolean startsWith(
              byte[] data,
              int len,
              byte... signature
            ) {

              if (
                len < signature.length
              ) {
                return false;
              }

              for (
                int i = 0;
                i < signature.length;
                i++
              ) {

                if (
                  data[i] != signature[i]
                ) {
                  return false;
                }
              }

              return true;
            }

            private String sniffKindAndMime(
              File file
            ) throws Exception {

              byte[] h = new byte[64];

              int len = 0;

              try (
                InputStream input =
                  new FileInputStream(file)
              ) {

                while (len < h.length) {

                  int n =
                    input.read(
                      h,
                      len,
                      h.length - len
                    );

                  if (n < 0) {
                    break;
                  }

                  if (n == 0) {
                    continue;
                  }

                  len += n;
                }
              }

              // JPEG
              if (
                len >= 3 &&
                (h[0] & 0xff) == 0xff &&
                (h[1] & 0xff) == 0xd8 &&
                (h[2] & 0xff) == 0xff
              ) {
                return "photo|image/jpeg";
              }

              // PNG
              if (
                startsWith(
                  h,
                  len,
                  (byte)0x89,
                  0x50,
                  0x4e,
                  0x47,
                  0x0d,
                  0x0a,
                  0x1a,
                  0x0a
                )
              ) {
                return "photo|image/png";
              }

              // WEBP
              if (
                len >= 12 &&
                startsWith(
                  h,
                  len,
                  0x52,
                  0x49,
                  0x46,
                  0x46
                ) &&
                h[8] == 'W' &&
                h[9] == 'E' &&
                h[10] == 'B' &&
                h[11] == 'P'
              ) {
                return "photo|image/webp";
              }

              // OGG / OPUS
              if (
                startsWith(
                  h,
                  len,
                  0x4f,
                  0x67,
                  0x67,
                  0x53
                )
              ) {
                return "audio|audio/ogg";
              }

              // WAV
              if (
                len >= 12 &&
                startsWith(
                  h,
                  len,
                  0x52,
                  0x49,
                  0x46,
                  0x46
                ) &&
                h[8] == 'W' &&
                h[9] == 'A' &&
                h[10] == 'V' &&
                h[11] == 'E'
              ) {
                return "audio|audio/wav";
              }

              // MP3 ID3
              if (
                startsWith(
                  h,
                  len,
                  0x49,
                  0x44,
                  0x33
                )
              ) {
                return "audio|audio/mpeg";
              }

              // MP3 frame / AAC ADTS
              if (
                len >= 2 &&
                (h[0] & 0xff) == 0xff &&
                (h[1] & 0xe0) == 0xe0
              ) {
                return "audio|audio/mpeg";
              }

              // HEIC / HEIF / M4A
              if (
                len >= 12 &&
                h[4] == 'f' &&
                h[5] == 't' &&
                h[6] == 'y' &&
                h[7] == 'p'
              ) {

                String brand =
                  new String(
                    h,
                    8,
                    4,
                    java.nio.charset.StandardCharsets.US_ASCII
                  );

                if (
                  brand.equals("heic") ||
                  brand.equals("heix") ||
                  brand.equals("hevc") ||
                  brand.equals("hevx") ||
                  brand.equals("mif1") ||
                  brand.equals("msf1")
                ) {
                  return "photo|image/heic";
                }

                if (
                  brand.equals("M4A ") ||
                  brand.equals("M4B ")
                ) {
                  return "audio|audio/mp4";
                }
              }

              // WEBM
              if (
                startsWith(
                  h,
                  len,
                  0x1a,
                  0x45,
                  0xdf,
                  0xa3
                )
              ) {
                return "audio|audio/webm";
              }

              return null;
            }

            private String extensionFor(
              String mime,
              String originalName
            ) {

              String lower =
                originalName == null
                  ? ""
                  : originalName.toLowerCase(
                      java.util.Locale.US
                    );

              if (
                lower.matches(
                  ".*\\.(ogg|opus|m4a|aac|mp3|wav|amr|3gp|webm|mp4)$"
                )
              ) {
                return lower.substring(
                  lower.lastIndexOf('.') + 1
                );
              }

              if (mime.contains("ogg")) {
                return "ogg";
              }

              if (mime.contains("mpeg")) {
                return "mp3";
              }

              if (mime.contains("wav")) {
                return "wav";
              }

              if (mime.contains("webm")) {
                return "webm";
              }

              if (mime.contains("mp4")) {
                return "m4a";
              }

              if (mime.contains("png")) {
                return "png";
              }

              if (mime.contains("webp")) {
                return "webp";
              }

              if (mime.contains("heic")) {
                return "heic";
              }

              return mime.contains("jpeg")
                ? "jpg"
                : "bin";
            }

            private void storeUri(Uri uri) {

              if (uri == null) {
                return;
              }

              String mime = typeFor(uri);

              String name = displayName(uri);

              String lowerName =
                name == null
                  ? ""
                  : name

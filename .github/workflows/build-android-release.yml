name: Build Android APK - RELEASE - AUDIO SHARE

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # 1. BAIXAR PROJETO
      # ============================================================
      - name: Baixar projeto
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE
      # ============================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 3. JAVA
      # ============================================================
      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      # ============================================================
      # 4. VALIDAR SECRETS
      # ============================================================
      - name: Validar secrets de assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERRO: ANDROID_KEYSTORE_BASE64 vazio"
            exit 1
          }

          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "ERRO: ANDROID_KEYSTORE_PASSWORD vazio"
            exit 1
          }

          test -n "$ANDROID_KEY_ALIAS" || {
            echo "ERRO: ANDROID_KEY_ALIAS vazio"
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "ERRO: ANDROID_KEY_PASSWORD vazio"
            exit 1
          }

          echo "Secrets reconhecidas."


      # ============================================================
      # 5. ENCONTRAR ZIP
      # ============================================================
      - name: Encontrar ZIP do projeto
        shell: bash
        run: |
          set -e

          mapfile -t ZIPS < <(
            find . -maxdepth 2 \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | sort
          )

          COUNT="${#ZIPS[@]}"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERRO: nenhum ZIP encontrado."
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "ERRO: existem vários ZIPs."
            echo "Deixe somente o ZIP da versão que será compilada."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIPS[0]}"

          echo "ZIP selecionado:"
          echo "$ZIP_FILE"

          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 6. DESCOMPACTAR
      # ============================================================
      - name: Descompactar projeto
        shell: bash
        run: |
          set -e

          rm -rf app
          mkdir -p app

          unzip -q "$ZIP_FILE" -d app


      # ============================================================
      # 7. LOCALIZAR PROJETO
      # ============================================================
      - name: Localizar projeto
        shell: bash
        run: |
          set -e

          PROJECT_PACKAGE=$(
            find app \
              -name package.json \
              -not -path "*/node_modules/*" \
              -print \
              | head -n 1
          )

          if [ -z "$PROJECT_PACKAGE" ]; then
            echo "ERRO: package.json não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_PACKAGE")

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 8. AJUSTAR DEPENDÊNCIAS
      # ============================================================
      - name: Ajustar dependências
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          node <<'NODE'
          const fs = require('fs');

          const file = 'package.json';

          const pkg = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          const deps =
            pkg.dependencies ||
            (pkg.dependencies = {});

          deps['@capacitor/core'] = '^7.4.3';
          deps['@capacitor/android'] = '^7.4.3';
          deps['@capacitor/camera'] = '^7.0.5';
          deps['@capacitor/share'] = '^7.0.2';
          deps['@capacitor/filesystem'] = '^7.0.2';
          deps['@capacitor-community/contacts'] = '7.2.0';
          deps['capacitor-voice-recorder'] = '7.0.6';
          deps['@capacitor/barcode-scanner'] = '2.0.4';

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + '\n'
          );
          NODE

          rm -rf node_modules
          rm -f package-lock.json


      # ============================================================
      # 9. INSTALAR
      # ============================================================
      - name: Instalar dependências
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npm install

          npm install -D @capacitor/cli@7.4.3


      # ============================================================
      # 10. BUILD WEB
      # ============================================================
      - name: Compilar aplicação web
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx vite build


      # ============================================================
      # 11. ADICIONAR ANDROID
      # ============================================================
      - name: Adicionar Android
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap add android


      # ============================================================
      # 12. SDK MÍNIMO
      # ============================================================
      - name: Ajustar SDK Android
        shell: bash
        run: |
          set -e

          VARIABLES="$PROJECT_DIR/android/variables.gradle"

          if [ -f "$VARIABLES" ]; then
            sed -i \
              's/minSdkVersion = [0-9]*/minSdkVersion = 26/' \
              "$VARIABLES"
          fi


      # ============================================================
      # 13. SINCRONIZAR CAPACITOR
      # ============================================================
      - name: Sincronizar Capacitor
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap sync android


      # ============================================================
      # 14. CRIAR PERMISSION BRIDGE
      # ============================================================
      - name: Criar PermissionBridge
        shell: bash
        run: |
          set -e

          ANDROID_SRC="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao"

          mkdir -p "$ANDROID_SRC"

          cat > "$ANDROID_SRC/PermissionBridgePlugin.java" <<'JAVA'
          package com.sacerdotisaaime.gestao;

          import android.Manifest;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.Settings;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;

          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
            name = "PermissionBridge",
            permissions = {
              @Permission(
                alias = "contacts",
                strings = {
                  Manifest.permission.READ_CONTACTS,
                  Manifest.permission.WRITE_CONTACTS
                }
              ),
              @Permission(
                alias = "microphone",
                strings = {
                  Manifest.permission.RECORD_AUDIO
                }
              )
            }
          )
          public class PermissionBridgePlugin extends Plugin {

            @PluginMethod
            public void requestContacts(PluginCall call) {

              if (
                getPermissionState("contacts")
                == PermissionState.GRANTED
              ) {
                JSObject result = new JSObject();
                result.put("granted", true);
                result.put("state", "granted");
                call.resolve(result);
                return;
              }

              requestPermissionForAlias(
                "contacts",
                call,
                "contactsPermissionResult"
              );
            }

            @PermissionCallback
            private void contactsPermissionResult(
              PluginCall call
            ) {

              boolean granted =
                getPermissionState("contacts")
                == PermissionState.GRANTED;

              JSObject result = new JSObject();

              result.put("granted", granted);
              result.put(
                "state",
                granted ? "granted" : "denied"
              );

              call.resolve(result);
            }

            @PluginMethod
            public void requestMicrophone(PluginCall call) {

              if (
                getPermissionState("microphone")
                == PermissionState.GRANTED
              ) {
                JSObject result = new JSObject();
                result.put("granted", true);
                result.put("state", "granted");
                call.resolve(result);
                return;
              }

              requestPermissionForAlias(
                "microphone",
                call,
                "microphonePermissionResult"
              );
            }

            @PermissionCallback
            private void microphonePermissionResult(
              PluginCall call
            ) {

              boolean granted =
                getPermissionState("microphone")
                == PermissionState.GRANTED;

              JSObject result = new JSObject();

              result.put("granted", granted);
              result.put(
                "state",
                granted ? "granted" : "denied"
              );

              call.resolve(result);
            }

            @PluginMethod
            public void getPermissionStates(
              PluginCall call
            ) {

              JSObject result = new JSObject();

              result.put(
                "contacts",
                getPermissionState("contacts").toString()
              );

              result.put(
                "microphone",
                getPermissionState("microphone").toString()
              );

              call.resolve(result);
            }

            @PluginMethod
            public void openSettings(
              PluginCall call
            ) {

              try {

                Intent intent =
                  new Intent(
                    Settings.ACTION_APPLICATION_DETAILS_SETTINGS
                  );

                intent.setData(
                  Uri.parse(
                    "package:" +
                    getContext().getPackageName()
                  )
                );

                getActivity().startActivity(intent);

                call.resolve();

              } catch (Exception ex) {

                call.reject(
                  "SETTINGS_ERROR",
                  ex.getMessage()
                );
              }
            }
          }
          JAVA


      # ============================================================
      # 15. MAIN ACTIVITY
      # ============================================================
      - name: Configurar MainActivity
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao/MainActivity.java"

          cat > "$MAIN" <<'JAVA'
          package com.sacerdotisaaime.gestao;

          import android.content.Intent;
          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

            @Override
            public void onCreate(
              Bundle savedInstanceState
            ) {

              registerPlugin(
                PermissionBridgePlugin.class
              );

              super.onCreate(savedInstanceState);
            }

            @Override
            public void onNewIntent(Intent intent) {

              super.onNewIntent(intent);

              setIntent(intent);
            }
          }
          JAVA


      # ============================================================
      # 16. CONFIGURAR MANIFEST PARA RECEBER COMPARTILHAMENTO
      # ============================================================
      - name: Configurar Android para receber áudio do WhatsApp
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST" || {
            echo "ERRO: AndroidManifest.xml não encontrado."
            exit 1
          }

          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          text = path.read_text()

          # --------------------------------------------------------
          # Encontrar MainActivity
          # --------------------------------------------------------

          patterns = [
              r'<activity\b[^>]*android:name="[^"]*\.MainActivity"[^>]*>',
              r'<activity\b[^>]*android:name="com\.sacerdotisaaime\.gestao\.MainActivity"[^>]*>',
              r'<activity\b[^>]*android:name="MainActivity"[^>]*>',
          ]

          match = None

          for pattern in patterns:
              match = re.search(
                  pattern,
                  text,
                  flags=re.IGNORECASE
              )

              if match:
                  break

          if not match:
              raise SystemExit(
                  "ERRO: MainActivity não encontrada no Manifest."
              )

          activity_start = match.start()
          activity_tag_end = match.end()

          activity_open = text[activity_start:activity_tag_end]

          # --------------------------------------------------------
          # Android 12+
          # --------------------------------------------------------

          if "android:exported=" not in activity_open:
              activity_open = activity_open[:-1] + \
                  ' android:exported="true">'

          else:
              activity_open = re.sub(
                  r'android:exported="[^"]*"',
                  'android:exported="true"',
                  activity_open
              )

          # --------------------------------------------------------
          # Manter a Activity única para receber novos intents
          # --------------------------------------------------------

          if "android:launchMode=" not in activity_open:
              activity_open = activity_open[:-1] + \
                  ' android:launchMode="singleTop">'

          else:
              activity_open = re.sub(
                  r'android:launchMode="[^"]*"',
                  'android:launchMode="singleTop"',
                  activity_open
              )

          text = (
              text[:activity_start] +
              activity_open +
              text[activity_tag_end:]
          )

          # Recalcular MainActivity
          match = None

          for pattern in patterns:
              match = re.search(
                  pattern,
                  text,
                  flags=re.IGNORECASE
              )

              if match:
                  break

          if not match:
              raise SystemExit(
                  "ERRO: não foi possível localizar novamente a MainActivity."
              )

          start = match.end()

          # Encontrar o fechamento correspondente da Activity.
          # O Manifest criado pelo Capacitor normalmente possui
          # somente uma MainActivity.
          close = text.find(
              "</activity>",
              start
          )

          if close < 0:
              raise SystemExit(
                  "ERRO: fechamento da MainActivity não encontrado."
              )

          # --------------------------------------------------------
          # Filtros de compartilhamento
          # --------------------------------------------------------

          filters = r'''
              <!-- Gestão Sacerdotista Aimê - receber áudio -->
              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="audio/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND_MULTIPLE" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="audio/*" />
              </intent-filter>

              <!--
                Alguns aplicativos/Samsung podem compartilhar o arquivo
                com MIME genérico. Este filtro garante que o aplicativo
                também apareça nesses casos.
              -->
              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="*/*" />
              </intent-filter>
          '''

          # Remover filtros que já tenham sido adicionados
          # por alguma etapa anterior.
          existing_start = text.find(
              "<!-- Gestão Sacerdotista Aimê - receber áudio -->"
          )

          if existing_start >= 0:

              existing_end = text.find(
                  "</intent-filter>",
                  existing_start
              )

              # Remove somente até o último filtro conhecido.
              # Mais seguro reconstruir pelos marcadores abaixo.
              while existing_start >= 0:

                  next_filter_end = text.find(
                      "</intent-filter>",
                      existing_start
                  )

                  if next_filter_end < 0:
                      break

                  next_filter_end += len(
                      "</intent-filter>"
                  )

                  block = text[
                      existing_start:next_filter_end
                  ]

                  text = text.replace(
                      block,
                      "",
                      1
                  )

                  existing_start = text.find(
                      "<!-- Gestão Sacerdotista Aimê - receber áudio -->"
                  )

          text = (
              text[:close] +
              filters +
              "\n        " +
              text[close:]
          )

          path.write_text(text)
          PY


      # ============================================================
      # 17. PERMISSÕES
      # ============================================================
      - name: Declarar permissões Android
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import sys

          manifest = Path(sys.argv[1])

          text = manifest.read_text()

          permissions = [
              "android.permission.READ_CONTACTS",
              "android.permission.WRITE_CONTACTS",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
          ]

          marker = "<application"

          if marker not in text:
              raise SystemExit(
                  "ERRO: <application> não encontrado."
              )

          additions = []

          for permission in permissions:

              if (
                  f'android:name="{permission}"'
                  not in text
              ):
                  additions.append(
                      f'    <uses-permission android:name="{permission}" />\n'
                  )

          if additions:

              text = text.replace(
                  marker,
                  "".join(additions) + marker,
                  1
              )

          manifest.write_text(text)
          PY


      # ============================================================
      # 18. VALIDAR MANIFEST ANTES DO BUILD
      # ============================================================
      - name: Validar receptor de áudio no Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          echo "=== VERIFICANDO ACTION_SEND ==="

          grep -q \
            'android.intent.action.SEND' \
            "$MANIFEST" || {
              echo "ERRO: ACTION_SEND não encontrado."
              exit 1
            }

          echo "OK: ACTION_SEND"


          echo "=== VERIFICANDO SEND_MULTIPLE ==="

          grep -q \
            'android.intent.action.SEND_MULTIPLE' \
            "$MANIFEST" || {
              echo "ERRO: SEND_MULTIPLE não encontrado."
              exit 1
            }

          echo "OK: SEND_MULTIPLE"


          echo "=== VERIFICANDO audio/* ==="

          grep -q \
            'android:mimeType="audio/\*"' \
            "$MANIFEST" || {
              echo "ERRO: audio/* não encontrado."
              exit 1
            }

          echo "OK: audio/*"


          echo "=== VERIFICANDO */* ==="

          grep -q \
            'android:mimeType="\*/\*"' \
            "$MANIFEST" || {
              echo "ERRO: */* não encontrado."
              exit 1
            }

          echo "OK: */*"


          echo "=== VERIFICANDO DEFAULT ==="

          grep -q \
            'android.intent.category.DEFAULT' \
            "$MANIFEST" || {
              echo "ERRO: CATEGORY_DEFAULT não encontrado."
              exit 1
            }

          echo "OK: CATEGORY_DEFAULT"


          echo "=== VERIFICANDO EXPORTED ==="

          grep -q \
            'android:exported="true"' \
            "$MANIFEST" || {
              echo "ERRO: exported=true não encontrado."
              exit 1
            }

          echo "OK: exported=true"


          echo "=== MANIFEST FINAL ==="

          cat "$MANIFEST"


      # ============================================================
      # 19. KEYSTORE
      # ============================================================
      - name: Preparar keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          KEYSTORE="$PROJECT_DIR/android/app/release-key.jks"

          printf '%s' \
            "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          chmod 600 "$KEYSTORE"

          echo "Keystore preparada."


      # ============================================================
      # 20. VERSÃO + ASSINATURA
      # ============================================================
      - name: Configurar versão e assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/android/app/build.gradle"

          test -f "$APP_GRADLE" || {
            echo "ERRO: build.gradle não encontrado."
            exit 1
          }

          python3 - "$APP_GRADLE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          text = path.read_text()

          # V114
          text = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "1.14.0"',
              text,
              count=1
          )

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode 114',
              text,
              count=1
          )

          # --------------------------------------------------------
          # Signing
          # --------------------------------------------------------

          if 'signingConfigs {' not in text:

              signing = '''
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              '''

              text = text.replace(
                  'android {',
                  'android {' + signing,
                  1
              )

          elif 'signingConfigs.release' not in text:

              text = text.replace(
                  'signingConfigs {',
                  '''signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              ''',
                  1
              )

          # --------------------------------------------------------
          # Release build type
          # --------------------------------------------------------

          build_types = re.search(
              r'buildTypes\s*\{',
              text
          )

          if not build_types:

              text += '''
              
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              '''

          else:

              tail = text[
                  build_types.end():
              ]

              release = re.search(
                  r'release\s*\{',
                  tail
              )

              if not release:

                  pos = build_types.end()

                  text = (
                      text[:pos] +
                      '''
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
                      ''' +
                      text[pos:]
                  )

              elif (
                  'signingConfig signingConfigs.release'
                  not in tail[
                      release.end():
                      release.end() + 2500
                  ]
              ):

                  pos = (
                      build_types.end() +
                      release.end()
                  )

                  text = (
                      text[:pos] +
                      '''
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      ''' +
                      text[pos:]
                  )

          path.write_text(text)
          PY


          # Validar keystore

          keytool -list \
            -keystore "$PROJECT_DIR/android/app/release-key.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          echo "Keystore e alias validados."


      # ============================================================
      # 21. VALIDAR PERMISSÕES
      # ============================================================
      - name: Validar permissões
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          for PERM in \
            READ_CONTACTS \
            WRITE_CONTACTS \
            RECORD_AUDIO \
            CAMERA
          do

            FULL="android.permission.$PERM"

            grep -q "$FULL" "$MANIFEST" || {
              echo "ERRO: $FULL não está no Manifest."
              exit 1
            }

            echo "OK: $FULL"

          done


      # ============================================================
      # 22. GERAR APK RELEASE
      # ============================================================
      - name: Gerar APK RELEASE
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "ERRO: senha do keystore não chegou."
            exit 1
          }

          test -n "$ANDROID_KEY_ALIAS" || {
            echo "ERRO: alias não chegou."
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "ERRO: senha da chave não chegou."
            exit 1
          }

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew assembleRelease --no-daemon


      # ============================================================
      # 23. LOCALIZAR APK
      # ============================================================
      - name: Localizar APK final
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then

            echo "ERRO: APK não encontrado."

            find "$PROJECT_DIR/android" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # 24. VALIDAR PERMISSÕES NO APK
      # ============================================================
      - name: Validar permissões do APK
        shell: bash
        run: |
          set -e

          APK="$APK_PATH"

          AAPT=$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt \
              | sort -V \
              | tail -n 1
          )

          test -n "$AAPT" || {
            echo "ERRO: aapt não encontrado."
            exit 1
          }

          "$AAPT" dump permissions "$APK" \
            | tee /tmp/apk-permissions.txt

          for PERM in \
            READ_CONTACTS \
            WRITE_CONTACTS \
            RECORD_AUDIO \
            CAMERA
          do

            FULL="android.permission.$PERM"

            grep -q "$FULL" \
              /tmp/apk-permissions.txt || {

              echo "ERRO: $FULL não está no APK."

              exit 1
            }

            echo "OK NO APK: $FULL"

          done


      # ============================================================
      # 25. VALIDAR INTENT FILTER DENTRO DO APK
      # ============================================================
      - name: VALIDAR RECEPÇÃO DE ÁUDIO DENTRO DO APK
        shell: bash
        run: |
          set -e

          APK="$APK_PATH"

          AAPT=$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt \
              | sort -V \
              | tail -n 1
          )

          test -n "$AAPT" || {
            echo "ERRO: aapt não encontrado."
            exit 1
          }

          echo "======================================"
          echo "MANIFEST DO APK FINAL"
          echo "======================================"

          "$AAPT" dump xmltree \
            "$APK" \
            AndroidManifest.xml \
            | tee /tmp/final-manifest.txt

          echo ""
          echo "======================================"
          echo "VALIDANDO ACTION_SEND"
          echo "======================================"

          grep -q \
            "android.intent.action.SEND" \
            /tmp/final-manifest.txt || {

            echo "ERRO CRÍTICO:"
            echo "ACTION_SEND NÃO entrou no APK final."

            exit 1
          }

          echo "OK: ACTION_SEND presente."


          echo ""
          echo "======================================"
          echo "VALIDANDO SEND_MULTIPLE"
          echo "======================================"

          grep -q \
            "android.intent.action.SEND_MULTIPLE" \
            /tmp/final-manifest.txt || {

            echo "ERRO CRÍTICO:"
            echo "SEND_MULTIPLE NÃO entrou no APK final."

            exit 1
          }

          echo "OK: SEND_MULTIPLE presente."


          echo ""
          echo "======================================"
          echo "VALIDANDO MIME AUDIO"
          echo "======================================"

          grep -q \
            "audio/\*" \
            /tmp/final-manifest.txt || {

            echo "ERRO CRÍTICO:"
            echo "audio/* NÃO entrou no APK final."

            exit 1
          }

          echo "OK: audio/* presente."


          echo ""
          echo "======================================"
          echo "VALIDAÇÃO FINAL DO COMPARTILHAMENTO"
          echo "======================================"

          echo "O APK final está registrado como receptor"
          echo "de compartilhamento de áudio."


      # ============================================================
      # 26. VALIDAR ASSINATURA
      # ============================================================
      - name: Validar assinatura do APK
        shell: bash
        run: |
          set -e

          APK="$APK_PATH"

          APKSIGNER=$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )

          test -n "$APKSIGNER" || {
            echo "ERRO: apksigner não encontrado."
            exit 1
          }

          "$APKSIGNER" verify \
            --verbose \
            "$APK"


      # ============================================================
      # 27. DISPONIBILIZAR APK
      # ============================================================
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: gestao-sacerdotista-aime-v114-audio-share
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 1


      # ============================================================
      # 28. LIMPAR KEYSTORE
      # ============================================================
      - name: Limpar arquivo temporário de assinatura
        if: always()
        shell: bash
        run: |
          rm -f \
            "$PROJECT_DIR/android/app/release-key.jks" \
            2>/dev/null || true

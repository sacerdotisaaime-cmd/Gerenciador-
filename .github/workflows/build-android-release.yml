      - name: Declarar permissões Android
        shell: bash
        run: |
          set -e
          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import sys

          manifest = Path(sys.argv[1])
          text = manifest.read_text()
          permissions = [
              "android.permission.READ_CONTACTS",
              "android.permission.WRITE_CONTACTS",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
          ]
          marker = "<application"
          if marker not in text:
              raise SystemExit("ERRO: <application> não encontrado.")
          additions = []
          for permission in permissions:
              if f'android:name="{permission}"' not in text:
                  additions.append(f'    <uses-permission android:name="{permission}" />\n')
          if additions:
              text = text.replace(marker, "".join(additions) + marker, 1)

          import re
          activity_marker = 'android:name=".MainActivity"'
          if activity_marker in text:
              activity_start = text.rfind("<activity", 0, text.find(activity_marker) + len(activity_marker))
              activity_end = text.find("</activity>", activity_start)
              if activity_start >= 0 and activity_end >= 0:
                  activity_block = text[activity_start:activity_end]
                  # O Android precisa encontrar a Activity como destino de compartilhamento.
                  # Declaramos explicitamente exported/grantUriPermissions e aceitamos tanto
                  # audio/* quanto /. O segundo filtro cobre casos em que WhatsApp/Samsung
                  # entrega o áudio como application/octet-stream ou outro MIME genérico; o
                  # plugin valida o conteúdo antes de importar.
                  activity_block = re.sub(r'\s+android:exported="[^"]"', '', activity_block)
                  activity_block = re.sub(r'\s+android:grantUriPermissions="[^"]"', '', activity_block)
                  activity_block = re.sub(r'\s+android:launchMode="[^"]"', '', activity_block)
                  activity_block = activity_block.replace(
                      '<activity',
                      '<activity android:exported="true" android:grantUriPermissions="true" android:launchMode="singleTask"',
                      1,
                  )
                  # Remove filtros de compartilhamento que possam ter sido adicionados em
                  # uma geração anterior e recria os dois filtros de forma determinística.
                  activity_block = re.sub(
                      r'\s<intent-filter>\s*<action android:name="android.intent.action.SEND" />.?</intent-filter>',
                      '', activity_block, flags=re.S,
                  )
                  activity_block = re.sub(
                      r'\s<intent-filter>\s*<action android:name="android.intent.action.SEND_MULTIPLE" />.*?</intent-filter>',
                      '', activity_block, flags=re.S,
                  )
                  intent_filter = """
                  <intent-filter>
                    <action android:name="android.intent.action.SEND" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="audio/*" />
                  </intent-filter>
                  <intent-filter>
                    <action android:name="android.intent.action.SEND_MULTIPLE" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="audio/*" />
                  </intent-filter>
                  <intent-filter>
                    <action android:name="android.intent.action.SEND" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="image/*" />
                  </intent-filter>
                  <intent-filter>
                    <action android:name="android.intent.action.SEND_MULTIPLE" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="image/*" />
                  </intent-filter>
                  <intent-filter>
                    <action android:name="android.intent.action.SEND" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="*/*" />
                  </intent-filter>
                  <intent-filter>
                    <action android:name="android.intent.action.SEND_MULTIPLE" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="*/*" />
                  </intent-filter>"""
                  activity_block = activity_block + intent_filter
                  text = text[:activity_start] + activity_block + text[activity_end:]
          manifest.write_text(text)

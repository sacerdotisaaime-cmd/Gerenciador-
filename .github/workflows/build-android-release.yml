            @PluginMethod
            public void claimInitialSync(
              PluginCall call
            ) {

              JSObject result =
                new JSObject();


              result.put(
                "claimed",
                !initialSyncClaimed
              );


              result.put(
                "sharedLaunch",
                sharedLaunch
              );


              initialSyncClaimed = true;


              call.resolve(result);

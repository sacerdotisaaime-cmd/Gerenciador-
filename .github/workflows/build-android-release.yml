name: Build Android APK - V120 - WHATSAPP AUDIO SHARE

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PROJECT_DIR: app

    steps:

      # ============================================================
      # 1. BAIXAR PROJETO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 2. NODE 22
      # ============================================================

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ============================================================
      # 3. JAVA 21
      # ============================================================

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 5. VALIDAR SECRETS
      # ============================================================

      - name: Validar secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "ERRO: secret $name está vazio ou não configurado."
              exit 1
            fi
          done

          echo "Secrets de assinatura presentes."

      # ============================================================
      # 6. ENCONTRAR ZIP
      # ============================================================

      - name: Encontrar ZIP do projeto
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t zips < <(
            find . \
              -maxdepth 3 \
              -type f \
              -iname '*.zip' \
              -not -path './.git/*' \
              | sort
          )

          if [ "${#zips[@]}" -ne 1 ]; then
            echo "ERRO: esperado exatamente 1 ZIP do projeto."
            echo "Foram encontrados: ${#zips[@]}"

            printf '%s\n' "${zips[@]}"

            exit 1
          fi

          echo "ZIP_FILE=${zips[0]}" >> "$GITHUB_ENV"

          echo "=================================================="
          echo "ZIP SELECIONADO"
          echo "=================================================="

          echo "${zips[0]}"

          ls -lh "${zips[0]}"

      # ============================================================
      # 7. DESCOMPACTAR
      # ============================================================

      - name: Descompactar projeto
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$PROJECT_DIR"

          mkdir -p "$PROJECT_DIR"

          unzip -q "$ZIP_FILE" -d "$PROJECT_DIR"

          echo "Projeto descompactado."

      # ============================================================
      # 8. LOCALIZAR RAIZ REAL
      # ============================================================

      - name: Localizar raiz do projeto
        shell: bash
        run: |
          set -euo pipefail

          package_json=$(
            find "$PROJECT_DIR" \
              -type f \
              -name package.json \
              -not -path '*/node_modules/*' \
              | head -n 1
          )

          if [ -z "$package_json" ]; then
            echo "ERRO: package.json não encontrado dentro do ZIP."
            exit 1
          fi

          project_root=$(dirname "$package_json")

          echo "PROJECT_DIR=$project_root" >> "$GITHUB_ENV"

          echo "=================================================="
          echo "RAIZ DO PROJETO"
          echo "=================================================="

          echo "$project_root"

      # ============================================================
      # 9. AJUSTAR DEPENDÊNCIAS
      # ============================================================

      - name: Ajustar dependências Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          node <<'NODE'
          const fs = require('fs');

          const file = 'package.json';

          const pkg = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          const deps =
            pkg.dependencies ||
            (pkg.dependencies = {});

          Object.assign(deps, {
            '@capacitor/core': '^7.4.3',
            '@capacitor/android': '^7.4.3',
            '@capacitor/camera': '^7.0.5',
            '@capacitor/share': '^7.0.2',
            '@capacitor/filesystem': '^7.0.2',
            '@capacitor-community/contacts': '7.2.0',
            'capacitor-voice-recorder': '7.0.6',
            '@capacitor/barcode-scanner': '2.0.4'
          });

          pkg.devDependencies =
            pkg.devDependencies ||
            {};

          pkg.devDependencies['@capacitor/cli'] =
            '7.4.3';

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + '\n'
          );

          console.log(
            'package.json atualizado.'
          );
          NODE

          rm -rf node_modules

          rm -f package-lock.json

          npm install

      # ============================================================
      # 10. BUILD WEB
      # ============================================================

      - name: Compilar aplicação web
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "COMPILANDO APLICAÇÃO WEB"
          echo "=================================================="

          if npm run | grep -qE '^  build'; then

            npm run build

          elif [ -x node_modules/.bin/vite ]; then

            npx vite build

          else

            echo "ERRO: não existe script build nem Vite instalado."

            exit 1

          fi

      # ============================================================
      # 11. PREPARAR ANDROID
      # ============================================================

      - name: Preparar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -d android ]; then

            echo "Android já existe."
            echo "A estrutura Android existente será preservada."

            npx cap sync android

          else

            echo "Android não existe."
            echo "Criando projeto Android pelo Capacitor."

            npx cap add android

            npx cap sync android

          fi

      # ============================================================
      # 12. AJUSTAR SDK E VERSÃO
      # ============================================================

      - name: Ajustar SDK e versão Android
        shell: bash
        run: |
          set -euo pipefail

          VARIABLES="$PROJECT_DIR/android/variables.gradle"

          BUILD_GRADLE="$PROJECT_DIR/android/app/build.gradle"

          test -f "$BUILD_GRADLE" || {
            echo "ERRO: app/build.gradle não encontrado."
            exit 1
          }

          # --------------------------------------------------------
          # VARIABLES.GRADLE
          # --------------------------------------------------------

          if [ -f "$VARIABLES" ]; then

            python3 - "$VARIABLES" <<'PY'
          import re
          import sys

          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )

          replacements = {
              "compileSdkVersion": "35",
              "targetSdkVersion": "35",
              "minSdkVersion": "26",
          }

          for key, value in replacements.items():

              pattern = (
                  rf"(?m)^(\s*)"
                  rf"{re.escape(key)}"
                  rf"\s*=.*$"
              )

              text, count = re.subn(
                  pattern,
                  rf"\g<1>{key} = {value}",
                  text
              )

              if count == 0:

                  text += (
                      f"\n{key} = {value}\n"
                  )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "variables.gradle atualizado."
          )
          PY

          else

            echo "variables.gradle não existe."

            echo "O SDK será configurado diretamente no build.gradle."

          fi

          # --------------------------------------------------------
          # BUILD.GRADLE
          # --------------------------------------------------------

          python3 - "$BUILD_GRADLE" <<'PY'
          import re
          import sys

          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )

          # ------------------------------------------------------
          # Só normaliza SDK direto no build.gradle quando ele
          # estiver explicitamente declarado ali.
          #
          # IMPORTANTE:
          # NÃO transforma compileSdk em compileSdk = 35()
          # e NÃO mexe em signingConfigs.
          # ------------------------------------------------------

          text = re.sub(
              r"(?m)^(\s*)"
              r"compileSdk(?:Version)?"
              r"\s*(?:=)?\s*[^\n]+$",
              r"\g<1>compileSdk 35",
              text
          )

          text = re.sub(
              r"(?m)^(\s*)"
              r"minSdk(?:Version)?"
              r"\s*(?:=)?\s*[^\n]+$",
              r"\g<1>minSdk 26",
              text
          )

          text = re.sub(
              r"(?m)^(\s*)"
              r"targetSdk(?:Version)?"
              r"\s*(?:=)?\s*[^\n]+$",
              r"\g<1>targetSdk 35",
              text
          )

          # ------------------------------------------------------
          # VERSION CODE
          # ------------------------------------------------------

          version_code_pattern = (
              r"(?m)^(\s*)"
              r"versionCode\s+[^\n]+$"
          )

          text, version_code_count = re.subn(
              version_code_pattern,
              r"\g<1>versionCode 120",
              text,
              count=1
          )

          if version_code_count == 0:

              raise SystemExit(
                  "ERRO: versionCode não encontrado."
              )

          # ------------------------------------------------------
          # VERSION NAME
          # Aceita aspas simples ou duplas.
          # ------------------------------------------------------

          version_name_pattern = (
              r"(?m)^(\s*)"
              r"versionName\s+"
              r"['\"][^'\"]+['\"]$"
          )

          text, version_name_count = re.subn(
              version_name_pattern,
              r'\g<1>versionName "1.20.0"',
              text,
              count=1
          )

          if version_name_count == 0:

              raise SystemExit(
                  "ERRO: versionName não encontrado."
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "app/build.gradle atualizado."
          )
          PY

          echo
          echo "=================================================="
          echo "VARIABLES.GRADLE"
          echo "=================================================="

          if [ -f "$VARIABLES" ]; then
            sed -n '1,180p' "$VARIABLES"
          else
            echo "Não existe."
          fi

          echo
          echo "=================================================="
          echo "APP/BUILD.GRADLE"
          echo "=================================================="

          sed -n '1,220p' "$BUILD_GRADLE"

      # ============================================================
      # 13. CRIAR PERMISSION BRIDGE
      # ============================================================

      - name: Criar PermissionBridgePlugin
        shell: bash
        run: |
          set -euo pipefail

          SRC="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao"

          mkdir -p "$SRC"

          cat > "$SRC/PermissionBridgePlugin.java" <<'JAVA'
          package com.sacerdotisaaime.gestao;

          import android.Manifest;
          import android.content.ClipData;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.OpenableColumns;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.Locale;

          @CapacitorPlugin(
              name = "PermissionBridge",
              permissions = {
                  @Permission(
                      alias = "contacts",
                      strings = {
                          Manifest.permission.READ_CONTACTS,
                          Manifest.permission.WRITE_CONTACTS
                      }
                  ),
                  @Permission(
                      alias = "microphone",
                      strings = {
                          Manifest.permission.RECORD_AUDIO
                      }
                  )
              }
          )
          public class PermissionBridgePlugin extends Plugin {

              private static final String INBOX_DIR =
                      "shared-media-inbox";

              private static final long MAX_AUDIO_BYTES =
                      50L * 1024L * 1024L;

              private static final long MAX_PHOTO_BYTES =
                      20L * 1024L * 1024L;

              private static PermissionBridgePlugin instance;

              private static Intent pendingSharedIntent;

              private static boolean initialSyncClaimed = false;

              private static boolean sharedLaunch = false;

              @Override
              public void load() {

                  super.load();

                  instance = this;

                  Intent pending =
                          pendingSharedIntent;

                  pendingSharedIntent = null;

                  if (pending != null) {

                      handleSharedIntent(
                              pending
                      );

                  } else if (getActivity() != null) {

                      handleSharedIntent(
                              getActivity().getIntent()
                      );
                  }
              }

              @Override
              protected void handleOnNewIntent(
                      Intent intent
              ) {

                  super.handleOnNewIntent(intent);

                  handleSharedIntent(
                          intent
                  );
              }

              public static void handleSharedIntent(
                      Intent intent
              ) {

                  if (intent == null) {
                      return;
                  }

                  if (instance == null) {

                      pendingSharedIntent =
                              new Intent(intent);

                      return;
                  }

                  String action =
                          intent.getAction();

                  if (!Intent.ACTION_SEND.equals(action)
                          && !Intent.ACTION_SEND_MULTIPLE.equals(action)) {

                      return;
                  }

                  ArrayList<Uri> uris =
                          new ArrayList<>();

                  ClipData clipData =
                          intent.getClipData();

                  if (clipData != null) {

                      for (
                              int i = 0;
                              i < clipData.getItemCount();
                              i++
                      ) {

                          Uri uri =
                                  clipData
                                          .getItemAt(i)
                                          .getUri();

                          if (
                                  uri != null
                                  && !uris.contains(uri)
                          ) {

                              uris.add(uri);
                          }
                      }
                  }

                  if (
                          Intent.ACTION_SEND_MULTIPLE
                                  .equals(action)
                  ) {

                      ArrayList<Uri> extras =
                              intent.getParcelableArrayListExtra(
                                      Intent.EXTRA_STREAM
                              );

                      if (extras != null) {

                          for (Uri uri : extras) {

                              if (
                                      uri != null
                                      && !uris.contains(uri)
                              ) {

                                  uris.add(uri);
                              }
                          }
                      }

                  } else {

                      Uri uri =
                              intent.getParcelableExtra(
                                      Intent.EXTRA_STREAM
                              );

                      if (
                              uri != null
                              && !uris.contains(uri)
                      ) {

                          uris.add(uri);
                      }
                  }

                  if (uris.isEmpty()) {
                      return;
                  }

                  sharedLaunch = true;

                  JSObject summary =
                          new JSObject();

                  summary.put(
                          "count",
                          uris.size()
                  );

                  summary.put(
                          "action",
                          action
                  );

                  instance.notifyListeners(
                          "sharedMediaReceived",
                          summary
                  );

                  for (Uri uri : uris) {

                      instance.storeUri(uri);
                  }
              }

              private File inboxDir() {

                  File dir =
                          new File(
                                  getContext()
                                          .getFilesDir(),
                                  INBOX_DIR
                          );

                  if (
                          !dir.exists()
                          && !dir.mkdirs()
                  ) {

                      return null;
                  }

                  return dir;
              }

              private String displayName(
                      Uri uri
              ) {

                  try {

                      Cursor cursor =
                              getContext()
                                      .getContentResolver()
                                      .query(
                                              uri,
                                              new String[]{
                                                      OpenableColumns.DISPLAY_NAME
                                              },
                                              null,
                                              null,
                                              null
                                      );

                      if (cursor != null) {

                          try {

                              if (
                                      cursor.moveToFirst()
                              ) {

                                  return cursor.getString(
                                          0
                                  );
                              }

                          } finally {

                              cursor.close();
                          }
                      }

                  } catch (Exception ignored) {
                  }

                  return "shared-media";
              }

              private String mimeType(
                      Uri uri
              ) {

                  try {

                      String mime =
                              getContext()
                                      .getContentResolver()
                                      .getType(uri);

                      return mime == null
                              ? ""
                              : mime.toLowerCase(
                                      Locale.US
                              );

                  } catch (Exception e) {

                      return "";
                  }
              }

              private boolean byteAt(
                      byte[] data,
                      int len,
                      int index,
                      int expected
              ) {

                  return index >= 0
                          && index < len
                          && (
                              data[index] & 0xff
                          ) == (
                              expected & 0xff
                          );
              }

              private boolean signature(
                      byte[] data,
                      int len,
                      int... values
              ) {

                  if (
                          len < values.length
                  ) {

                      return false;
                  }

                  for (
                          int i = 0;
                          i < values.length;
                          i++
                  ) {

                      if (
                              !byteAt(
                                      data,
                                      len,
                                      i,
                                      values[i]
                              )
                      ) {

                          return false;
                      }
                  }

                  return true;
              }

              private String sniff(
                      File file
              ) {

                  byte[] header =
                          new byte[64];

                  int len = 0;

                  try (
                          InputStream input =
                                  new FileInputStream(file)
                  ) {

                      while (
                              len < header.length
                      ) {

                          int n =
                                  input.read(
                                          header,
                                          len,
                                          header.length - len
                                  );

                          if (n < 0) {
                              break;
                          }

                          if (n > 0) {
                              len += n;
                          }
                      }

                  } catch (Exception e) {

                      return null;
                  }

                  // JPEG
                  if (
                          signature(
                                  header,
                                  len,
                                  0xff,
                                  0xd8,
                                  0xff
                          )
                  ) {

                      return "photo|image/jpeg";
                  }

                  // PNG
                  if (
                          signature(
                                  header,
                                  len,
                                  0x89,
                                  0x50,
                                  0x4e,
                                  0x47,
                                  0x0d,
                                  0x0a,
                                  0x1a,
                                  0x0a
                          )
                  ) {

                      return "photo|image/png";
                  }

                  // WEBP
                  if (
                          len >= 12
                          && signature(
                                  header,
                                  len,
                                  0x52,
                                  0x49,
                                  0x46,
                                  0x46
                          )
                          && byteAt(
                                  header,
                                  len,
                                  8,
                                  0x57
                          )
                          && byteAt(
                                  header,
                                  len,
                                  9,
                                  0x45
                          )
                          && byteAt(
                                  header,
                                  len,
                                  10,
                                  0x42
                          )
                          && byteAt(
                                  header,
                                  len,
                                  11,
                                  0x50
                          )
                  ) {

                      return "photo|image/webp";
                  }

                  // OGG / OPUS
                  if (
                          signature(
                                  header,
                                  len,
                                  0x4f,
                                  0x67,
                                  0x67,
                                  0x53
                          )
                  ) {

                      return "audio|audio/ogg";
                  }

                  // WAV
                  if (
                          len >= 12
                          && signature(
                                  header,
                                  len,
                                  0x52,
                                  0x49,
                                  0x46,
                                  0x46
                          )
                          && byteAt(
                                  header,
                                  len,
                                  8,
                                  0x57
                          )
                          && byteAt(
                                  header,
                                  len,
                                  9,
                                  0x41
                          )
                          && byteAt(
                                  header,
                                  len,
                                  10,
                                  0x56
                          )
                          && byteAt(
                                  header,
                                  len,
                                  11,
                                  0x45
                          )
                  ) {

                      return "audio|audio/wav";
                  }

                  // MP3 ID3
                  if (
                          signature(
                                  header,
                                  len,
                                  0x49,
                                  0x44,
                                  0x33
                          )
                  ) {

                      return "audio|audio/mpeg";
                  }

                  // MP3 frame sync
                  if (
                          len >= 2
                          && (
                              header[0] & 0xff
                          ) == 0xff
                          && (
                              header[1] & 0xe0
                          ) == 0xe0
                  ) {

                      return "audio|audio/mpeg";
                  }

                  // HEIC / HEIF / M4A
                  if (
                          len >= 12
                          && byteAt(
                                  header,
                                  len,
                                  4,
                                  0x66
                          )
                          && byteAt(
                                  header,
                                  len,
                                  5,
                                  0x74
                          )
                          && byteAt(
                                  header,
                                  len,
                                  6,
                                  0x79
                          )
                          && byteAt(
                                  header,
                                  len,
                                  7,
                                  0x70
                          )
                  ) {

                      String brand =
                              new String(
                                      header,
                                      8,
                                      4,
                                      StandardCharsets.US_ASCII
                              );

                      if (
                              brand.equals("heic")
                              || brand.equals("heix")
                              || brand.equals("hevc")
                              || brand.equals("hevx")
                              || brand.equals("mif1")
                              || brand.equals("msf1")
                      ) {

                          return "photo|image/heic";
                      }

                      if (
                              brand.equals("M4A ")
                              || brand.equals("M4B ")
                      ) {

                          return "audio|audio/mp4";
                      }
                  }

                  // WEBM
                  if (
                          signature(
                                  header,
                                  len,
                                  0x1a,
                                  0x45,
                                  0xdf,
                                  0xa3
                          )
                  ) {

                      return "audio|audio/webm";
                  }

                  return null;
              }

              private String extension(
                      String mime,
                      String name
              ) {

                  String lower =
                          name == null
                                  ? ""
                                  : name.toLowerCase(
                                          Locale.US
                                  );

                  int dot =
                          lower.lastIndexOf('.');

                  if (
                          dot > 0
                          && dot < lower.length() - 1
                  ) {

                      return lower.substring(
                              dot + 1
                      );
                  }

                  if (
                          mime.contains("ogg")
                  ) {

                      return "ogg";
                  }

                  if (
                          mime.contains("mpeg")
                  ) {

                      return "mp3";
                  }

                  if (
                          mime.contains("wav")
                  ) {

                      return "wav";
                  }

                  if (
                          mime.contains("webm")
                  ) {

                      return "webm";
                  }

                  if (
                          mime.contains("mp4")
                  ) {

                      return "m4a";
                  }

                  if (
                          mime.contains("png")
                  ) {

                      return "png";
                  }

                  if (
                          mime.contains("webp")
                  ) {

                      return "webp";
                  }

                  if (
                          mime.contains("heic")
                  ) {

                      return "heic";
                  }

                  if (
                          mime.contains("jpeg")
                  ) {

                      return "jpg";
                  }

                  return "bin";
              }

              private String b64(
                      String value
              ) {

                  return android.util.Base64
                          .encodeToString(
                                  (
                                      value == null
                                          ? ""
                                          : value
                                  ).getBytes(
                                      StandardCharsets.UTF_8
                                  ),
                                  android.util.Base64.URL_SAFE
                                      | android.util.Base64.NO_WRAP
                                      | android.util.Base64.NO_PADDING
                          );
              }

              private String unb64(
                      String value
              ) {

                  try {

                      return new String(
                              android.util.Base64.decode(
                                      value,
                                      android.util.Base64.URL_SAFE
                              ),
                              StandardCharsets.UTF_8
                      );

                  } catch (Exception e) {

                      return "";
                  }
              }

              private void storeUri(
                      Uri uri
              ) {

                  File dir =
                          inboxDir();

                  if (dir == null) {

                      notifyError(
                              uri,
                              "INBOX_UNAVAILABLE"
                      );

                      return;
                  }

                  String suppliedMime =
                          mimeType(uri);

                  String name =
                          displayName(uri);

                  String lowerName =
                          name.toLowerCase(
                                  Locale.US
                          );

                  boolean hintedPhoto =
                          suppliedMime.startsWith(
                                  "image/"
                          )
                          || lowerName.matches(
                                  ".*\\.(jpg|jpeg|png|webp|heic|heif)$"
                          );

                  boolean hintedAudio =
                          suppliedMime.startsWith(
                                  "audio/"
                          )
                          || lowerName.matches(
                                  ".*\\.(ogg|opus|m4a|m4b|aac|mp3|wav|amr|3gp|webm)$"
                          );

                  long limit =
                          hintedPhoto
                              && !hintedAudio
                                  ? MAX_PHOTO_BYTES
                                  : MAX_AUDIO_BYTES;

                  File temp =
                          new File(
                                  dir,
                                  ".tmp_"
                                      + System.nanoTime()
                          );

                  long total = 0;

                  try (
                          InputStream input =
                                  getContext()
                                      .getContentResolver()
                                      .openInputStream(uri);

                          FileOutputStream output =
                                  new FileOutputStream(temp)
                  ) {

                      if (input == null) {

                          throw new Exception(
                                  "STREAM_UNAVAILABLE"
                          );
                      }

                      byte[] buffer =
                              new byte[16 * 1024];

                      int n;

                      while (
                              (
                                  n = input.read(buffer)
                              ) != -1
                      ) {

                          total += n;

                          if (
                                  total > limit
                          ) {

                              throw new Exception(
                                      "MEDIA_TOO_LARGE"
                              );
                          }

                          output.write(
                                  buffer,
                                  0,
                                  n
                          );
                      }

                      output.flush();

                  } catch (Exception e) {

                      temp.delete();

                      notifyError(
                              uri,
                              e.getMessage() == null
                                  ? "RECEIVE_FAILED"
                                  : e.getMessage()
                      );

                      return;
                  }

                  String sniffed =
                          sniff(temp);

                  boolean photo =
                          hintedPhoto
                          || (
                              sniffed != null
                              && sniffed.startsWith(
                                  "photo|"
                              )
                          );

                  boolean audio =
                          hintedAudio
                          || (
                              sniffed != null
                              && sniffed.startsWith(
                                  "audio|"
                              )
                          );

                  if (
                          !photo
                          && !audio
                  ) {

                      temp.delete();

                      notifyError(
                              uri,
                              "UNRECOGNIZED_MEDIA"
                      );

                      return;
                  }

                  if (
                          photo
                          && total > MAX_PHOTO_BYTES
                  ) {

                      temp.delete();

                      notifyError(
                              uri,
                              "MEDIA_TOO_LARGE"
                      );

                      return;
                  }

                  String finalMime =
                          suppliedMime;

                  if (
                          (
                              finalMime.isEmpty()
                              || finalMime.equals("*/*")
                              || finalMime.equals(
                                  "application/octet-stream"
                              )
                          )
                          && sniffed != null
                  ) {

                      finalMime =
                              sniffed.substring(
                                      sniffed.indexOf('|')
                                          + 1
                              );
                  }

                  if (
                          finalMime.isEmpty()
                          || finalMime.equals("*/*")
                  ) {

                      finalMime =
                              photo
                                  ? "image/*"
                                  : "audio/*";
                  }

                  if (
                          name == null
                          || name.trim().isEmpty()
                  ) {

                      name =
                              (
                                  photo
                                      ? "foto-whatsapp"
                                      : "audio-whatsapp"
                              )
                              + "."
                              + extension(
                                  finalMime,
                                  name
                              );
                  }

                  String id =
                          "media-"
                              + System.currentTimeMillis()
                              + "-"
                              + Math.abs(
                                  (
                                      uri.toString()
                                      + total
                                  ).hashCode()
                              );

                  File output =
                          new File(
                                  dir,
                                  id
                                      + "__"
                                      + b64(finalMime)
                                      + "__"
                                      + b64(name)
                                      + "__"
                                      + (
                                          photo
                                              ? "photo"
                                              : "audio"
                                      )
                                      + "__1.bin"
                          );

                  if (
                          !temp.renameTo(output)
                  ) {

                      try (
                              FileInputStream input =
                                  new FileInputStream(temp);

                              FileOutputStream out =
                                  new FileOutputStream(output)
                      ) {

                          byte[] buffer =
                                  new byte[16 * 1024];

                          int n;

                          while (
                                  (
                                      n = input.read(buffer)
                                  ) != -1
                          ) {

                              out.write(
                                  buffer,
                                  0,
                                  n
                              );
                          }

                      } catch (Exception e) {

                          temp.delete();

                          output.delete();

                          notifyError(
                              uri,
                              "STORE_FAILED"
                          );

                          return;
                      }

                      temp.delete();
                  }

                  JSObject event =
                          metadata(output);

                  notifyListeners(
                          "sharedMedia",
                          event
                  );
              }

              private JSObject metadata(
                      File file
              ) {

                  String[] parts =
                          file.getName()
                              .split(
                                  "__",
                                  -1
                              );

                  JSObject object =
                          new JSObject();

                  object.put(
                          "id",
                          parts.length > 0
                              ? parts[0]
                              : file.getName()
                  );

                  object.put(
                          "mimeType",
                          parts.length > 1
                              ? unb64(parts[1])
                              : "application/octet-stream"
                  );

                  object.put(
                          "name",
                          parts.length > 2
                              ? unb64(parts[2])
                              : file.getName()
                  );

                  object.put(
                          "kind",
                          parts.length > 3
                              ? parts[3]
                              : "unknown"
                  );

                  object.put(
                          "size",
                          file.length()
                  );

                  object.put(
                          "receivedAt",
                          new SimpleDateFormat(
                                  "yyyy-MM-dd'T'HH:mm:ss.SSSXXX",
                                  Locale.US
                          ).format(
                                  new Date(
                                      file.lastModified()
                                  )
                          )
                  );

                  return object;
              }

              private File findById(
                      String id
              ) {

                  if (
                          id == null
                          || id.trim().isEmpty()
                  ) {

                      return null;
                  }

                  File dir =
                          inboxDir();

                  if (dir == null) {
                      return null;
                  }

                  File[] files =
                          dir.listFiles();

                  if (files == null) {
                      return null;
                  }

                  for (
                          File file : files
                  ) {

                      if (
                              file.getName()
                                  .startsWith(
                                      id + "__"
                                  )
                      ) {

                          return file;
                      }
                  }

                  return null;
              }

              private void notifyError(
                      Uri uri,
                      String code
              ) {

                  JSObject event =
                          new JSObject();

                  event.put(
                          "ok",
                          false
                  );

                  event.put(
                          "code",
                          code
                  );

                  event.put(
                          "uri",
                          uri == null
                              ? ""
                              : uri.toString()
                  );

                  notifyListeners(
                          "sharedMediaError",
                          event
                  );
              }

              @PluginMethod
              public void claimInitialSync(
                      PluginCall call
              ) {

                  boolean first =
                          !initialSyncClaimed;

                  initialSyncClaimed =
                          true;

                  JSObject result =
                          new JSObject();

                  result.put(
                          "firstProcess",
                          first
                  );

                  result.put(
                          "sharedLaunch",
                          sharedLaunch
                  );

                  sharedLaunch = false;

                  call.resolve(
                          result
                  );
              }

              @PluginMethod
              public void getSharedMedia(
                      PluginCall call
              ) {

                  File dir =
                          inboxDir();

                  JSArray result =
                          new JSArray();

                  if (dir != null) {

                      File[] files =
                              dir.listFiles();

                      if (files != null) {

                          for (
                                  File file : files
                          ) {

                              if (
                                      !file.isFile()
                                      || file.getName()
                                          .startsWith(
                                              ".tmp_"
                                          )
                              ) {

                                  continue;
                              }

                              result.put(
                                      metadata(file)
                              );
                          }
                      }
                  }

                  JSObject response =
                          new JSObject();

                  response.put(
                          "pending",
                          result.length() > 0
                  );

                  response.put(
                          "items",
                          result
                  );

                  // Compatibilidade com implementações
                  // anteriores da Caixa de Mídias.
                  response.put(
                          "files",
                          result
                  );

                  call.resolve(
                          response
                  );
              }

              @PluginMethod
              public void listSharedMedia(
                      PluginCall call
              ) {

                  File dir =
                          inboxDir();

                  JSArray result =
                          new JSArray();

                  if (dir != null) {

                      File[] files =
                              dir.listFiles();

                      if (files != null) {

                          for (
                                  File file : files
                          ) {

                              if (
                                      !file.isFile()
                                      || file.getName()
                                          .startsWith(
                                              ".tmp_"
                                          )
                              ) {

                                  continue;
                              }

                              result.put(
                                      metadata(file)
                              );
                          }
                      }
                  }

                  JSObject response =
                          new JSObject();

                  response.put(
                          "items",
                          result
                  );

                  response.put(
                          "files",
                          result
                  );

                  call.resolve(
                          response
                  );
              }

              @PluginMethod
              public void readSharedMedia(
                      PluginCall call
              ) {

                  String id =
                          call.getString(
                                  "id",
                                  ""
                          );

                  File file =
                          findById(id);

                  if (
                          file == null
                          || !file.exists()
                  ) {

                      JSObject result =
                              new JSObject();

                      result.put(
                              "ok",
                              false
                      );

                      call.resolve(
                              result
                      );

                      return;
                  }

                  try {

                      ByteArrayOutputStream output =
                              new ByteArrayOutputStream();

                      try (
                              InputStream input =
                                      new FileInputStream(file)
                      ) {

                          byte[] buffer =
                                  new byte[8192];

                          int read;

                          while (
                                  (
                                      read =
                                          input.read(buffer)
                                  ) != -1
                          ) {

                              output.write(
                                      buffer,
                                      0,
                                      read
                              );
                          }
                      }

                      JSObject result =
                              metadata(file);

                      result.put(
                              "ok",
                              true
                      );

                      result.put(
                              "path",
                              file.getAbsolutePath()
                      );

                      String mime =
                              result.getString(
                                      "mimeType",
                                      "application/octet-stream"
                              );

                      result.put(
                              "data",
                              "data:"
                                  + mime
                                  + ";base64,"
                                  + android.util.Base64
                                      .encodeToString(
                                          output.toByteArray(),
                                          android.util.Base64.NO_WRAP
                                      )
                      );

                      call.resolve(
                              result
                      );

                  } catch (Exception e) {

                      call.reject(
                              "SHARED_MEDIA_READ_ERROR",
                              e.getMessage() == null
                                  ? "READ_FAILED"
                                  : e.getMessage()
                      );
                  }
              }

              @PluginMethod
              public void deleteSharedMedia(
                      PluginCall call
              ) {

                  String id =
                          call.getString(
                                  "id",
                                  ""
                          );

                  File file =
                          findById(id);

                  JSObject result =
                          new JSObject();

                  result.put(
                          "ok",
                          file == null
                              || file.delete()
                  );

                  call.resolve(
                          result
                  );
              }

              @PluginMethod
              public void requestContacts(
                      PluginCall call
              ) {

                  if (
                          getPermissionState(
                                  "contacts"
                          ) == PermissionState.GRANTED
                  ) {

                      JSObject result =
                              new JSObject();

                      result.put(
                              "granted",
                              true
                      );

                      result.put(
                              "state",
                              "granted"
                      );

                      call.resolve(
                              result
                      );

                      return;
                  }

                  requestPermissionForAlias(
                          "contacts",
                          call,
                          "contactsPermissionResult"
                  );
              }

              @PermissionCallback
              private void contactsPermissionResult(
                      PluginCall call
              ) {

                  boolean granted =
                          getPermissionState(
                                  "contacts"
                          ) == PermissionState.GRANTED;

                  JSObject result =
                          new JSObject();

                  result.put(
                          "granted",
                          granted
                  );

                  result.put(
                          "state",
                          granted
                              ? "granted"
                              : "denied"
                  );

                  call.resolve(
                          result
                  );
              }


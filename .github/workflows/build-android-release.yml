name: Build Android APK - V120 - WHATSAPP AUDIO SHARE

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # NODE
      # IMPORTANTE:
      # NÃO usar cache:npm aqui.
      # O package-lock fica dentro do ZIP.
      # ============================================================

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ============================================================
      # ANDROID
      # ============================================================

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # SECRETS
      # ============================================================

      - name: Validar secrets de assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERRO: ANDROID_KEYSTORE_BASE64 vazio"
            exit 1
          }

          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "ERRO: ANDROID_KEYSTORE_PASSWORD vazio"
            exit 1
          }

          test -n "$ANDROID_KEY_ALIAS" || {
            echo "ERRO: ANDROID_KEY_ALIAS vazio"
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "ERRO: ANDROID_KEY_PASSWORD vazio"
            exit 1
          }

          echo "Secrets OK."

      # ============================================================
      # ENCONTRAR ZIP
      # ============================================================

      - name: Encontrar ZIP do projeto
        shell: bash
        run: |
          set -e

          mapfile -t ZIPS < <(
            find . \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERRO: nenhum ZIP encontrado."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "ERRO: mais de um ZIP encontrado:"
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "ZIP_FILE=${ZIPS[0]}" >> "$GITHUB_ENV"

          echo "ZIP:"
          echo "${ZIPS[0]}"

      # ============================================================
      # DESCOMPACTAR
      # ============================================================

      - name: Descompactar projeto
        shell: bash
        run: |
          set -e

          rm -rf app

          mkdir -p app

          unzip -q "$ZIP_FILE" -d app

      # ============================================================
      # ENCONTRAR PROJETO
      # ============================================================

      - name: Localizar projeto
        shell: bash
        run: |
          set -e

          PROJECT_PACKAGE=$(
            find app \
              -name package.json \
              -not -path "*/node_modules/*" \
              -print \
              | head -n 1
          )

          if [ -z "$PROJECT_PACKAGE" ]; then
            echo "ERRO: package.json não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_PACKAGE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto:"
          echo "$PROJECT_DIR"

      # ============================================================
      # DEPENDÊNCIAS
      # ============================================================

      - name: Ajustar dependências
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          node <<'NODE'
          const fs = require('fs');

          const file = 'package.json';

          const pkg = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          const deps =
            pkg.dependencies ||
            (pkg.dependencies = {});

          deps['@capacitor/core'] = '^7.4.3';
          deps['@capacitor/android'] = '^7.4.3';
          deps['@capacitor/camera'] = '^7.0.5';
          deps['@capacitor/share'] = '^7.0.2';
          deps['@capacitor/filesystem'] = '^7.0.2';
          deps['@capacitor-community/contacts'] = '7.2.0';
          deps['capacitor-voice-recorder'] = '7.0.6';
          deps['@capacitor/barcode-scanner'] = '2.0.4';

          pkg.devDependencies =
            pkg.devDependencies ||
            {};

          pkg.devDependencies['@capacitor/cli'] =
            '7.4.3';

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + '\n'
          );
          NODE

          rm -rf node_modules

          npm install

      # ============================================================
      # BUILD WEB
      # ============================================================

      - name: Compilar aplicação web
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if npm run | grep -qE '^  build'; then
            npm run build
          else
            npx vite build
          fi

      # ============================================================
      # ANDROID
      # ============================================================

      - name: Adicionar Android
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap add android

      # ============================================================
      # SDK MÍNIMO
      # ============================================================

      - name: Ajustar SDK mínimo
        shell: bash
        run: |
          set -e

          VARIABLES="$PROJECT_DIR/android/variables.gradle"

          if [ -f "$VARIABLES" ]; then

            sed -i \
              's/minSdkVersion = [0-9]*/minSdkVersion = 26/' \
              "$VARIABLES"

          fi

      # ============================================================
      # SINCRONIZAR CAPACITOR
      # ============================================================

      - name: Sincronizar Capacitor
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap sync android

      # ============================================================
      # PERMISSION BRIDGE
      # ============================================================

      - name: Criar PermissionBridge
        shell: bash
        run: |
          set -e

          SRC="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao"

          mkdir -p "$SRC"

          cat > "$SRC/PermissionBridgePlugin.java" <<'JAVA'
          package com.sacerdotisaaime.gestao;

          import android.Manifest;
          import android.content.ClipData;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.OpenableColumns;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.Locale;

          @CapacitorPlugin(
              name = "PermissionBridge",
              permissions = {
                  @Permission(
                      alias = "contacts",
                      strings = {
                          Manifest.permission.READ_CONTACTS,
                          Manifest.permission.WRITE_CONTACTS
                      }
                  ),
                  @Permission(
                      alias = "microphone",
                      strings = {
                          Manifest.permission.RECORD_AUDIO
                      }
                  )
              }
          )
          public class PermissionBridgePlugin extends Plugin {

              private static PermissionBridgePlugin instance;

              private static Intent pendingSharedIntent;

              private static boolean initialSyncClaimed = false;

              private static boolean sharedLaunch = false;

              private static final String INBOX_DIR =
                      "shared-media-inbox";

              private static final long MAX_AUDIO_BYTES =
                      50L * 1024L * 1024L;

              private static final long MAX_PHOTO_BYTES =
                      20L * 1024L * 1024L;

              @Override
              public void load() {

                  super.load();

                  instance = this;

                  Intent pending =
                          pendingSharedIntent;

                  pendingSharedIntent = null;

                  if (pending != null) {

                      handleSharedIntent(pending);

                  } else if (getActivity() != null) {

                      handleSharedIntent(
                          getActivity().getIntent()
                      );
                  }
              }

              private File inboxDir() {

                  File dir =
                      new File(
                          getContext().getFilesDir(),
                          INBOX_DIR
                      );

                  if (!dir.exists()) {
                      dir.mkdirs();
                  }

                  return dir;
              }

              private String mimeType(Uri uri) {

                  try {

                      String mime =
                          getContext()
                              .getContentResolver()
                              .getType(uri);

                      return mime == null
                          ? ""
                          : mime.toLowerCase(
                              Locale.US
                          );

                  } catch (Exception e) {

                      return "";
                  }
              }

              private String displayName(Uri uri) {

                  try {

                      Cursor cursor =
                          getContext()
                              .getContentResolver()
                              .query(
                                  uri,
                                  new String[]{
                                      OpenableColumns.DISPLAY_NAME
                                  },
                                  null,
                                  null,
                                  null
                              );

                      if (cursor != null) {

                          try {

                              if (cursor.moveToFirst()) {

                                  return cursor.getString(0);
                              }

                          } finally {

                              cursor.close();
                          }
                      }

                  } catch (Exception ignored) {
                  }

                  return "audio-whatsapp";
              }

              private String b64(String value) {

                  return android.util.Base64
                      .encodeToString(
                          (
                              value == null
                                  ? ""
                                  : value
                          ).getBytes(
                              StandardCharsets.UTF_8
                          ),
                          android.util.Base64.URL_SAFE
                              | android.util.Base64.NO_WRAP
                              | android.util.Base64.NO_PADDING
                      );
              }

              private String unb64(String value) {

                  try {

                      return new String(
                          android.util.Base64.decode(
                              value,
                              android.util.Base64.URL_SAFE
                          ),
                          StandardCharsets.UTF_8
                      );

                  } catch (Exception e) {

                      return "";
                  }
              }

              private boolean byteAt(
                  byte[] data,
                  int length,
                  int index,
                  int expected
              ) {

                  if (
                      index < 0 ||
                      index >= length
                  ) {

                      return false;
                  }

                  return (
                      data[index] & 0xff
                  ) == (
                      expected & 0xff
                  );
              }

              private boolean signature(
                  byte[] data,
                  int length,
                  int... values
              ) {

                  if (
                      length < values.length
                  ) {

                      return false;
                  }

                  for (
                      int i = 0;
                      i < values.length;
                      i++
                  ) {

                      if (
                          !byteAt(
                              data,
                              length,
                              i,
                              values[i]
                          )
                      ) {

                          return false;
                      }
                  }

                  return true;
              }

              private String sniff(File file) {

                  byte[] h =
                      new byte[64];

                  int length = 0;

                  try (
                      InputStream input =
                          new FileInputStream(file)
                  ) {

                      while (
                          length < h.length
                      ) {

                          int n =
                              input.read(
                                  h,
                                  length,
                                  h.length - length
                              );

                          if (n < 0) {
                              break;
                          }

                          if (n > 0) {
                              length += n;
                          }
                      }

                  } catch (Exception e) {

                      return null;
                  }

                  // JPEG
                  if (
                      signature(
                          h,
                          length,
                          0xff,
                          0xd8,
                          0xff
                      )
                  ) {

                      return "photo|image/jpeg";
                  }

                  // PNG
                  if (
                      signature(
                          h,
                          length,
                          0x89,
                          0x50,
                          0x4e,
                          0x47,
                          0x0d,
                          0x0a,
                          0x1a,
                          0x0a
                      )
                  ) {

                      return "photo|image/png";
                  }

                  // WEBP
                  if (
                      length >= 12 &&
                      signature(
                          h,
                          length,
                          0x52,
                          0x49,
                          0x46,
                          0x46
                      ) &&
                      byteAt(h,length,8,0x57) &&
                      byteAt(h,length,9,0x45) &&
                      byteAt(h,length,10,0x42) &&
                      byteAt(h,length,11,0x50)
                  ) {

                      return "photo|image/webp";
                  }

                  // OGG / OPUS
                  if (
                      signature(
                          h,
                          length,
                          0x4f,
                          0x67,
                          0x67,
                          0x53
                      )
                  ) {

                      return "audio|audio/ogg";
                  }

                  // WAV
                  if (
                      length >= 12 &&
                      signature(
                          h,
                          length,
                          0x52,
                          0x49,
                          0x46,
                          0x46
                      ) &&
                      byteAt(h,length,8,0x57) &&
                      byteAt(h,length,9,0x41) &&
                      byteAt(h,length,10,0x56) &&
                      byteAt(h,length,11,0x45)
                  ) {

                      return "audio|audio/wav";
                  }

                  // MP3 ID3
                  if (
                      signature(
                          h,
                          length,
                          0x49,
                          0x44,
                          0x33
                      )
                  ) {

                      return "audio|audio/mpeg";
                  }

                  // MP3 frame
                  if (
                      length >= 2 &&
                      (h[0] & 0xff) == 0xff &&
                      (h[1] & 0xe0) == 0xe0
                  ) {

                      return "audio|audio/mpeg";
                  }

                  // M4A / HEIC
                  if (
                      length >= 12 &&
                      byteAt(h,length,4,0x66) &&
                      byteAt(h,length,5,0x74) &&
                      byteAt(h,length,6,0x79) &&
                      byteAt(h,length,7,0x70)
                  ) {

                      String brand =
                          new String(
                              h,
                              8,
                              4,
                              StandardCharsets.US_ASCII
                          );

                      if (
                          brand.equals("M4A ") ||
                          brand.equals("M4B ")
                      ) {

                          return "audio|audio/mp4";
                      }

                      if (
                          brand.equals("heic") ||
                          brand.equals("heix") ||
                          brand.equals("hevc") ||
                          brand.equals("hevx") ||
                          brand.equals("mif1") ||
                          brand.equals("msf1")
                      ) {

                          return "photo|image/heic";
                      }
                  }

                  // WEBM
                  if (
                      signature(
                          h,
                          length,
                          0x1a,
                          0x45,
                          0xdf,
                          0xa3
                      )
                  ) {

                      return "audio|audio/webm";
                  }

                  return null;
              }

              private String extension(
                  String mime
              ) {

                  if (mime.contains("ogg")) {
                      return "ogg";
                  }

                  if (mime.contains("mpeg")) {
                      return "mp3";
                  }

                  if (mime.contains("wav")) {
                      return "wav";
                  }

                  if (mime.contains("webm")) {
                      return "webm";
                  }

                  if (mime.contains("mp4")) {
                      return "m4a";
                  }

                  if (mime.contains("png")) {
                      return "png";
                  }

                  if (mime.contains("webp")) {
                      return "webp";
                  }

                  if (mime.contains("heic")) {
                      return "heic";
                  }

                  return "bin";
              }

              private void storeUri(Uri uri) {

                  if (uri == null) {
                      return;
                  }

                  String suppliedMime =
                      mimeType(uri);

                  String name =
                      displayName(uri);

                  String lowerName =
                      name.toLowerCase(
                          Locale.US
                      );

                  boolean audio =
                      suppliedMime.startsWith("audio/")
                      ||
                      lowerName.matches(
                          ".*\\.(ogg|opus|m4a|m4b|aac|mp3|wav|amr|3gp|webm|mp4)$"
                      );

                  boolean photo =
                      suppliedMime.startsWith("image/")
                      ||
                      lowerName.matches(
                          ".*\\.(jpg|jpeg|png|webp|heic|heif)$"
                      );

                  long max =
                      photo && !audio
                          ? MAX_PHOTO_BYTES
                          : MAX_AUDIO_BYTES;

                  File temp =
                      new File(
                          inboxDir(),
                          ".tmp_"
                              + System.nanoTime()
                      );

                  long total = 0;

                  try (
                      InputStream input =
                          getContext()
                              .getContentResolver()
                              .openInputStream(uri);

                      FileOutputStream output =
                          new FileOutputStream(temp)
                  ) {

                      if (input == null) {

                          throw new Exception(
                              "STREAM_UNAVAILABLE"
                          );
                      }

                      byte[] buffer =
                          new byte[8192];

                      int read;

                      while (
                          (read =
                              input.read(buffer)) != -1
                      ) {

                          total += read;

                          if (total > max) {

                              throw new Exception(
                                  "MEDIA_TOO_LARGE"
                              );
                          }

                          output.write(
                              buffer,
                              0,
                              read
                          );
                      }

                      output.flush();

                  } catch (Exception e) {

                      temp.delete();

                      notifyError(
                          uri,
                          e.getMessage()
                      );

                      return;
                  }

                  String detected =
                      sniff(temp);

                  if (
                      detected != null
                  ) {

                      String[] parts =
                          detected.split(
                              "\\|",
                              2
                          );

                      if (parts.length == 2) {

                          if (
                              suppliedMime.isEmpty() ||
                              suppliedMime.equals("*/*") ||
                              suppliedMime.equals(
                                  "application/octet-stream"
                              )
                          ) {

                              suppliedMime =
                                  parts[1];
                          }

                          if (
                              parts[0].equals("audio")
                          ) {

                              audio = true;

                          } else {

                              photo = true;
                          }
                      }
                  }

                  if (
                      !audio &&
                      !photo
                  ) {

                      temp.delete();

                      notifyError(
                          uri,
                          "UNRECOGNIZED_MEDIA"
                      );

                      return;
                  }

                  if (
                      photo &&
                      total > MAX_PHOTO_BYTES
                  ) {

                      temp.delete();

                      notifyError(
                          uri,
                          "MEDIA_TOO_LARGE"
                      );

                      return;
                  }

                  if (
                      suppliedMime.isEmpty() ||
                      suppliedMime.equals("*/*")
                  ) {

                      suppliedMime =
                          audio
                              ? "audio/*"
                              : "image/*";
                  }

                  if (
                      name == null ||
                      name.trim().isEmpty()
                  ) {

                      name =
                          audio
                              ? "audio-whatsapp."
                                  + extension(
                                      suppliedMime
                                  )
                              : "foto-whatsapp."
                                  + extension(
                                      suppliedMime
                                  );
                  }

                  String id =
                      "media-"
                      + System.currentTimeMillis()
                      + "-"
                      + Math.abs(
                          (
                              uri.toString()
                              + total
                          ).hashCode()
                      );

                  File output =
                      new File(
                          inboxDir(),
                          id
                          + "__"
                          + b64(suppliedMime)
                          + "__"
                          + b64(name)
                          + "__"
                          + (
                              audio
                                  ? "audio"
                                  : "photo"
                          )
                          + "__1.bin"
                      );

                  if (
                      !temp.renameTo(output)
                  ) {

                      try (
                          FileInputStream input =
                              new FileInputStream(temp);

                          FileOutputStream out =
                              new FileOutputStream(output)
                      ) {

                          byte[] buffer =
                              new byte[8192];

                          int n;

                          while (
                              (n =
                                  input.read(buffer)) != -1
                          ) {

                              out.write(
                                  buffer,
                                  0,
                                  n
                              );
                          }

                      } catch (Exception e) {

                          output.delete();
                          temp.delete();

                          notifyError(
                              uri,
                              "STORE_FAILED"
                          );

                          return;
                      }

                      temp.delete();
                  }

                  JSObject event =
                      metadata(output);

                  notifyListeners(
                      "sharedMedia",
                      event
                  );
              }

              private void notifyError(
                  Uri uri,
                  String code
              ) {

                  JSObject event =
                      new JSObject();

                  event.put(
                      "ok",
                      false
                  );

                  event.put(
                      "code",
                      code == null
                          ? "RECEIVE_FAILED"
                          : code
                  );

                  event.put(
                      "uri",
                      uri == null
                          ? ""
                          : uri.toString()
                  );

                  notifyListeners(
                      "sharedMediaError",
                      event
                  );
              }

              private JSObject metadata(
                  File file
              ) {

                  String[] parts =
                      file.getName()
                          .split(
                              "__",
                              -1
                          );

                  JSObject result =
                      new JSObject();

                  if (
                      parts.length >= 5
                  ) {

                      result.put(
                          "id",
                          parts[0]
                      );

                      result.put(
                          "mimeType",
                          unb64(parts[1])
                      );

                      result.put(
                          "name",
                          unb64(parts[2])
                      );

                      result.put(
                          "kind",
                          parts[3]
                      );
                  }

                  result.put(
                      "size",
                      file.length()
                  );

                  result.put(
                      "receivedAt",
                      new SimpleDateFormat(
                          "yyyy-MM-dd'T'HH:mm:ss.SSSXXX",
                          Locale.US
                      ).format(
                          new Date(
                              file.lastModified()
                          )
                      )
                  );

                  return result;
              }

              private File findById(
                  String id
              ) {

                  if (
                      id == null ||
                      id.trim().isEmpty()
                  ) {

                      return null;
                  }

                  File[] files =
                      inboxDir().listFiles();

                  if (files == null) {
                      return null;
                  }

                  for (
                      File file : files
                  ) {

                      if (
                          file.getName()
                              .startsWith(
                                  id + "__"
                              )
                      ) {

                          return file;
                      }
                  }

                  return null;
              }

              // ==================================================
              // RECEBIMENTO DO WHATSAPP
              // ==================================================

              public static void handleSharedIntent(
                  Intent intent
              ) {

                  if (intent == null) {
                      return;
                  }

                  if (
                      instance == null
                  ) {

                      pendingSharedIntent =
                          new Intent(intent);

                      return;
                  }

                  String action =
                      intent.getAction();

                  if (
                      !Intent.ACTION_SEND.equals(action) &&
                      !Intent.ACTION_SEND_MULTIPLE.equals(action)
                  ) {

                      return;
                  }

                  ArrayList<Uri> uris =
                      new ArrayList<>();

                  ClipData clip =
                      intent.getClipData();

                  if (clip != null) {

                      for (
                          int i = 0;
                          i < clip.getItemCount();
                          i++
                      ) {

                          Uri uri =
                              clip.getItemAt(i).getUri();

                          if (
                              uri != null &&
                              !uris.contains(uri)
                          ) {

                              uris.add(uri);
                          }
                      }
                  }

                  if (
                      Intent.ACTION_SEND_MULTIPLE
                          .equals(action)
                  ) {

                      ArrayList<Uri> extra =
                          intent.getParcelableArrayListExtra(
                              Intent.EXTRA_STREAM
                          );

                      if (extra != null) {

                          for (
                              Uri uri : extra
                          ) {

                              if (
                                  uri != null &&
                                  !uris.contains(uri)
                              ) {

                                  uris.add(uri);
                              }
                          }
                      }

                  } else {

                      Uri uri = null;

                      try {

                          uri =
                              intent.getParcelableExtra(
                                  Intent.EXTRA_STREAM
                              );

                      } catch (Exception ignored) {
                      }

                      if (
                          uri != null &&
                          !uris.contains(uri)
                      ) {

                          uris.add(uri);
                      }
                  }

                  if (uris.isEmpty()) {
                      return;
                  }

                  sharedLaunch = true;

                  for (
                      Uri uri : uris
                  ) {

                      instance.storeUri(uri);
                  }
              }

              @PluginMethod
              public void claimInitialSync(
                  PluginCall call
              ) {

                  boolean first =
                      !initialSyncClaimed;

                  initialSyncClaimed = true;

                  JSObject result =
                      new JSObject();

                  result.put(
                      "firstProcess",
                      first
                  );

                  result.put(
                      "sharedLaunch",
                      sharedLaunch
                  );

                  sharedLaunch = false;

                  call.resolve(result);
              }

              @PluginMethod
              public void getSharedMedia(
                  PluginCall call
              ) {

                  File[] files =
                      inboxDir().listFiles();

                  JSArray items =
                      new JSArray();

                  if (files != null) {

                      for (
                          File file : files
                      ) {

                          if (
                              file.isFile() &&
                              !file.getName()
                                  .startsWith(".tmp_")
                          ) {

                              items.put(
                                  metadata(file)
                              );
                          }
                      }
                  }

                  JSObject result =
                      new JSObject();

                  result.put(
                      "pending",
                      items.length() > 0
                  );

                  result.put(
                      "items",
                      items
                  );

                  result.put(
                      "files",
                      items
                  );

                  call.resolve(result);
              }

              @PluginMethod
              public void listSharedMedia(
                  PluginCall call
              ) {

                  getSharedMedia(call);
              }

              @PluginMethod
              public void readSharedMedia(
                  PluginCall call
              ) {

                  String id =
                      call.getString(
                          "id",
                          ""
                      );

                  File file =
                      findById(id);

                  if (
                      file == null ||
                      !file.exists()
                  ) {

                      call.reject(
                          "NOT_FOUND",
                          "Mídia não encontrada."
                      );

                      return;
                  }

                  try {

                      ByteArrayOutputStream output =
                          new ByteArrayOutputStream();

                      try (
                          InputStream input =
                              new FileInputStream(file)
                      ) {

                          byte[] buffer =
                              new byte[8192];

                          int n;

                          while (
                              (n =
                                  input.read(buffer)) != -1
                          ) {

                              output.write(
                                  buffer,
                                  0,
                                  n
                              );
                          }
                      }

                      JSObject result =
                          metadata(file);

                      String mime =
                          result.getString(
                              "mimeType",
                              "application/octet-stream"
                          );

                      result.put(
                          "path",
                          file.getAbsolutePath()
                      );

                      result.put(
                          "data",
                          "data:"
                          + mime
                          + ";base64,"
                          + android.util.Base64
                              .encodeToString(
                                  output.toByteArray(),
                                  android.util.Base64.NO_WRAP
                              )
                      );

                      result.put(
                          "ok",
                          true
                      );

                      call.resolve(result);

                  } catch (Exception e) {

                      call.reject(
                          "READ_FAILED",
                          e.getMessage()
                      );
                  }
              }

              @PluginMethod
              public void deleteSharedMedia(
                  PluginCall call
              ) {

                  String id =
                      call.getString(
                          "id",
                          ""
                      );

                  File file =
                      findById(id);

                  JSObject result =
                      new JSObject();

                  result.put(
                      "ok",
                      file == null ||
                      file.delete()
                  );

                  call.resolve(result);
              }

              @PluginMethod
              public void requestContacts(
                  PluginCall call
              ) {

                  if (
                      getPermissionState(
                          "contacts"
                      ) == PermissionState.GRANTED
                  ) {

                      JSObject result =
                          new JSObject();

                      result.put(
                          "granted",
                          true
                      );

                      result.put(
                          "state",
                          "granted"
                      );

                      call.resolve(result);

                      return;
                  }

                  requestPermissionForAlias(
                      "contacts",
                      call,
                      "contactsPermissionResult"
                  );
              }


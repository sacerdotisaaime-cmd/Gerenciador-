      # ============================================================
      # KEYSTORE
      # ============================================================

      - name: Preparar keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          KEYSTORE="$PROJECT_DIR/android/app/release-key.jks"

          printf '%s' \
            "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE"

          test -s "$KEYSTORE"

          chmod 600 "$KEYSTORE"

      # ============================================================
      # VERSÃO
      # ============================================================

      - name: Ajustar versão V120
        shell: bash
        run: |
          set -e

          GRADLE="$PROJECT_DIR/android/app/build.gradle"

          test -f "$GRADLE"

          python3 - "$GRADLE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )

          text, count_code = re.subn(
              r'(?m)^(\s*)versionCode\s+\d+',
              r'\g<1>versionCode 120',
              text,
              count=1
          )

          text, count_name = re.subn(
              r'(?m)^(\s*)versionName\s+["\'][^"\']+["\']',
              r'\g<1>versionName "1.20.0"',
              text,
              count=1
          )

          if count_code == 0:

              raise SystemExit(
                  "ERRO: versionCode não encontrado."
              )

          if count_name == 0:

              raise SystemExit(
                  "ERRO: versionName não encontrado."
              )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Gerar APK Release
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          echo "=================================================="
          echo "EXECUTANDO GRADLE"
          echo "=================================================="

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # APK
      # ============================================================

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then

            echo "ERRO: APK não encontrado."

            find \
              "$PROJECT_DIR/android" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/app-release.apk"

          echo "APK encontrado."

          ls -lh \
            "$GITHUB_WORKSPACE/app-release.apk"

      # ============================================================
      # ASSINAR
      # ============================================================

      - name: Assinar APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          APKSIGNER=$(
            find "$ANDROID_HOME/build-tools" \
              -name apksigner \
              -type f \
              | sort -V \
              | tail -n 1
          )

          ZIPALIGN=$(
            find "$ANDROID_HOME/build-tools" \
              -name zipalign \
              -type f \
              | sort -V \
              | tail -n 1
          )

          test -x "$APKSIGNER"

          test -x "$ZIPALIGN"

          "$ZIPALIGN" \
            -f \
            4 \
            "$GITHUB_WORKSPACE/app-release.apk" \
            "$GITHUB_WORKSPACE/app-release-aligned.apk"

          "$APKSIGNER" sign \
            --ks "$PROJECT_DIR/android/app/release-key.jks" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/app-release-signed.apk" \
            "$GITHUB_WORKSPACE/app-release-aligned.apk"

          mv \
            "$GITHUB_WORKSPACE/app-release-signed.apk" \
            "$GITHUB_WORKSPACE/app-release.apk"

          "$APKSIGNER" verify \
            "$GITHUB_WORKSPACE/app-release.apk"

          echo "APK assinado e validado."

      # ============================================================
      # ARTEFATO
      # ============================================================

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-Sacerdotista-Aime-V120
          path: app-release.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # LIMPEZA
      # ============================================================

      - name: Limpar keystore
        if: always()
        shell: bash
        run: |
          rm -f \
            "$PROJECT_DIR/android/app/release-key.jks" \
            app-release-aligned.apk \
            2>/dev/null || true

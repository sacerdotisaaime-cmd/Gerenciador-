            private JSONObject uploadResumable(String token,Uri uri,String fileName,String parentId,String description) throws Exception {
              long length=uriLength(uri);
              String initUrl="https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,size,md5Checksum,createdTime,parents";
              JSONObject meta=new JSONObject();meta.put("name",fileName);meta.put("mimeType","application/zip");if(description!=null&&!description.isEmpty())meta.put("description",description);JSONArray parents=new JSONArray();parents.put(parentId);meta.put("parents",parents);
              HttpURLConnection init=(HttpURLConnection)new URL(initUrl).openConnection();init.setRequestMethod("POST");init.setDoOutput(true);init.setConnectTimeout(30000);init.setReadTimeout(120000);init.setRequestProperty("Authorization","Bearer "+token);init.setRequestProperty("Content-Type","application/json; charset=UTF-8");init.setRequestProperty("X-Upload-Content-Type","application/zip");init.setRequestProperty("X-Upload-Content-Length",String.valueOf(length));byte[] metaBytes=meta.toString().getBytes(StandardCharsets.UTF_8);init.setFixedLengthStreamingMode(metaBytes.length);try(OutputStream out=init.getOutputStream()){out.write(metaBytes);}int initCode=init.getResponseCode();String session=init.getHeaderField("Location");if(initCode<200||initCode>=300||session==null)throw new IllegalStateException("Não foi possível iniciar o upload retomável do Drive (HTTP "+initCode+").");
              final int chunkSize=4*1024*1024;long offset=0;try(InputStream input=openUriInputStream(uri)){byte[] buffer=new byte[chunkSize];int read;while((read=readChunk(input,buffer))>0){long end=offset+read-1;HttpURLConnection put=(HttpURLConnection)new URL(session).openConnection();put.setRequestMethod("PUT");put.setDoOutput(true);put.setConnectTimeout(30000);put.setReadTimeout(180000);put.setRequestProperty("Content-Length",String.valueOf(read));put.setRequestProperty("Content-Range","bytes "+offset+"-"+end+"/"+length);put.setFixedLengthStreamingMode(read);try(OutputStream out=put.getOutputStream()){out.write(buffer,0,read);}int code=put.getResponseCode();if(code==308){String range=put.getHeaderField("Range");if(range!=null&&range.contains("-")){String tail=range.substring(range.lastIndexOf('-')+1);offset=Long.parseLong(tail)+1;}else offset=end+1;}else if(code==200||code==201){InputStream done=put.getInputStream();ByteArrayOutputStream out=new ByteArrayOutputStream();if(done!=null){byte[] b=new byte[8192];int n;while((n=done.read(b))!=-1)out.write(b,0,n);done.close();}return new JSONObject(out.toString(StandardCharsets.UTF_8.name()));}else{InputStream err=put.getErrorStream();ByteArrayOutputStream out=new ByteArrayOutputStream();if(err!=null){byte[] b=new byte[8192];int n;while((n=err.read(b))!=-1)out.write(b,0,n);}throw new IllegalStateException("Falha no upload do Drive (HTTP "+code+"): "+out.toString(StandardCharsets.UTF_8.name()));}}}throw new IllegalStateException("Upload do Drive terminou sem confirmação.");

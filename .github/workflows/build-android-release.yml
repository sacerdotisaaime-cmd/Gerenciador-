      - name: Declarar permissões Android
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import re
          import sys

          manifest = Path(sys.argv[1])
          text = manifest.read_text()

          permissions = [
              "android.permission.READ_CONTACTS",
              "android.permission.WRITE_CONTACTS",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
          ]

          if "<application" not in text:
              raise SystemExit(
                  "ERRO: <application> não encontrado."
              )

          additions = []

          for permission in permissions:
              if f'android:name="{permission}"' not in text:
                  additions.append(
                      f'    <uses-permission android:name="{permission}" />\n'
                  )

          if additions:
              text = text.replace(
                  "<application",
                  "".join(additions) + "<application",
                  1
              )

          activity_marker = 'android:name=".MainActivity"'
          marker_pos = text.find(activity_marker)

          if marker_pos >= 0:

              activity_start = text.rfind(
                  "<activity",
                  0,
                  marker_pos
              )

              activity_end = text.find(
                  "</activity>",
                  activity_start
              )

              if (
                  activity_start >= 0 and
                  activity_end >= 0
              ):

                  activity_block = text[
                      activity_start:
                      activity_end
                  ]

                  activity_block = re.sub(
                      r'\s+android:exported="[^"]*"',
                      '',
                      activity_block
                  )

                  activity_block = re.sub(
                      r'\s+android:grantUriPermissions="[^"]*"',
                      '',
                      activity_block
                  )

                  activity_block = re.sub(
                      r'\s+android:launchMode="[^"]*"',
                      '',
                      activity_block
                  )

                  activity_block = activity_block.replace(
                      '<activity',
                      '<activity android:exported="true" android:grantUriPermissions="true" android:launchMode="singleTask"',
                      1
                  )

                  activity_block = re.sub(
                      r'\s*<intent-filter>\s*<action android:name="android.intent.action.SEND" />.*?</intent-filter>',
                      '',
                      activity_block,
                      flags=re.S
                  )

                  activity_block = re.sub(
                      r'\s*<intent-filter>\s*<action android:name="android.intent.action.SEND_MULTIPLE" />.*?</intent-filter>',
                      '',
                      activity_block,
                      flags=re.S
                  )

                  intent_filter = (
                      '\n                  <intent-filter>\n'
                      '                    <action android:name="android.intent.action.SEND" />\n'
                      '                    <category android:name="android.intent.category.DEFAULT" />\n'
                      '                    <data android:mimeType="audio/*" />\n'
                      '                  </intent-filter>\n'
                      '                  <intent-filter>\n'
                      '                    <action android:name="android.intent.action.SEND_MULTIPLE" />\n'
                      '                    <category android:name="android.intent.category.DEFAULT" />\n'
                      '                    <data android:mimeType="audio/*" />\n'
                      '                  </intent-filter>\n'
                      '                  <intent-filter>\n'
                      '                    <action android:name="android.intent.action.SEND" />\n'
                      '                    <category android:name="android.intent.category.DEFAULT" />\n'
                      '                    <data android:mimeType="image/*" />\n'
                      '                  </intent-filter>\n'
                      '                  <intent-filter>\n'
                      '                    <action android:name="android.intent.action.SEND_MULTIPLE" />\n'
                      '                    <category android:name="android.intent.category.DEFAULT" />\n'
                      '                    <data android:mimeType="image/*" />\n'
                      '                  </intent-filter>\n'
                      '                  <intent-filter>\n'
                      '                    <action android:name="android.intent.action.SEND" />\n'
                      '                    <category android:name="android.intent.category.DEFAULT" />\n'
                      '                    <data android:mimeType="*/*" />\n'
                      '                  </intent-filter>\n'
                      '                  <intent-filter>\n'
                      '                    <action android:name="android.intent.action.SEND_MULTIPLE" />\n'
                      '                    <category android:name="android.intent.category.DEFAULT" />\n'
                      '                    <data android:mimeType="*/*" />\n'
                      '                  </intent-filter>'
                  )

                  activity_block += intent_filter

                  text = (
                      text[:activity_start] +
                      activity_block +
                      text[activity_end:]
                  )

          manifest.write_text(text)
          PY

      - name: Preparar keystore

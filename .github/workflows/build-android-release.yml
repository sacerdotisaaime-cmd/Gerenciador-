name: Build Android APK - V120 - WHATSAPP AUDIO SHARE - FIXED

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      ZIP_FILE: ./Gestao_Sacerdotista_Aime_V119_CAIXA_MIDIAS_WHATSAPP_CORRIGIDA.zip
      PROJECT_DIR: app

    steps:

      # ============================================================
      # 1. BAIXAR PROJETO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 21
      # ============================================================

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ============================================================
      # 3. NODE 22
      # ============================================================

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 5. DESCOMPACTAR PROJETO
      # ============================================================

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "PREPARANDO PROJETO"
          echo "=================================================="

          rm -rf "$PROJECT_DIR"

          mkdir -p "$PROJECT_DIR"

          unzip -q "$ZIP_FILE" -d "$PROJECT_DIR"

          echo
          echo "Procurando package.json..."

          PACKAGE_JSON=$(find "$PROJECT_DIR" -type f -name package.json | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERRO: package.json não encontrado."
            exit 1
          fi

          FOUND_DIR=$(dirname "$PACKAGE_JSON")

          echo "Projeto encontrado em: $FOUND_DIR"

          if [ "$FOUND_DIR" != "$PROJECT_DIR" ]; then
            echo "Movendo conteúdo para $PROJECT_DIR..."

            shopt -s dotglob

            TEMP_DIR="${PROJECT_DIR}_temp"

            rm -rf "$TEMP_DIR"
            mkdir -p "$TEMP_DIR"

            cp -a "$FOUND_DIR"/. "$TEMP_DIR"/

            rm -rf "$PROJECT_DIR"

            mv "$TEMP_DIR" "$PROJECT_DIR"
          fi

          echo
          echo "Conteúdo final:"
          find "$PROJECT_DIR" -maxdepth 2 -type f | head -100

      # ============================================================
      # 6. INSTALAR DEPENDÊNCIAS
      # ============================================================

      - name: Instalar dependências
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "INSTALANDO DEPENDÊNCIAS"
          echo "=================================================="

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ============================================================
      # 7. GARANTIR CAPACITOR
      # ============================================================

      - name: Garantir dependências Capacitor
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npm install \
            @capacitor/core@^7.4.3 \
            @capacitor/android@^7.4.3 \
            @capacitor/camera@^7.0.5 \
            @capacitor/share@^7.0.2 \
            @capacitor/filesystem@^7.0.2 \
            @capacitor-community/contacts@7.2.0 \
            capacitor-voice-recorder@7.0.6 \
            @capacitor/barcode-scanner@2.0.4

      # ============================================================
      # 8. BUILD WEB
      # ============================================================

      - name: Gerar build web
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "BUILD WEB"
          echo "=================================================="

          if npm run | grep -q "build"; then
            npm run build
          else
            echo "Nenhum script build encontrado."
          fi

      # ============================================================
      # 9. SINCRONIZAR CAPACITOR
      # ============================================================

      - name: Sincronizar Capacitor Android
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "CAPACITOR SYNC"
          echo "=================================================="

          npx cap sync android

      # ============================================================
      # 10. CRIAR PERMISSION BRIDGE
      # ============================================================

      - name: Criar PermissionBridgePlugin
        shell: bash
        run: |
          set -e

          PLUGIN_DIR="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao"

          mkdir -p "$PLUGIN_DIR"

          cat > "$PLUGIN_DIR/PermissionBridgePlugin.java" <<'JAVA'
package com.sacerdotisaaime.gestao;

import android.Manifest;
import android.app.Activity;
import android.content.ClipData;
import android.content.ContentResolver;
import android.content.Context;
import android.content.Intent;
import android.content.pm.PackageManager;
import android.database.Cursor;
import android.net.Uri;
import android.provider.OpenableColumns;

import androidx.annotation.NonNull;
import androidx.core.app.ActivityCompat;
import androidx.core.content.ContextCompat;

import com.getcapacitor.JSArray;
import com.getcapacitor.JSObject;
import com.getcapacitor.Plugin;
import com.getcapacitor.PluginCall;
import com.getcapacitor.PluginMethod;
import com.getcapacitor.annotation.CapacitorPlugin;

import java.io.File;
import java.io.FileInputStream;
import java.io.FileOutputStream;
import java.io.InputStream;
import java.io.OutputStream;

import java.nio.charset.StandardCharsets;
import java.util.ArrayList;
import java.util.List;
import java.util.Locale;

@CapacitorPlugin(name = "PermissionBridge")
public class PermissionBridgePlugin extends Plugin {

    private static final int CONTACTS_REQUEST = 8101;
    private static final int AUDIO_REQUEST = 8102;
    private static final int CAMERA_REQUEST = 8103;

    private static final String INBOX_DIR = "shared-media-inbox";

    private static final long MAX_AUDIO_BYTES = 50L * 1024L * 1024L;
    private static final long MAX_IMAGE_BYTES = 20L * 1024L * 1024L;

    private static PermissionBridgePlugin instance;

    @Override
    public void load() {
        super.load();
        instance = this;

        try {
            handleIncomingIntent(getActivity().getIntent(), true);
        } catch (Exception ignored) {
        }
    }

    @Override
    protected void handleOnNewIntent(Intent intent) {
        super.handleOnNewIntent(intent);

        try {
            handleIncomingIntent(intent, false);
        } catch (Exception ignored) {
        }
    }

    public static void handleSharedIntent(Intent intent) {
        if (instance != null && intent != null) {
            try {
                instance.handleIncomingIntent(intent, false);
            } catch (Exception ignored) {
            }
        }
    }

    private void handleIncomingIntent(Intent intent, boolean initial) {

        if (intent == null) {
            return;
        }

        String action = intent.getAction();

        if (!Intent.ACTION_SEND.equals(action)
                && !Intent.ACTION_SEND_MULTIPLE.equals(action)) {
            return;
        }

        ArrayList<Uri> uris = new ArrayList<>();

        ClipData clipData = intent.getClipData();

        if (clipData != null) {
            for (int i = 0; i < clipData.getItemCount(); i++) {
                Uri uri = clipData.getItemAt(i).getUri();

                if (uri != null) {
                    uris.add(uri);
                }
            }
        }

        Uri single = intent.getParcelableExtra(Intent.EXTRA_STREAM);

        if (single != null && !uris.contains(single)) {
            uris.add(single);
        }

        if (uris.isEmpty()) {
            return;
        }

        for (Uri uri : uris) {
            saveUri(uri);
        }

        JSObject event = new JSObject();

        event.put("count", uris.size());
        event.put("initial", initial);

        notifyListeners("sharedMedia", event);
    }

    private File getInboxDirectory() {

        File dir = new File(
                getContext().getFilesDir(),
                INBOX_DIR
        );

        if (!dir.exists()) {
            dir.mkdirs();
        }

        return dir;
    }

    private String getFileName(Uri uri) {

        String name = null;

        try {
            Cursor cursor = getContext()
                    .getContentResolver()
                    .query(
                            uri,
                            null,
                            null,
                            null,
                            null
                    );

            if (cursor != null) {

                int index = cursor.getColumnIndex(
                        OpenableColumns.DISPLAY_NAME
                );

                if (index >= 0 && cursor.moveToFirst()) {
                    name = cursor.getString(index);
                }

                cursor.close();
            }

        } catch (Exception ignored) {
        }

        if (name == null || name.trim().isEmpty()) {
            name = "shared_" + System.currentTimeMillis();
        }

        return sanitize(name);
    }

    private String sanitize(String name) {

        name = name.replaceAll("[^a-zA-Z0-9._-]", "_");

        if (name.length() > 120) {
            name = name.substring(name.length() - 120);
        }

        return name;
    }

    private String detectMime(File file) {

        try (InputStream input = new FileInputStream(file)) {

            byte[] h = new byte[32];

            int length = input.read(h);

            if (length <= 0) {
                return "application/octet-stream";
            }

            if (signature(h, length,
                    0xFF, 0xD8, 0xFF)) {
                return "image/jpeg";
            }

            if (signature(h, length,
                    0x89, 0x50, 0x4E, 0x47)) {
                return "image/png";
            }

            if (signature(h, length,
                    0x52, 0x49, 0x46, 0x46)) {

                if (length >= 12
                        && byteAt(h, length, 8, 0x57)
                        && byteAt(h, length, 9, 0x45)
                        && byteAt(h, length, 10, 0x42)
                        && byteAt(h, length, 11, 0x50)) {

                    return "image/webp";
                }
            }

            if (signature(h, length,
                    0x4F, 0x67, 0x67, 0x53)) {
                return "audio/ogg";
            }

            if (signature(h, length,
                    0x52, 0x49, 0x46, 0x46)) {

                if (length >= 12
                        && byteAt(h, length, 8, 0x57)
                        && byteAt(h, length, 9, 0x41)
                        && byteAt(h, length, 10, 0x56)
                        && byteAt(h, length, 11, 0x45)) {

                    return "audio/wav";
                }
            }

            if (length >= 3
                    && byteAt(h, length, 0, 0x49)
                    && byteAt(h, length, 1, 0x44)
                    && byteAt(h, length, 2, 0x33)) {

                return "audio/mpeg";
            }

            if (length >= 2) {

                int first = h[0] & 0xFF;
                int second = h[1] & 0xFF;

                if (first == 0xFF
                        && (second & 0xE0) == 0xE0) {

                    return "audio/mpeg";
                }
            }

            String name = file.getName().toLowerCase(Locale.US);

            if (name.endsWith(".m4a")
                    || name.endsWith(".m4b")) {
                return "audio/mp4";
            }

            if (name.endsWith(".webm")) {
                return "audio/webm";
            }

            if (name.endsWith(".heic")
                    || name.endsWith(".heif")) {
                return "image/heic";
            }

        } catch (Exception ignored) {
        }

        return "application/octet-stream";
    }

    private boolean byteAt(
            byte[] data,
            int length,
            int index,
            int expected
    ) {

        if (index < 0 || index >= length) {
            return false;
        }

        return (data[index] & 0xFF)
                == (expected & 0xFF);
    }

    private boolean signature(
            byte[] data,
            int length,
            int... values
    ) {

        if (length < values.length) {
            return false;
        }

        for (int i = 0; i < values.length; i++) {

            if (!byteAt(
                    data,
                    length,
                    i,
                    values[i]
            )) {
                return false;
            }
        }

        return true;
    }

    private File saveUri(Uri uri) {

        if (uri == null) {
            return null;
        }

        ContentResolver resolver =
                getContext().getContentResolver();

        File inbox = getInboxDirectory();

        String originalName = getFileName(uri);

        File temp = new File(
                inbox,
                ".tmp_" + System.currentTimeMillis()
        );

        File output = new File(
                inbox,
                System.currentTimeMillis()
                        + "_"
                        + originalName
        );

        try (
                InputStream input =
                        resolver.openInputStream(uri);

                OutputStream out =
                        new FileOutputStream(temp)
        ) {

            if (input == null) {
                return null;
            }

            byte[] buffer = new byte[8192];

            long total = 0;

            int read;

            while ((read = input.read(buffer)) != -1) {

                total += read;

                if (total > MAX_AUDIO_BYTES) {
                    temp.delete();
                    return null;
                }

                out.write(buffer, 0, read);
            }

            out.flush();

        } catch (Exception e) {

            temp.delete();

            return null;
        }

        String mime = detectMime(temp);

        boolean isImage =
                mime.startsWith("image/")
                || originalName.toLowerCase(Locale.US)
                    .endsWith(".jpg")
                || originalName.toLowerCase(Locale.US)
                    .endsWith(".jpeg")
                || originalName.toLowerCase(Locale.US)
                    .endsWith(".png")
                || originalName.toLowerCase(Locale.US)
                    .endsWith(".webp")
                || originalName.toLowerCase(Locale.US)
                    .endsWith(".heic")
                || originalName.toLowerCase(Locale.US)
                    .endsWith(".heif");

        if (isImage && temp.length() > MAX_IMAGE_BYTES) {
            temp.delete();
            return null;
        }

        if (!temp.renameTo(output)) {

            try {
                copyFile(temp, output);
                temp.delete();
            } catch (Exception e) {
                temp.delete();
                return null;
            }
        }

        JSObject event = new JSObject();

        event.put(
                "name",
                output.getName()
        );

        event.put(
                "path",
                output.getAbsolutePath()
        );

        event.put(
                "mimeType",
                mime
        );

        event.put(
                "size",
                output.length()
        );

        notifyListeners(
                "sharedMediaFile",
                event
        );

        return output;
    }

    private void copyFile(
            File source,
            File destination
    ) throws Exception {

        try (
                InputStream input =
                        new FileInputStream(source);

                OutputStream output =
                        new FileOutputStream(destination)
        ) {

            byte[] buffer = new byte[8192];

            int read;

            while ((read = input.read(buffer)) != -1) {
                output.write(buffer, 0, read);
            }

            output.flush();
        }
    }

    @PluginMethod
    public void getSharedMedia(
            PluginCall call
    ) {

        File dir = getInboxDirectory();

        File[] files = dir.listFiles();

        JSArray result = new JSArray();

        if (files != null) {

            for (File file : files) {

                if (!file.isFile()) {
                    continue;
                }

                if (file.getName().startsWith(".tmp_")) {
                    continue;
                }

                JSObject item = new JSObject();

                item.put(
                        "name",
                        file.getName()
                );

                item.put(
                        "path",
                        file.getAbsolutePath()
                );

                item.put(
                        "mimeType",
                        detectMime(file)
                );

                item.put(
                        "size",
                        file.length()
                );

                item.put(
                        "modified",
                        file.lastModified()
                );

                result.put(item);
            }
        }

        JSObject response = new JSObject();

        response.put("files", result);

        call.resolve(response);
    }

    @PluginMethod
    public void listSharedMedia(
            PluginCall call
    ) {
        getSharedMedia(call);
    }

    @PluginMethod
    public void deleteSharedMedia(
            PluginCall call
    ) {

        String path =
                call.getString("path");

        if (path == null) {
            call.reject("Caminho não informado.");
            return;
        }

        File file = new File(path);

        File inbox = getInboxDirectory();

        try {

            String canonicalFile =
                    file.getCanonicalPath();

            String canonicalInbox =
                    inbox.getCanonicalPath();

            if (!canonicalFile.startsWith(
                    canonicalInbox + File.separator
            )) {

                call.reject("Arquivo inválido.");
                return;
            }

        } catch (Exception e) {

            call.reject("Não foi possível validar o arquivo.");
            return;
        }

        boolean deleted = file.delete();

        JSObject result = new JSObject();

        result.put("deleted", deleted);

        call.resolve(result);
    }

    @PluginMethod
    public void readSharedMedia(
            PluginCall call
    ) {

        String path =
                call.getString("path");

        if (path == null) {
            call.reject("Caminho não informado.");
            return;
        }

        File file = new File(path);

        if (!file.exists()) {
            call.reject("Arquivo não encontrado.");
            return;
        }

        JSObject result = new JSObject();

        result.put(
                "name",
                file.getName()
        );

        result.put(
                "path",
                file.getAbsolutePath()
        );

        result.put(
                "mimeType",
                detectMime(file)
        );

        result.put(
                "size",
                file.length()
        );

        call.resolve(result);
    }

    @PluginMethod
    public void claimInitialSync(
            PluginCall call
    ) {

        JSObject result = new JSObject();

        result.put("claimed", true);

        call.resolve(result);
    }

    @PluginMethod
    public void requestContactsPermission(
            PluginCall call
    ) {

        if (ContextCompat.checkSelfPermission(
                getContext(),
                Manifest.permission.READ_CONTACTS
        ) == PackageManager.PERMISSION_GRANTED) {

            JSObject result = new JSObject();

            result.put("granted", true);

            call.resolve(result);

            return;
        }

        requestPermissionForAlias(
                "contacts",
                call,
                CONTACTS_REQUEST
        );
    }

    @PluginMethod
    public void requestMicrophonePermission(
            PluginCall call
    ) {

        if (ContextCompat.checkSelfPermission(
                getContext(),
                Manifest.permission.RECORD_AUDIO
        ) == PackageManager.PERMISSION_GRANTED) {

            JSObject result = new JSObject();

            result.put("granted", true);

            call.resolve(result);

            return;
        }

        requestPermissionForAlias(
                "microphone",
                call,
                AUDIO_REQUEST
        );
    }

    @PluginMethod
    public void requestCameraPermission(
            PluginCall call
    ) {

        if (ContextCompat.checkSelfPermission(
                getContext(),
                Manifest.permission.CAMERA
        ) == PackageManager.PERMISSION_GRANTED) {

            JSObject result = new JSObject();

            result.put("granted", true);

            call.resolve(result);

            return;
        }

        requestPermissionForAlias(
                "camera",
                call,
                CAMERA_REQUEST
        );
    }

    private void requestPermissionForAlias(
            String alias,
            PluginCall call,
            int requestCode
    ) {

        saveCall(call);

        String permission;

        if ("contacts".equals(alias)) {

            permission =
                    Manifest.permission.READ_CONTACTS;

        } else if ("microphone".equals(alias)) {

            permission =
                    Manifest.permission.RECORD_AUDIO;

        } else {

            permission =
                    Manifest.permission.CAMERA;
        }

        Activity activity = getActivity();

        ActivityCompat.requestPermissions(
                activity,
                new String[]{permission},
                requestCode
        );
    }

    @Override
    protected void handleRequestPermissionsResult(
            int requestCode,
            String[] permissions,
            int[] grantResults
    ) {

        super.handleRequestPermissionsResult(
                requestCode,
                permissions,
                grantResults
        );

        PluginCall call = getSavedCall();

        if (call == null) {
            return;
        }

        boolean granted =
                grantResults.length > 0
                && grantResults[0]
                    == PackageManager.PERMISSION_GRANTED;

        JSObject result = new JSObject();

        result.put("granted", granted);

        call.resolve(result);
    }

    @PluginMethod
    public void openSettings(
            PluginCall call
    ) {

        try {

            Intent intent =
                    new Intent(
                            android.provider.Settings.ACTION_APPLICATION_DETAILS_SETTINGS
                    );

            intent.setData(
                    Uri.parse(
                            "package:"
                            + getContext().getPackageName()
                    )
            );

            getContext().startActivity(intent);

            call.resolve();

        } catch (Exception e) {

            call.reject(
                    "Não foi possível abrir as configurações."
            );
        }
    }
}
JAVA

      # ============================================================
      # 11. MAIN ACTIVITY
      # ============================================================

      - name: Corrigir MainActivity
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao/MainActivity.java"

          mkdir -p "$(dirname "$MAIN")"

          cat > "$MAIN" <<'JAVA'
package com.sacerdotisaaime.gestao;

import android.content.Intent;
import android.os.Bundle;

import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {

    @Override
    public void onCreate(Bundle savedInstanceState) {

        registerPlugin(
                PermissionBridgePlugin.class
        );

        super.onCreate(savedInstanceState);

        PermissionBridgePlugin.handleSharedIntent(
                getIntent()
        );
    }

    @Override
    protected void onNewIntent(Intent intent) {

        super.onNewIntent(intent);

        setIntent(intent);

        PermissionBridgePlugin.handleSharedIntent(
                intent
        );
    }
}
JAVA

      # ============================================================
      # 12. MANIFEST
      # ============================================================

      - name: Corrigir AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(encoding="utf-8")

          # --------------------------------------------------
          # PERMISSÕES
          # --------------------------------------------------

          permissions = [
              'android.permission.READ_CONTACTS',
              'android.permission.WRITE_CONTACTS',
              'android.permission.RECORD_AUDIO',
              'android.permission.CAMERA',
          ]

          for permission in permissions:

              pattern = (
                  r'<uses-permission\s+'
                  r'android:name="'
                  + re.escape(permission)
                  + r'"\s*/>'
              )

              if not re.search(pattern, text):

                  text = re.sub(
                      r'(<manifest\b[^>]*>)',
                      r'\1\n    <uses-permission android:name="'
                      + permission
                      + '"/>',
                      text,
                      count=1
                  )

          # --------------------------------------------------
          # MAIN ACTIVITY
          # --------------------------------------------------

          activity_match = re.search(
              r'<activity\b[^>]*android:name="\.MainActivity"[^>]*>',
              text
          )

          if not activity_match:

              activity = '''
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:launchMode="singleTask"
            android:grantUriPermissions="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>

            <intent-filter>
                <action android:name="android.intent.action.SEND"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <data android:mimeType="audio/*"/>
            </intent-filter>

            <intent-filter>
                <action android:name="android.intent.action.SEND"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <data android:mimeType="image/*"/>
            </intent-filter>

            <intent-filter>
                <action android:name="android.intent.action.SEND"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <data android:mimeType="*/*"/>
            </intent-filter>

            <intent-filter>
                <action android:name="android.intent.action.SEND_MULTIPLE"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <data android:mimeType="audio/*"/>
            </intent-filter>

            <intent-filter>
                <action android:name="android.intent.action.SEND_MULTIPLE"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <data android:mimeType="image/*"/>
            </intent-filter>

            <intent-filter>
                <action android:name="android.intent.action.SEND_MULTIPLE"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <data android:mimeType="*/*"/>
            </intent-filter>

        </activity>
          '''

              application_end = text.find(
                  "</application>"
              )

              if application_end == -1:
                  raise SystemExit(
                      "ERRO: </application> não encontrado."
                  )

              text = (
                  text[:application_end]
                  + activity
                  + "\n"
                  + text[application_end:]
              )

          else:

              start = activity_match.start()

              # Localiza fechamento da activity
              brace_like_end = text.find(
                  "</activity>",
                  activity_match.end()
              )

              if brace_like_end != -1:

                  end = brace_like_end + len(
                      "</activity>"
                  )

                  old = text[start:end]

                  if 'android:launchMode=' not in old:

                      old = old.replace(
                          'android:exported="true"',
                          'android:exported="true"\n'
                          '            android:launchMode="singleTask"\n'
                          '            android:grantUriPermissions="true"'
                      )

                  text = (
                      text[:start]
                      + old
                      + text[end:]
                  )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("AndroidManifest.xml corrigido.")
          PY

      # ============================================================
      # 13. VALIDAR JAVA
      # ============================================================

      - name: Validar código nativo
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao/MainActivity.java"

          PLUGIN="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao/PermissionBridgePlugin.java"

          echo "=================================================="
          echo "VALIDANDO CÓDIGO NATIVO"
          echo "=================================================="

          test -f "$MAIN"
          test -f "$PLUGIN"

          grep -q 'handleSharedIntent' "$MAIN"
          grep -q 'getIntent' "$MAIN"
          grep -q 'onNewIntent' "$MAIN"

          grep -q '@CapacitorPlugin(name = "PermissionBridge")' "$PLUGIN"
          grep -q 'ACTION_SEND' "$PLUGIN"
          grep -q 'ACTION_SEND_MULTIPLE' "$PLUGIN"
          grep -q 'sharedMedia' "$PLUGIN"
          grep -q 'getSharedMedia' "$PLUGIN"

          if grep -q 'byte\.\.\. signature' "$PLUGIN"; then
            echo "ERRO: assinatura antiga com byte varargs encontrada."
            exit 1
          fi

          echo "Código nativo OK."

      # ============================================================
      # 14. CONFIGURAR VERSÃO E GRADLE
      # ============================================================

      - name: Corrigir build.gradle Android de forma segura
        shell: bash
        run: |
          set -e

          BUILD_GRADLE="$PROJECT_DIR/android/app/build.gradle"

          echo "=================================================="
          echo "CORRIGINDO BUILD.GRADLE"
          echo "=================================================="

          python3 - "$BUILD_GRADLE" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )

          print("Arquivo:", path)

          # ==================================================
          # FUNÇÃO PARA ENCONTRAR BLOCO
          # ==================================================

          def find_block(source, name):

              pattern = re.compile(
                  r'(?m)^\s*' +
                  re.escape(name) +
                  r'\s*\{'
              )

              match = pattern.search(source)

              if not match:
                  return None

              brace = source.find(
                  "{",
                  match.start()
              )

              depth = 1
              pos = brace + 1

              while pos < len(source):

                  if source[pos] == "{":
                      depth += 1

                  elif source[pos] == "}":
                      depth -= 1

                      if depth == 0:
                          return (
                              match.start(),
                              pos + 1,
                              brace,
                              pos
                          )

                  pos += 1

              raise SystemExit(
                  "ERRO: bloco "
                  + name
                  + " possui chaves desbalanceadas."
              )

          # ==================================================
          # ANDROID
          # ==================================================

          android = find_block(
              text,
              "android"
          )

          if not android:
              raise SystemExit(
                  "ERRO: bloco android não encontrado."
              )

          a_start, a_end, a_brace, a_close = android

          android_body = text[
              a_brace + 1:
              a_close
          ]

          # Remove QUALQUER compileSdk antigo.
          android_body = re.sub(
              r'(?m)^\s*compileSdk(?:Version)?\s*(?:=)?\s*[^\n]+$',
              '',
              android_body
          )

          # ==================================================
          # DEFAULT CONFIG
          # ==================================================

          default = find_block(
              android_body,
              "defaultConfig"
          )

          if default:

              d_start, d_end, d_brace, d_close = default

              default_body = android_body[
                  d_brace + 1:
                  d_close
              ]

              default_body = re.sub(
                  r'(?m)^\s*minSdk(?:Version)?\s*(?:=)?\s*[^\n]+$',
                  '',
                  default_body
              )

              default_body = re.sub(
                  r'(?m)^\s*targetSdk(?:Version)?\s*(?:=)?\s*[^\n]+$',
                  '',
                  default_body
              )

              default_body = (
                  "\n"
                  "        minSdk 26\n"
                  "        targetSdk 35\n"
                  + default_body.strip()
                  + "\n    "
              )

              android_body = (
                  android_body[:d_brace + 1]
                  + default_body
                  + android_body[d_close:]
              )

          else:

              android_body = (
                  "\n"
                  "    defaultConfig {\n"
                  "        minSdk 26\n"
                  "        targetSdk 35\n"
                  "    }\n"
                  + android_body
              )

          # ==================================================
          # COMPILE SDK
          # ==================================================

          android_body = (
              "\n"
              "    compileSdk 35\n"
              + android_body
          )

          # ==================================================
          # VERSION CODE / VERSION NAME
          # ==================================================

          android_body = re.sub(
              r'(?m)^\s*versionCode\s+[^\n]+$',
              '        versionCode 120',
              android_body
          )

          android_body = re.sub(
              r'(?m)^\s*versionName\s+[^\n]+$',
              '        versionName "1.20.0"',
              android_body
          )

          # Se não encontrou, adiciona no defaultConfig.
          default = find_block(
              android_body,
              "defaultConfig"
          )

          if not default:
              raise SystemExit(
                  "ERRO: defaultConfig desapareceu."
              )

          d_start, d_end, d_brace, d_close = default

          default_body = android_body[
              d_brace + 1:
              d_close
          ]

          if not re.search(
              r'(?m)^\s*versionCode\s+120\s*$',
              default_body
          ):
              default_body = (
                  "\n"
                  "        versionCode 120"
                  + default_body
              )

          if not re.search(
              r'(?m)^\s*versionName\s+"1\.20\.0"\s*$',
              default_body
          ):
              default_body = (
                  default_body
                  + '\n'
                  '        versionName "1.20.0"\n'
              )

          android_body = (
              android_body[:d_brace + 1]
              + default_body
              + android_body[d_close:]
          )

          # ==================================================
          # REMOVER SIGNING CONFIG ANTIGA
          # ==================================================

          while True:

              block = find_block(
                  android_body,
                  "signingConfigs"
              )

              if not block:
                  break

              s_start, s_end, _, _ = block

              android_body = (
                  android_body[:s_start]
                  + android_body[s_end:]
              )

          # ==================================================
          # NOVA SIGNING CONFIG
          # ==================================================

          signing = """
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """

          android_body = (
              "\n"
              + signing
              + "\n"
              + android_body
          )

          # ==================================================
          # BUILD TYPES
          # ==================================================

          buildtypes = find_block(
              android_body,
              "buildTypes"
          )

          if not buildtypes:

              android_body += """

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              """

          else:

              bt_start, bt_end, bt_brace, bt_close = buildtypes

              bt_body = android_body[
                  bt_brace + 1:
                  bt_close
              ]

              release = find_block(
                  bt_body,
                  "release"
              )

              if release:

                  r_start, r_end, r_brace, r_close = release

                  release_body = bt_body[
                      r_brace + 1:
                      r_close
                  ]

                  release_body = re.sub(
                      r'(?m)^\s*signingConfig\s+.*$',
                      '',
                      release_body
                  )

                  release_body = (
                      "\n"
                      "            signingConfig signingConfigs.release\n"
                      + release_body.strip()
                      + "\n        "
                  )

                  bt_body = (
                      bt_body[:r_brace + 1]
                      + release_body
                      + bt_body[r_close:]
                  )

              else:

                  bt_body += """

                  release {
                      signingConfig signingConfigs.release
                  }
                  """

              android_body = (
                  android_body[:bt_brace + 1]
                  + bt_body
                  + android_body[bt_close:]
              )

          # ==================================================
          # RECONSTRUIR ANDROID
          # ==================================================

          text = (
              text[:a_brace + 1]
              + android_body
              + text[a_close:]
          )

          # ==================================================
          # LIMPEZA FINAL DE PADRÕES QUEBRADOS
          # ==================================================

          text = re.sub(
              r'compileSdk\s*=\s*35\s*\(\s*\)',
              'compileSdk 35',
              text
          )

          text = re.sub(
              r'compileSdk\s+35\s*\(\s*\)',
              'compileSdk 35',
              text
          )

          text = re.sub(
              r'compileSdkVersion\s+35\s*\(\s*\)',
              'compileSdk 35',
              text
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("build.gradle corrigido.")
          PY

      # ============================================================
      # 15. COPIAR KEYSTORE
      # ============================================================

      - name: Criar keystore de assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          ANDROID_DIR="$PROJECT_DIR/android"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_DIR/release-key.jks"

          test -s "$ANDROID_DIR/release-key.jks"

          echo "Keystore criada."

      # ============================================================
      # 16. VALIDAR BUILD.GRADLE
      # ============================================================

      - name: Validar build.gradle antes do Gradle
        shell: bash
        run: |
          set -e

          BUILD_GRADLE="$PROJECT_DIR/android/app/build.gradle"

          echo "=================================================="
          echo "VALIDAÇÃO DO BUILD.GRADLE"
          echo "=================================================="

          nl -ba "$BUILD_GRADLE" | sed -n '1,220p'

          echo
          echo "--------------------------------------------------"
          echo "PROPRIEDADES IMPORTANTES"
          echo "--------------------------------------------------"

          grep -n "compileSdk" "$BUILD_GRADLE"
          grep -n "minSdk" "$BUILD_GRADLE"
          grep -n "targetSdk" "$BUILD_GRADLE"
          grep -n "versionCode" "$BUILD_GRADLE"
          grep -n "versionName" "$BUILD_GRADLE"
          grep -n "signingConfig" "$BUILD_GRADLE"

          # Nunca aceitar compileSdk 35()
          if grep -Eq 'compileSdk[^$]*35[[:space:]]*\(' "$BUILD_GRADLE"; then
            echo "ERRO: compileSdk ainda está como função 35()."
            exit 1
          fi

          if grep -Eq 'compileSdk[[:space:]]*=[[:space:]]*35[[:space:]]*\(' "$BUILD_GRADLE"; then
            echo "ERRO: compileSdk possui sintaxe inválida."
            exit 1
          fi

          # Deve existir exatamente uma configuração válida
          grep -Eq 'compileSdk[[:space:]]+35' "$BUILD_GRADLE"

          grep -Eq 'minSdk[[:space:]]+26' "$BUILD_GRADLE"

          grep -Eq 'targetSdk[[:space:]]+35' "$BUILD_GRADLE"

          grep -Eq 'versionCode[[:space:]]+120' "$BUILD_GRADLE"

          grep -Eq 'versionName[[:space:]]+"1\.20\.0"' "$BUILD_GRADLE"

          grep -q 'signingConfig signingConfigs.release' "$BUILD_GRADLE"

          # Nunca permitir signingConfig dentro de signingConfigs.
          python3 - "$BUILD_GRADLE" <<'PY'
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(
              encoding="utf-8"
          )

          pos = 0

          while True:

              start = text.find(
                  "signingConfigs",
                  pos
              )

              if start == -1:
                  break

              brace = text.find(
                  "{",
                  start
              )

              if brace == -1:
                  break

              depth = 1
              i = brace + 1

              while i < len(text) and depth:

                  if text[i] == "{":
                      depth += 1

                  elif text[i] == "}":
                      depth -= 1

                  i += 1

              block = text[start:i]

              if "signingConfig signingConfigs.release" in block:
                  raise SystemExit(
                      "ERRO: signingConfig foi colocado dentro de signingConfigs."
                  )

              pos = i

          print("Estrutura signingConfigs OK.")
          PY

          echo
          echo "BUILD.GRADLE PASSOU NA VALIDAÇÃO."

      # ============================================================
      # 17. VALIDAR MANIFEST
      # ============================================================

      - name: Validar AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          echo "=================================================="
          echo "VALIDANDO MANIFEST"
          echo "=================================================="

          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"
          grep -q 'android.permission.CAMERA' "$MANIFEST"
          grep -q 'android.permission.READ_CONTACTS' "$MANIFEST"

          grep -q 'android.intent.action.SEND' "$MANIFEST"
          grep -q 'android.intent.action.SEND_MULTIPLE' "$MANIFEST"

          grep -q 'android:mimeType="audio/\*"' "$MANIFEST"
          grep -q 'android:mimeType="image/\*"' "$MANIFEST"

          grep -q 'android:launchMode="singleTask"' "$MANIFEST"
          grep -q 'android:grantUriPermissions="true"' "$MANIFEST"

          echo "Manifest OK."

      # ============================================================
      # 18. VERIFICAR JAVAC/GRADLE
      # ============================================================

      - name: Verificar Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 19. EXECUTAR GRADLE
      # ============================================================

      - name: Executar Gradle Release
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          echo "=================================================="
          echo "EXECUTANDO GRADLE"
          echo "=================================================="

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

          echo "=================================================="
          echo "GRADLE FINALIZADO"
          echo "=================================================="

      # ============================================================
      # 20. LOCALIZAR APK
      # ============================================================

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          ANDROID_DIR="$PROJECT_DIR/android"

          echo "=================================================="
          echo "PROCURANDO APK"
          echo "=================================================="

          find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -name "*release*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERRO: APK release não encontrado."

            find "$ANDROID_DIR" \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print

            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/app-release.apk"

          test -s "$GITHUB_WORKSPACE/app-release.apk"

          echo "APK copiado para:"
          echo "$GITHUB_WORKSPACE/app-release.apk"

      # ============================================================
      # 21. VALIDAR APK
      # ============================================================

      - name: Validar APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/app-release.apk"

          echo "=================================================="
          echo "VALIDANDO APK"
          echo "=================================================="

          test -f "$APK"
          test -s "$APK"

          ls -lh "$APK"

          if command -v apksigner >/dev/null 2>&1; then

            echo
            echo "Verificando assinatura..."

            apksigner verify \
              --verbose \
              "$APK"

          else

            echo "apksigner não encontrado no PATH."

          fi

      # ============================================================
      # 22. DISPONIBILIZAR APK
      # ============================================================

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-Sacerdotista-Aime-V120
          path: app-release.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 23. RESUMO
      # ============================================================

      - name: Resumo final
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "BUILD V120 FINALIZADO"
          echo "=================================================="

          echo
          echo "APK:"
          ls -lh app-release.apk

          echo
          echo "SHA256:"
          sha256sum app-release.apk

          echo
          echo "Versão:"
          echo "1.20.0"

          echo
          echo "Version Code:"
          echo "120"

          echo
          echo "=================================================="
          echo "RECURSOS INCLUÍDOS"
          echo "=================================================="

          echo "✓ Recebimento ACTION_SEND"
          echo "✓ Recebimento ACTION_SEND_MULTIPLE"
          echo "✓ Áudio compartilhado pelo WhatsApp"
          echo "✓ Imagens compartilhadas"
          echo "✓ ClipData"
          echo "✓ EXTRA_STREAM"
          echo "✓ Caixa de Mídias persistente"
          echo "✓ Arquivos de até 50 MB para áudio"
          echo "✓ PermissionBridge"
          echo "✓ MainActivity singleTask"
          echo "✓ Android SDK 35"
          echo "✓ Min SDK 26"
          echo "✓ APK Release assinado"
          echo "✓ Artifact V120"

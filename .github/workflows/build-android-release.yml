      - name: Configurar AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )


          permissions = [
              "android.permission.READ_CONTACTS",
              "android.permission.WRITE_CONTACTS",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
          ]


          marker = "<application"


          if marker not in text:

              raise SystemExit(
                  "ERRO: <application> não encontrado."
              )


          additions = ""


          for permission in permissions:

              if (
                  f'android:name="{permission}"'
                  not in text
              ):

                  additions += (
                      f'    <uses-permission '
                      f'android:name="{permission}" />\n'
                  )


          if additions:

              text = text.replace(
                  marker,
                  additions + marker,
                  1
              )


          activity_pattern = (
              r'<activity\b'
              r'[^>]*'
              r'android:name="\.MainActivity"'
              r'[^>]*>'
              r'.*?'
              r'</activity>'
          )


          new_activity = """
          <activity
              android:name=".MainActivity"
              android:exported="true"
              android:grantUriPermissions="true"
              android:launchMode="singleTask">

              <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="audio/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND_MULTIPLE" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="audio/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="image/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND_MULTIPLE" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="image/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="*/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND_MULTIPLE" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="*/*" />
              </intent-filter>

          </activity>
          """


          match = re.search(
              activity_pattern,
              text,
              flags=re.DOTALL
          )


          if match:

              text = (
                  text[:match.start()]
                  + new_activity
                  + text[match.end():]
              )


          else:

              application_end = text.find(
                  "</application>"
              )


              if application_end < 0:

                  raise SystemExit(
                      "ERRO: </application> não encontrado."
                  )


              text = (
                  text[:application_end]
                  + new_activity
                  + "\n"
                  + text[application_end:]
              )


          path.write_text(
              text,
              encoding="utf-8"
          )


          print(
              "AndroidManifest configurado com sucesso."
          )

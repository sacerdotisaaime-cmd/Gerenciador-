              @PluginMethod
              public void openSettings(
                  PluginCall call
              ) {

                  try {

                      Intent intent =
                          new Intent(
                              android.provider.Settings
                                  .ACTION_APPLICATION_DETAILS_SETTINGS
                          );

                      intent.setData(
                          Uri.parse(
                              "package:"
                              + getContext()
                                  .getPackageName()
                          )
                      );

                      getActivity()
                          .startActivity(intent);

                      call.resolve();

                  } catch (Exception e) {

                      call.reject(
                          "SETTINGS_ERROR",
                          e.getMessage()
                      );
                  }
              }
          }

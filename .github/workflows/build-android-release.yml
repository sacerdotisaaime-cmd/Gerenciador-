      - name: Validar permissões do APK
        shell: bash
        run: |
          set -e

          APK="$APK_PATH"

          AAPT=$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt |
            sort -V |
            tail -n 1
          )

          test -n "$AAPT" || {
            echo "ERRO: aapt não encontrado."
            exit 1
          }

          "$AAPT" \
            dump permissions \
            "$APK" |
            tee /tmp/apk-permissions.txt

          for PERM in READ_CONTACTS WRITE_CONTACTS RECORD_AUDIO CAMERA; do

            FULL="android.permission.$PERM"

            grep -q \
              "$FULL" \
              /tmp/apk-permissions.txt || {
                echo "ERRO: $FULL não está no APK."
                exit 1
              }

            echo "OK NO APK: $FULL"
          done

          FINAL_MANIFEST=/tmp/final-v120-manifest.txt

          "$AAPT" \
            dump xmltree \
            "$APK" \
            AndroidManifest.xml |
            tee "$FINAL_MANIFEST" >/dev/null

          grep -q \
            'launchMode.*singleTask' \
            "$FINAL_MANIFEST" || {
              echo "ERRO: launchMode=singleTask não encontrado no APK."
              exit 1

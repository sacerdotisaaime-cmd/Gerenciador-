            private AuthorizationRequest driveAuthorizationRequest() { return AuthorizationRequest.builder().setRequestedScopes(Collections.singletonList(new Scope(DRIVE_SCOPE))).build(); }

            private String diagnosticMessage(Throwable error) {
              if (error == null) return "Erro desconhecido.";
              StringBuilder out = new StringBuilder();
              if (error instanceof ApiException) {
                ApiException api = (ApiException) error;
                out.append("ApiException status=").append(api.getStatusCode());
                String status = CommonStatusCodes.getStatusCodeString(api.getStatusCode());
                if (status != null) out.append(" (").append(status).append(")");
                out.append("; ");
              }
              if (error.getMessage() != null && !error.getMessage().isEmpty()) out.append(error.getMessage());
              else out.append(error.getClass().getName());
              Throwable cause = error.getCause();
              if (cause != null && cause != error) out.append(" | cause: ").append(cause.getClass().getSimpleName()).append(": ").append(String.valueOf(cause.getMessage()));
              return out.toString();
            }

            private JSObject diagnosticResult(String code, String phase, String message, Throwable error) {
              JSObject r = new JSObject();
              r.put("authorized", false);
              r.put("code", code);
              r.put("phase", phase);
              r.put("message", message == null ? "Falha ao conectar ao Google Drive." : message);
              if (error != null) r.put("details", diagnosticMessage(error));
              return r;
            }

            @PluginMethod public void connectGoogleDrive(PluginCall call) {
              try {
                Identity.getAuthorizationClient(getActivity()).authorize(driveAuthorizationRequest())
                  .addOnSuccessListener(result -> handleAuthorizationResult(result, call, true))
                  .addOnFailureListener(error -> {
                    JSObject r = diagnosticResult(error instanceof ApiException ? "GMS_" + ((ApiException) error).getStatusCode() : "GOOGLE_AUTH_FAILED", "authorize", "O Google recusou ou não conseguiu iniciar a autorização do Drive.", error);
                    call.resolve(r);
                  });
              } catch (Exception error) {
                call.resolve(diagnosticResult("NATIVE_EXCEPTION", "authorize-start", "Falha ao iniciar a autorização nativa do Google.", error));
              }
            }

            private void handleAuthorizationResult(AuthorizationResult result, PluginCall call, boolean allowResolution) {
              if(result.hasResolution()) {
                if(!allowResolution){ JSObject r=diagnosticResult("NEEDS_USER_ACTION", "authorize-result", "A autorização do Google precisa ser concluída pelo usuário.", null); r.put("needsUserAction",true); call.resolve(r); return; }
                pendingGoogleAuthCall=call;
                try {
                  PendingIntent pending=result.getPendingIntent();
                  if (pending == null) throw new IllegalStateException("O Google informou que precisa de resolução, mas não retornou PendingIntent.");
                  getActivity().startIntentSenderForResult(pending.getIntentSender(),GOOGLE_AUTH_REQUEST_CODE,null,0,0,0);
                } catch(Exception ex){
                  pendingGoogleAuthCall=null;
                  call.resolve(diagnosticResult("GOOGLE_AUTH_UI_FAILED", "open-resolution", "Não foi possível abrir a tela de autorização do Google.", ex));
                }
                return;
              }
              String token=result.getAccessToken();
              if(token==null||token.isEmpty()){call.resolve(diagnosticResult("GOOGLE_TOKEN_EMPTY", "authorize-result", "O Google não retornou um token de acesso.", null));return;}
              googleAccessToken=token;
              googleAccountEmail=null;
              JSObject r=new JSObject();r.put("authorized",true);call.resolve(r);
            }

            public static boolean handleGoogleAuthorizationResult(int requestCode, int resultCode, Intent data) {
              if(instance==null || requestCode!=GOOGLE_AUTH_REQUEST_CODE) return false;
              PluginCall call=instance.pendingGoogleAuthCall; instance.pendingGoogleAuthCall=null;
              if(call==null) return true;
              if(resultCode!=android.app.Activity.RESULT_OK || data==null){call.resolve(instance.diagnosticResult("GOOGLE_AUTH_CANCELLED", "authorization-result", "A autorização do Google foi cancelada ou fechada.", null));return true;}
              try {
                AuthorizationResult result=Identity.getAuthorizationClient(instance.getActivity()).getAuthorizationResultFromIntent(data);
                String token=result.getAccessToken();
                if(token==null||token.isEmpty()){call.resolve(instance.diagnosticResult("GOOGLE_TOKEN_EMPTY", "authorization-result", "O Google não retornou um token de acesso.", null));return true;}
                instance.googleAccessToken=token;
                JSObject r=new JSObject();r.put("authorized",true);call.resolve(r);
              } catch(Exception ex){
                call.resolve(instance.diagnosticResult(ex instanceof ApiException ? "GMS_" + ((ApiException) ex).getStatusCode() : "GOOGLE_AUTH_RESULT_FAILED", "authorization-result", "Falha ao concluir a autorização do Google.", ex));
              }
              return true;
            }

            private String jsonEscape(String value){try{return JSONObject.quote(value==null?"":value);}catch(Exception e){return "\"\"";}}
            private String urlEncode(String value) throws Exception{return URLEncoder.encode(value,"UTF-8");}

            private InputStream openUriInputStream(Uri uri) throws Exception {
              if (uri == null) throw new IllegalArgumentException("URI nula");
              if ("file".equalsIgnoreCase(uri.getScheme())) return new FileInputStream(new File(uri.getPath()));
              InputStream input = getContext().getContentResolver().openInputStream(uri);
              if (input == null) throw new IllegalStateException("Não foi possível abrir o arquivo do backup.");
              return input;
            }

            private long uriLength(Uri uri) throws Exception {
              if (uri != null && "file".equalsIgnoreCase(uri.getScheme())) return new File(uri.getPath()).length();
              android.content.res.AssetFileDescriptor afd = getContext().getContentResolver().openAssetFileDescriptor(uri,"r");
              if (afd != null) { try { long len = afd.getLength(); if (len >= 0) return len; } finally { afd.close(); } }
              long total=0; byte[] buf=new byte[8192]; try(InputStream input=openUriInputStream(uri)){int n;while((n=input.read(buf))!=-1)total+=n;} return total;
            }

            private String http(String method,String urlString,String token,String contentType,byte[] body) throws Exception {
              HttpURLConnection c=(HttpURLConnection)new URL(urlString).openConnection();c.setRequestMethod(method);c.setConnectTimeout(30000);c.setReadTimeout(120000);c.setRequestProperty("Authorization","Bearer "+token);c.setRequestProperty("Accept","application/json");if(contentType!=null)c.setRequestProperty("Content-Type",contentType);if(body!=null){c.setDoOutput(true);c.setFixedLengthStreamingMode(body.length);try(OutputStream out=c.getOutputStream()){out.write(body);}}int code=c.getResponseCode();InputStream in=code>=200&&code<400?c.getInputStream():c.getErrorStream();ByteArrayOutputStream out=new ByteArrayOutputStream();if(in!=null){byte[] buf=new byte[8192];int n;while((n=in.read(buf))!=-1)out.write(buf,0,n);in.close();}String response=out.toString(StandardCharsets.UTF_8.name());if(code<200||code>=300)throw new IllegalStateException("Google Drive HTTP "+code+": "+response);return response; }

            private String findOrCreateFolder(String token,String name,String parentId) throws Exception {
              String q="name='"+name.replace("'","\'")+"' and mimeType='application/vnd.google-apps.folder' and trashed=false"+(parentId==null?" and 'root' in parents":" and '"+parentId+"' in parents");
              String url="https://www.googleapis.com/drive/v3/files?q="+urlEncode(q)+"&pageSize=10&fields=files(id,name,mimeType,parents,trashed)";
              JSONObject listed=new JSONObject(http("GET",url,token,null,null));JSONArray files=listed.optJSONArray("files");if(files!=null&&files.length()>0)return files.getJSONObject(0).getString("id");
              JSONObject meta=new JSONObject();meta.put("name",name);meta.put("mimeType","application/vnd.google-apps.folder");JSONArray parents=new JSONArray();if(parentId!=null)parents.put(parentId);meta.put("parents",parents);
              JSONObject created=new JSONObject(http("POST","https://www.googleapis.com/drive/v3/files?fields=id,name,mimeType,parents",token,"application/json; charset=UTF-8",meta.toString().getBytes(StandardCharsets.UTF_8)));return created.getString("id");
            }

            private JSONObject uploadResumable(String token,Uri uri,String fileName,String parentId) throws Exception {
              long length=uriLength(uri);
              String initUrl="https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,size,md5Checksum,createdTime,parents";
              JSONObject meta=new JSONObject();meta.put("name",fileName);meta.put("mimeType","application/zip");JSONArray parents=new JSONArray();parents.put(parentId);meta.put("parents",parents);
              HttpURLConnection init=(HttpURLConnection)new URL(initUrl).openConnection();init.setRequestMethod("POST");init.setDoOutput(true);init.setConnectTimeout(30000);init.setReadTimeout(120000);init.setRequestProperty("Authorization","Bearer "+token);init.setRequestProperty("Content-Type","application/json; charset=UTF-8");init.setRequestProperty("X-Upload-Content-Type","application/zip");init.setRequestProperty("X-Upload-Content-Length",String.valueOf(length));byte[] metaBytes=meta.toString().getBytes(StandardCharsets.UTF_8);init.setFixedLengthStreamingMode(metaBytes.length);try(OutputStream out=init.getOutputStream()){out.write(metaBytes);}int initCode=init.getResponseCode();String session=init.getHeaderField("Location");if(initCode<200||initCode>=300||session==null)throw new IllegalStateException("Não foi possível iniciar o upload retomável do Drive (HTTP "+initCode+").");
              final int chunkSize=410241024;long offset=0;try(InputStream input=openUriInputStream(uri)){byte[] buffer=new byte[chunkSize];int read;while((read=readChunk(input,buffer))>0){long end=offset+read-1;HttpURLConnection put=(HttpURLConnection)new URL(session).openConnection();put.setRequestMethod("PUT");put.setDoOutput(true);put.setConnectTimeout(30000);put.setReadTimeout(180000);put.setRequestProperty("Content-Length",String.valueOf(read));put.setRequestProperty("Content-Range","bytes "+offset+"-"+end+"/"+length);put.setFixedLengthStreamingMode(read);try(OutputStream out=put.getOutputStream()){out.write(buffer,0,read);}int code=put.getResponseCode();if(code==308){String range=put.getHeaderField("Range");if(range!=null&&range.contains("-")){String tail=range.substring(range.lastIndexOf('-')+1);offset=Long.parseLong(tail)+1;}else offset=end+1;}else if(code==200||code==201){InputStream done=put.getInputStream();ByteArrayOutputStream out=new ByteArrayOutputStream();if(done!=null){byte[] b=new byte[8192];int n;while((n=done.read(b))!=-1)out.write(b,0,n);done.close();}return new JSONObject(out.toString(StandardCharsets.UTF_8.name()));}else{InputStream err=put.getErrorStream();ByteArrayOutputStream out=new ByteArrayOutputStream();if(err!=null){byte[] b=new byte[8192];int n;while((n=err.read(b))!=-1)out.write(b,0,n);}throw new IllegalStateException("Falha no upload do Drive (HTTP "+code+"): "+out.toString(StandardCharsets.UTF_8.name()));}}}throw new IllegalStateException("Upload do Drive terminou sem confirmação.");
            }

            private int readChunk(InputStream input,byte[] buffer) throws Exception{int total=0;while(total<buffer.length){int n=input.read(buffer,total,buffer.length-total);if(n<0)break;if(n==0)continue;total+=n;}return total;}

            private JSONObject getDriveFile(String token,String id) throws Exception {return new JSONObject(http("GET","https://www.googleapis.com/drive/v3/files/"+urlEncode(id)+"?fields=id,name,size,md5Checksum,parents,trashed",token,null,null));}

            private int rotateDriveBackups(String token,String folderId,String keepId) throws Exception {
              String q="'"+folderId+"' in parents and trashed=false and mimeType!='application/vnd.google-apps.folder'";
              String url="https://www.googleapis.com/drive/v3/files?q="+urlEncode(q)+"&pageSize=100&orderBy=createdTime&fields=files(id,name,size,createdTime,trashed)";
              JSONObject listed=new JSONObject(http("GET",url,token,null,null));JSONArray files=listed.optJSONArray("files");if(files==null)return 0;int deleted=0;while(files.length()>5){JSONObject oldest=files.getJSONObject(0);if(oldest.getString("id").equals(keepId)){oldest=files.getJSONObject(1);}String id=oldest.getString("id");http("DELETE","https://www.googleapis.com/drive/v3/files/"+urlEncode(id),token,null,null);deleted++;JSONArray next=new JSONArray();for(int i=0;i<files.length();i++)if(!files.getJSONObject(i).getString("id").equals(id))next.put(files.getJSONObject(i));files=next;}return deleted;
            }

            @PluginMethod public void uploadBackupToGoogleDrive(PluginCall call) {
              String uriString=call.getString("uri","");String fileName=call.getString("fileName","gestao-sacerdotista-aime-backup.zip");if(uriString.isEmpty()){call.reject("DRIVE_URI_MISSING","Arquivo de backup não informado.");return;}
              if(googleAccessToken==null||googleAccessToken.isEmpty()){
                Identity.getAuthorizationClient(getActivity()).authorize(driveAuthorizationRequest()).addOnSuccessListener(result->{ if(result.hasResolution()){JSObject r=new JSObject();r.put("ok",false);r.put("needsAuthorization",true);r.put("message","Conecte o Google Drive antes de enviar o backup.");call.resolve(r);return;} googleAccessToken=result.getAccessToken(); if(googleAccessToken==null||googleAccessToken.isEmpty()){call.reject("DRIVE_TOKEN_EMPTY","Token do Google Drive vazio.");return;} performDriveUpload(call,Uri.parse(uriString),fileName,googleAccessToken); }).addOnFailureListener(e->call.reject("DRIVE_AUTH_FAILED",e.getMessage()==null?"Falha ao autorizar o Drive":e.getMessage()));
                return;
              }
              performDriveUpload(call,Uri.parse(uriString),fileName,googleAccessToken);
            }

            private void performDriveUpload(PluginCall call,Uri uri,String fileName,String token){driveExecutor.execute(()->{try{String root=findOrCreateFolder(token,"Gestão Sacerdotista Aimê",null);String backups=findOrCreateFolder(token,"Backups",root);JSONObject uploaded=uploadResumable(token,uri,fileName,backups);String id=uploaded.getString("id");JSONObject verified=getDriveFile(token,id);long localSize=uriLength(uri);long remoteSize=Long.parseLong(verified.optString("size","-1"));if(remoteSize!=localSize)throw new IllegalStateException("Validação do Drive falhou: tamanho local e remoto diferentes.");int deleted=rotateDriveBackups(token,backups,id);JSObject result=new JSObject();result.put("ok",true);result.put("fileId",id);result.put("folderId",backups);result.put("fileName",verified.optString("name",fileName));result.put("size",remoteSize);result.put("deleted",deleted);call.resolve(result);}catch(Exception ex){call.reject("DRIVE_UPLOAD_FAILED",ex.getMessage()==null?"Falha ao enviar o backup para o Google Drive":ex.getMessage());}});}
          }

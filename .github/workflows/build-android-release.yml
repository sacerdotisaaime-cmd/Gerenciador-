      - name: Gerar APK RELEASE
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew assembleRelease --no-daemon

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK release não encontrado."

            find \
              "$PROJECT_DIR/android" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Validar APK
        shell: bash
        run: |
          set -e

          APK="$APK_PATH"

          AAPT=$(
            find \
              "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt |
              sort -V |
              tail -n 1
          )

          test -n "$AAPT" || {
            echo "ERRO: aapt não encontrado."
            exit 1
          }

          "$AAPT" dump permissions "$APK"

          FINAL_MANIFEST="/tmp/final-manifest.txt"

          "$AAPT" dump xmltree \
            "$APK" \
            AndroidManifest.xml |
            tee "$FINAL_MANIFEST" >/dev/null


          grep -q \
            'audio/\*' \
            "$FINAL_MANIFEST" || {
              echo "ERRO: audio/* não encontrado no APK."
              exit 1
            }


          grep -q \
            'android.intent.action.SEND' \
            "$FINAL_MANIFEST" || {
              echo "ERRO: ACTION_SEND não encontrado."
              exit 1
            }


          grep -q \
            'android.intent.action.SEND_MULTIPLE' \
            "$FINAL_MANIFEST" || {
              echo "ERRO: ACTION_SEND_MULTIPLE não encontrado."
              exit 1
            }


          grep -q \
            'grantUriPermissions' \
            "$FINAL_MANIFEST" || {
              echo "ERRO: grantUriPermissions não encontrado."
              exit 1
            }


          echo "OK: APK contém suporte ao compartilhamento Android."

      - name: Validar assinatura
        shell: bash
        run: |
          set -e

          APK="$APK_PATH"

          APKSIGNER=$(
            find \
              "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner |
              sort -V |
              tail -n 1
          )

          test -n "$APKSIGNER" || {
            echo "ERRO: apksigner não encontrado."
            exit 1
          }

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: gestao-sacerdotista-aime-v120-whatsapp-audio-share
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 1

      - name: Limpar assinatura temporária
        if: always()
        shell: bash
        run: |
          rm -f \
            "$PROJECT_DIR/android/app/release-key.jks" \
            2>/dev/null || true

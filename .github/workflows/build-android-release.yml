          python3 - "$APP_GRADLE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.31.0"', text, count=1)

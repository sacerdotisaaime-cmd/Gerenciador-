      - name: Configurar compartilhamento Android
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import re
          import sys

          manifest = Path(sys.argv[1])

          text = manifest.read_text()

          permissions = [
              "android.permission.READ_CONTACTS",
              "android.permission.WRITE_CONTACTS",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
          ]

          if "<application" not in text:
              raise SystemExit(
                  "ERRO: <application> não encontrado."
              )

          for permission in permissions:

              if (
                  f'android:name="{permission}"'
                  not in text
              ):

                  text = text.replace(
                      "<application",
                      (
                          f'    <uses-permission '
                          f'android:name="{permission}" />\n'
                          "<application"
                      ),
                      1
                  )


          activity_marker = 'android:name=".MainActivity"'


          if activity_marker not in text:

              raise SystemExit(
                  "ERRO: MainActivity não encontrada "
                  "no AndroidManifest.xml."
              )


          marker_pos = text.find(
              activity_marker
          )


          activity_start = text.rfind(
              "<activity",
              0,
              marker_pos
          )


          activity_end = text.find(
              "</activity>",
              activity_start
          )


          if (
              activity_start < 0 or
              activity_end < 0
          ):

              raise SystemExit(
                  "ERRO: bloco da MainActivity "
                  "não encontrado."
              )


          activity_block = text[
              activity_start:
              activity_end
          ]


          activity_block = re.sub(
              r'\s+android:exported="[^"]*"',
              '',
              activity_block
          )


          activity_block = re.sub(
              r'\s+android:grantUriPermissions="[^"]*"',
              '',
              activity_block
          )


          activity_block = re.sub(
              r'\s+android:launchMode="[^"]*"',
              '',
              activity_block
          )


          activity_block = activity_block.replace(
              "<activity",
              (
                  '<activity '
                  'android:exported="true" '
                  'android:grantUriPermissions="true" '
                  'android:launchMode="singleTask"'
              ),
              1
          )


          activity_block = re.sub(
              r'\s*<intent-filter>\s*'
              r'<action android:name="android.intent.action.SEND" />'
              r'.*?</intent-filter>',
              '',
              activity_block,
              flags=re.S
          )


          activity_block = re.sub(
              r'\s*<intent-filter>\s*'
              r'<action android:name="android.intent.action.SEND_MULTIPLE" />'
              r'.*?</intent-filter>',
              '',
              activity_block,
              flags=re.S
          )


          intent_filters = """
          <intent-filter>
            <action android:name="android.intent.action.SEND" />
            <category android:name="android.intent.category.DEFAULT" />
            <data android:mimeType="audio/*" />
          </intent-filter>

          <intent-filter>
            <action android:name="android.intent.action.SEND_MULTIPLE" />
            <category android:name="android.intent.category.DEFAULT" />
            <data android:mimeType="audio/*" />
          </intent-filter>

          <intent-filter>
            <action android:name="android.intent.action.SEND" />
            <category android:name="android.intent.category.DEFAULT" />
            <data android:mimeType="image/*" />
          </intent-filter>

          <intent-filter>
            <action android:name="android.intent.action.SEND_MULTIPLE" />
            <category android:name="android.intent.category.DEFAULT" />
            <data android:mimeType="image/*" />
          </intent-filter>

          <intent-filter>
            <action android:name="android.intent.action.SEND" />
            <category android:name="android.intent.category.DEFAULT" />
            <data android:mimeType="*/*" />
          </intent-filter>

          <intent-filter>
            <action android:name="android.intent.action.SEND_MULTIPLE" />
            <category android:name="android.intent.category.DEFAULT" />
            <data android:mimeType="*/*" />
          </intent-filter>
          """


          activity_block += intent_filters


          text = (
              text[:activity_start]
              + activity_block
              + text[activity_end:]
          )


          manifest.write_text(text)

          print(
              "OK: Manifest configurado "
              "para compartilhamento Android."
          )
          PY

      - name: Preparar assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          KEYSTORE="$PROJECT_DIR/android/app/release-key.jks"

          printf '%s' \
            "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          chmod 600 "$KEYSTORE"

          echo "Keystore preparada."

      - name: Configurar assinatura do APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/android/app/build.gradle"

          test -f "$APP_GRADLE" || {
            echo "ERRO: build.gradle não encontrado."
            exit 1
          }

          grep -q "signingConfigs" "$APP_GRADLE" || {
            echo "ERRO: o projeto Android não possui signingConfigs."
            echo "Mantendo a estrutura original do projeto."
          }

          keytool -list \
            -keystore "$PROJECT_DIR/android/app/release-key.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          echo "Keystore e alias validados."


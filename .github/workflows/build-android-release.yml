          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          if "com.google.android.gms:play-services-auth:21.6.0" not in text:
              if "dependencies {" in text:
                  text = text.replace("dependencies {", "dependencies {\n    implementation 'com.google.android.gms:play-services-auth:21.6.0'", 1)
              else:
                  text += "\ndependencies { implementation 'com.google.android.gms:play-services-auth:21.6.0' }\n"

          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.43.0"', text, count=1)
          text = re.sub(r'versionCode\s+\d+', 'versionCode 143', text, count=1)

          if 'signingConfigs {' not in text:
              signing = '''
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              '''
              text = text.replace('android {', 'android {' + signing, 1)
          elif 'signingConfigs.release' not in text:
              text = text.replace('signingConfigs {', '''signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              ''', 1)

          build_types = re.search(r'buildTypes\s*\{', text)
          if not build_types:
              text += '''
              \nbuildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              '''
          else:
              tail = text[build_types.end():]
              release = re.search(r'release\s*\{', tail)
              if not release:
                  pos = build_types.end()
                  text = text[:pos] + '''
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
                  ''' + text[pos:]
              elif 'signingConfig signingConfigs.release' not in tail[release.end():release.end()+2500]:
                  pos = build_types.end() + release.end()
                  text = text[:pos] + '''
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  ''' + text[pos:]

          path.write_text(text)
          PY


name: Build Android APK - V120 - WHATSAPP AUDIO SHARE - FIXED

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: MARCADOR - V120 INICIADO
        shell: bash
        run: |
          echo "=================================================="
          echo " GESTÃO SACERDOTISTA AIMÊ - V120"
          echo " WHATSAPP AUDIO SHARE"
          echo "=================================================="
          echo "Commit: $GITHUB_SHA"
          echo "Run: $GITHUB_RUN_NUMBER"
          echo "=================================================="


      # ============================================================
      # 2. NODE
      # ============================================================

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 3. JAVA
      # ============================================================

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      # ============================================================
      # 4. SECRETS
      # ============================================================

      - name: Validar secrets de assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERRO: ANDROID_KEYSTORE_BASE64 vazio"
            exit 1
          }

          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "ERRO: ANDROID_KEYSTORE_PASSWORD vazio"
            exit 1
          }

          test -n "$ANDROID_KEY_ALIAS" || {
            echo "ERRO: ANDROID_KEY_ALIAS vazio"
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "ERRO: ANDROID_KEY_PASSWORD vazio"
            exit 1
          }

          echo "Secrets de assinatura OK."


      # ============================================================
      # 5. ENCONTRAR ZIP
      # ============================================================

      - name: Encontrar ZIP do projeto
        shell: bash
        run: |
          set -e

          mapfile -t ZIPS < <(
            find . \
              -maxdepth 2 \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | sort
          )

          COUNT="${#ZIPS[@]}"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERRO: nenhum ZIP encontrado."
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "ERRO: mais de um ZIP encontrado:"
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIPS[0]}"

          echo "ZIP:"
          echo "$ZIP_FILE"

          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 6. DESCOMPACTAR
      # ============================================================

      - name: Descompactar projeto
        shell: bash
        run: |
          set -e

          rm -rf app
          mkdir -p app

          unzip -q "$ZIP_FILE" -d app

          echo "Projeto descompactado."


      # ============================================================
      # 7. LOCALIZAR PROJETO
      # ============================================================

      - name: Localizar projeto
        shell: bash
        run: |
          set -e

          PROJECT_PACKAGE=$(
            find app \
              -name package.json \
              -not -path "*/node_modules/*" \
              -print \
              | head -n 1
          )

          if [ -z "$PROJECT_PACKAGE" ]; then
            echo "ERRO: package.json não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_PACKAGE")"

          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 8. DEPENDÊNCIAS
      # ============================================================

      - name: Ajustar dependências
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          node <<'NODE'
          const fs = require("fs");

          const file = "package.json";

          const pkg = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          const deps =
            pkg.dependencies ||
            (pkg.dependencies = {});

          deps["@capacitor/core"] = "^7.4.3";
          deps["@capacitor/android"] = "^7.4.3";
          deps["@capacitor/camera"] = "^7.0.5";
          deps["@capacitor/share"] = "^7.0.2";
          deps["@capacitor/filesystem"] = "^7.0.2";
          deps["@capacitor-community/contacts"] = "7.2.0";
          deps["capacitor-voice-recorder"] = "7.0.6";
          deps["@capacitor/barcode-scanner"] = "2.0.4";

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + "\n"
          );
          NODE

          rm -rf node_modules
          rm -f package-lock.json

          echo "Dependências ajustadas."


      # ============================================================
      # 9. NPM INSTALL
      # ============================================================

      - name: Instalar dependências
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npm install

          npm install -D @capacitor/cli@7.4.3

          echo "Dependências instaladas."


      # ============================================================
      # 10. BUILD WEB
      # ============================================================

      - name: Compilar aplicação web
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx vite build

          echo "Build web concluído."


      # ============================================================
      # 11. ANDROID
      # ============================================================

      - name: Adicionar Android
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap add android

          echo "Android adicionado."


      # ============================================================
      # 12. SDK
      # ============================================================

      - name: Ajustar SDK Android
        shell: bash
        run: |
          set -e

          VARIABLES="$PROJECT_DIR/android/variables.gradle"

          if [ -f "$VARIABLES" ]; then
            sed -i \
              's/minSdkVersion = [0-9]*/minSdkVersion = 26/' \
              "$VARIABLES"
          fi

          echo "SDK Android configurado."


      # ============================================================
      # 13. CAPACITOR SYNC
      # ============================================================

      - name: Sincronizar Capacitor
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap sync android

          echo "Capacitor sincronizado."


      # ============================================================
      # 14. PERMISSION BRIDGE
      # ============================================================

      - name: Criar PermissionBridge
        shell: bash
        run: |
          set -e

          SRC="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao"

          mkdir -p "$SRC"

          cat > "$SRC/PermissionBridgePlugin.java" <<'JAVA'
          package com.sacerdotisaaime.gestao;

          import android.Manifest;
          import android.content.ClipData;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.OpenableColumns;
          import android.provider.Settings;
          import android.util.Base64;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.Locale;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;

          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;


          @CapacitorPlugin(
            name = "PermissionBridge",
            permissions = {
              @Permission(
                alias = "contacts",
                strings = {
                  Manifest.permission.READ_CONTACTS,
                  Manifest.permission.WRITE_CONTACTS
                }
              ),
              @Permission(
                alias = "microphone",
                strings = {
                  Manifest.permission.RECORD_AUDIO
                }
              )
            }
          )
          public class PermissionBridgePlugin extends Plugin {

            private static PermissionBridgePlugin instance;

            private static Intent pendingSharedIntent;

            private static boolean initialSyncClaimed = false;

            private static boolean sharedLaunch = false;

            private static final String INBOX_DIR =
              "shared-media-inbox";

            private static final long MAX_AUDIO_BYTES =
              50L * 1024L * 1024L;

            private static final long MAX_PHOTO_BYTES =
              20L * 1024L * 1024L;


            @Override
            public void load() {

              super.load();

              instance = this;

              Intent pending =
                pendingSharedIntent;

              pendingSharedIntent = null;

              if (pending != null) {
                handleSharedIntent(pending);
              }
            }


            private File inboxDir() {

              File dir =
                new File(
                  getContext().getFilesDir(),
                  INBOX_DIR
                );

              if (!dir.exists()) {
                dir.mkdirs();
              }

              return dir;
            }


            private String getMime(Uri uri) {

              try {

                return getContext()
                  .getContentResolver()
                  .getType(uri);

              } catch (Exception ignored) {

                return null;
              }
            }


            private String getDisplayName(Uri uri) {

              try {

                android.database.Cursor cursor =
                  getContext()
                    .getContentResolver()
                    .query(
                      uri,
                      new String[]{
                        OpenableColumns.DISPLAY_NAME
                      },
                      null,
                      null,
                      null
                    );

                if (cursor != null) {

                  try {

                    if (cursor.moveToFirst()) {
                      return cursor.getString(0);
                    }

                  } finally {
                    cursor.close();
                  }
                }

              } catch (Exception ignored) {
              }

              return null;
            }


            private String encode(String value) {

              if (value == null) {
                value = "";
              }

              return Base64.encodeToString(
                value.getBytes(
                  StandardCharsets.UTF_8
                ),
                Base64.URL_SAFE |
                Base64.NO_WRAP |
                Base64.NO_PADDING
              );
            }


            private String decode(String value) {

              try {

                return new String(
                  Base64.decode(
                    value,
                    Base64.URL_SAFE
                  ),
                  StandardCharsets.UTF_8
                );

              } catch (Exception ignored) {

                return "";
              }
            }


            private JSObject metadata(File file) {

              JSObject result =
                new JSObject();

              String[] parts =
                file.getName()
                  .split("__", -1);

              if (parts.length < 5) {
                return result;
              }

              result.put(
                "id",
                parts[0]
              );

              result.put(
                "mimeType",
                decode(parts[1])
              );

              result.put(
                "name",
                decode(parts[2])
              );

              result.put(
                "kind",
                parts[3]
              );

              result.put(
                "size",
                file.length()
              );

              result.put(
                "receivedAt",
                new SimpleDateFormat(
                  "yyyy-MM-dd'T'HH:mm:ss.SSSXXX",
                  Locale.US
                ).format(
                  new Date(
                    file.lastModified()
                  )
                )
              );

              return result;
            }


            private File findById(String id) {

              if (
                id == null ||
                id.trim().isEmpty()
              ) {
                return null;
              }

              File[] files =
                inboxDir().listFiles();

              if (files == null) {
                return null;
              }

              for (File file : files) {

                if (
                  file.getName()
                    .startsWith(id + "__")
                ) {
                  return file;
                }
              }

              return null;
            }


            // ========================================================
            // DETECÇÃO DE ARQUIVOS
            // ========================================================

            private boolean byteAt(
              byte[] data,
              int length,
              int index,
              int expected
            ) {

              if (
                index < 0 ||
                index >= length
              ) {
                return false;
              }

              return (data[index] & 0xff) ==
                (expected & 0xff);
            }


            private boolean signature(
              byte[] data,
              int length,
              int... values
            ) {

              if (
                length < values.length
              ) {
                return false;
              }

              for (
                int i = 0;
                i < values.length;
                i++
              ) {

                if (
                  !byteAt(
                    data,
                    length,
                    i,
                    values[i]
                  )
                ) {
                  return false;
                }
              }

              return true;
            }


            private String sniff(File file)
              throws Exception {

              byte[] h =
                new byte[64];

              int length = 0;


              try (
                InputStream input =
                  new FileInputStream(file)
              ) {

                while (
                  length < h.length
                ) {

                  int n =
                    input.read(
                      h,
                      length,
                      h.length - length
                    );

                  if (n < 0) {
                    break;
                  }

                  if (n == 0) {
                    continue;
                  }

                  length += n;
                }
              }


              // JPEG

              if (
                signature(
                  h,
                  length,
                  0xff,
                  0xd8,
                  0xff
                )
              ) {

                return "photo|image/jpeg";
              }


              // PNG

              if (
                signature(
                  h,
                  length,
                  0x89,
                  0x50,
                  0x4e,
                  0x47,
                  0x0d,
                  0x0a,
                  0x1a,
                  0x0a
                )
              ) {

                return "photo|image/png";
              }


              // WEBP

              if (
                length >= 12 &&
                signature(
                  h,
                  length,
                  0x52,
                  0x49,
                  0x46,
                  0x46
                ) &&
                byteAt(h, length, 8, 'W') &&
                byteAt(h, length, 9, 'E') &&
                byteAt(h, length, 10, 'B') &&
                byteAt(h, length, 11, 'P')
              ) {

                return "photo|image/webp";
              }


              // OGG / OPUS

              if (
                signature(
                  h,
                  length,
                  0x4f,
                  0x67,
                  0x67,
                  0x53
                )
              ) {

                return "audio|audio/ogg";
              }


              // WAV

              if (
                length >= 12 &&
                signature(
                  h,
                  length,
                  0x52,
                  0x49,
                  0x46,
                  0x46
                ) &&
                byteAt(h, length, 8, 'W') &&
                byteAt(h, length, 9, 'A') &&
                byteAt(h, length, 10, 'V') &&
                byteAt(h, length, 11, 'E')
              ) {

                return "audio|audio/wav";
              }


              // MP3 com ID3

              if (
                signature(
                  h,
                  length,
                  0x49,
                  0x44,
                  0x33
                )
              ) {

                return "audio|audio/mpeg";
              }


              // MP3 sem ID3

              if (
                length >= 2
              ) {

                int first =
                  h[0] & 0xff;

                int second =
                  h[1] & 0xff;

                if (
                  first == 0xff &&
                  (second & 0xe0) == 0xe0
                ) {

                  return "audio|audio/mpeg";
                }
              }


              // MP4 / M4A / HEIC

              if (
                length >= 12 &&
                byteAt(h, length, 4, 'f') &&
                byteAt(h, length, 5, 't') &&
                byteAt(h, length, 6, 'y') &&
                byteAt(h, length, 7, 'p')
              ) {

                String brand =
                  new String(
                    h,
                    8,
                    4,
                    StandardCharsets.US_ASCII
                  );


                if (
                  brand.equals("heic") ||
                  brand.equals("heix") ||
                  brand.equals("hevc") ||
                  brand.equals("hevx") ||
                  brand.equals("mif1") ||
                  brand.equals("msf1")
                ) {

                  return "photo|image/heic";
                }


                if (
                  brand.equals("M4A ") ||
                  brand.equals("M4B ")
                ) {

                  return "audio|audio/mp4";
                }
              }


              // WEBM / MATROSKA

              if (
                signature(
                  h,
                  length,
                  0x1a,
                  0x45,
                  0xdf,
                  0xa3
                )
              ) {

                return "audio|audio/webm";
              }


              return null;
            }


            private String extension(
              String mime,
              String name
            ) {

              String lower =
                name == null
                  ? ""
                  : name.toLowerCase(
                      Locale.US
                    );


              if (
                lower.matches(
                  ".*\\.(ogg|opus|m4a|aac|mp3|wav|amr|3gp|webm|mp4)$"
                )
              ) {

                return lower.substring(
                  lower.lastIndexOf('.') + 1
                );
              }


              if (
                mime != null &&
                mime.contains("ogg")
              ) {
                return "ogg";
              }


              if (
                mime != null &&
                mime.contains("mpeg")
              ) {
                return "mp3";
              }


              if (
                mime != null &&
                mime.contains("wav")
              ) {
                return "wav";
              }


              if (
                mime != null &&
                mime.contains("webm")
              ) {
                return "webm";
              }


              if (
                mime != null &&
                mime.contains("mp4")
              ) {
                return "m4a";
              }


              if (
                mime != null &&
                mime.contains("png")
              ) {
                return "png";
              }


              if (
                mime != null &&
                mime.contains("webp")
              ) {
                return "webp";
              }


              if (
                mime != null &&
                mime.contains("heic")
              ) {
                return "heic";
              }


              if (
                mime != null &&
                mime.contains("jpeg")
              ) {
                return "jpg";
              }


              return "bin";
            }


            // ========================================================
            // RECEBER MÍDIA
            // ========================================================

            private void receive(Uri uri) {

              if (uri == null) {
                return;
              }


              String mime =
                getMime(uri);

              String name =
                getDisplayName(uri);


              String lowerMime =
                mime == null
                  ? ""
                  : mime.toLowerCase(
                      Locale.US
                    );


              String lowerName =
                name == null
                  ? ""
                  : name.toLowerCase(
                      Locale.US
                    );


              boolean audioHint =
                lowerMime.startsWith("audio/") ||
                lowerName.matches(
                  ".*\\.(ogg|opus|m4a|aac|mp3|wav|amr|3gp|webm|mp4)$"
                );


              boolean photoHint =
                lowerMime.startsWith("image/") ||
                lowerName.matches(
                  ".*\\.(jpg|jpeg|png|webp|heic|gif)$"
                );


              long max =
                photoHint && !audioHint
                  ? MAX_PHOTO_BYTES
                  : MAX_AUDIO_BYTES;


              File temp =
                new File(
                  inboxDir(),
                  "media-temp-" +
                  System.currentTimeMillis() +
                  "-" +
                  Math.abs(
                    uri.toString().hashCode()
                  ) +
                  ".tmp"
                );


              long total = 0;


              try (
                InputStream input =
                  getContext()
                    .getContentResolver()
                    .openInputStream(uri);

                FileOutputStream output =
                  new FileOutputStream(temp)
              ) {

                if (input == null) {

                  throw new Exception(
                    "STREAM_UNAVAILABLE"
                  );
                }


                byte[] buffer =
                  new byte[8192];

                int read;


                while (
                  (read = input.read(buffer)) != -1
                ) {

                  total += read;


                  if (total > max) {

                    throw new Exception(
                      "MEDIA_TOO_LARGE"
                    );
                  }


                  output.write(
                    buffer,
                    0,
                    read
                  );
                }


                output.flush();


              } catch (Exception ex) {

                try {
                  temp.delete();
                } catch (Exception ignored) {
                }


                notifyError(
                  uri,
                  ex.getMessage() == null
                    ? "RECEIVE_FAILED"
                    : ex.getMessage()
                );

                return;
              }


              String detected = null;


              try {

                detected =
                  sniff(temp);

              } catch (Exception ignored) {
              }


              boolean audio =
                audioHint ||
                (
                  detected != null &&
                  detected.startsWith("audio|")
                );


              boolean photo =
                photoHint ||
                (
                  detected != null &&
                  detected.startsWith("photo|")
                );


              if (
                photo &&
                total > MAX_PHOTO_BYTES
              ) {

                temp.delete();

                notifyError(
                  uri,
                  "MEDIA_TOO_LARGE"
                );

                return;
              }


              if (!audio && !photo) {

                temp.delete();

                notifyError(
                  uri,
                  "UNRECOGNIZED_MEDIA"
                );

                return;
              }


              if (detected != null) {

                String[] parts =
                  detected.split(
                    "\\|",
                    2
                  );


                if (parts.length == 2) {

                  if (
                    mime == null ||
                    mime.trim().isEmpty() ||
                    mime.equals("*/*") ||
                    mime.equalsIgnoreCase(
                      "application/octet-stream"
                    )
                  ) {

                    mime =
                      parts[1];
                  }


                  if (
                    name == null ||
                    name.trim().isEmpty() ||
                    !name.contains(".")
                  ) {

                    name =
                      (
                        audio
                          ? "audio-whatsapp."
                          : "foto-whatsapp."
                      ) +
                      extension(
                        parts[1],
                        name
                      );
                  }
                }
              }


              if (
                mime == null ||
                mime.trim().isEmpty() ||
                mime.equals("*/*") ||
                mime.equalsIgnoreCase(
                  "application/octet-stream"
                )
              ) {

                mime =
                  audio
                    ? "audio/*"
                    : "image/*";
              }


              if (
                name == null ||
                name.trim().isEmpty()
              ) {

                name =
                  (
                    audio
                      ? "audio-whatsapp."
                      : "foto-whatsapp."
                  ) +
                  extension(
                    mime,
                    name
                  );
              }


              String id =
                "media-" +
                System.currentTimeMillis() +
                "-" +
                Math.abs(
                  (
                    uri.toString() +
                    total
                  ).hashCode()
                );


              File output =
                new File(
                  inboxDir(),
                  id +
                  "__" +
                  encode(mime) +
                  "__" +
                  encode(name) +
                  "__" +
                  (
                    audio
                      ? "audio"
                      : "photo"
                  ) +
                  "__1.bin"
                );


              if (
                !temp.renameTo(output)
              ) {

                try (
                  FileInputStream input =
                    new FileInputStream(temp);

                  FileOutputStream out =
                    new FileOutputStream(output)
                ) {

                  byte[] buffer =
                    new byte[8192];

                  int read;


                  while (
                    (read = input.read(buffer)) != -1
                  ) {

                    out.write(
                      buffer,
                      0,
                      read
                    );
                  }
                }


                temp.delete();
              }


              JSObject event =
                metadata(output);


              event.put(
                "ok",
                true
              );


              if (instance != null) {

                instance.notifyListeners(
                  "sharedMedia",
                  event
                );
              }
            }


            private void notifyError(
              Uri uri,
              String code
            ) {

              if (instance == null) {
                return;
              }


              JSObject event =
                new JSObject();


              event.put(
                "ok",
                false
              );


              event.put(
                "code",
                code
              );


              event.put(
                "uri",
                uri == null
                  ? ""
                  : uri.toString()
              );


              instance.notifyListeners(
                "sharedMediaError",
                event
              );
            }


            // ========================================================
            // WHATSAPP / ANDROID SHARE
            // ========================================================

            public static void handleSharedIntent(
              Intent intent
            ) {

              if (intent == null) {
                return;
              }


              String action =
                intent.getAction();


              if (
                !Intent.ACTION_SEND.equals(action) &&
                !Intent.ACTION_SEND_MULTIPLE.equals(action)
              ) {

                return;
              }


              if (instance == null) {

                pendingSharedIntent =
                  new Intent(intent);

                return;
              }


              sharedLaunch = true;


              try {

                ArrayList<Uri> received =
                  new ArrayList<>();


                // ----------------------------------------------------
                // CLIPDATA
                // ----------------------------------------------------

                ClipData clip =
                  intent.getClipData();


                if (clip != null) {

                  for (
                    int i = 0;
                    i < clip.getItemCount();
                    i++
                  ) {

                    Uri uri =
                      clip.getItemAt(i).getUri();


                    if (
                      uri != null &&
                      !received.contains(uri)
                    ) {

                      received.add(uri);
                    }
                  }
                }


                // ----------------------------------------------------
                // SEND_MULTIPLE
                // ----------------------------------------------------

                if (
                  Intent.ACTION_SEND_MULTIPLE.equals(
                    action
                  )
                ) {

                  ArrayList<Uri> uris =
                    intent.getParcelableArrayListExtra(
                      Intent.EXTRA_STREAM
                    );


                  if (uris != null) {

                    for (Uri uri : uris) {

                      if (
                        uri != null &&
                        !received.contains(uri)
                      ) {

                        received.add(uri);
                      }
                    }
                  }


                } else {

                  // --------------------------------------------------
                  // SEND
                  // --------------------------------------------------

                  Uri uri = null;


                  try {

                    uri =
                      intent.getParcelableExtra(
                        Intent.EXTRA_STREAM
                      );

                  } catch (Exception ignored) {
                  }


                  if (
                    uri != null &&
                    !received.contains(uri)
                  ) {

                    received.add(uri);
                  }
                }


                // ----------------------------------------------------
                // PROCESSAR TODAS AS MÍDIAS
                // ----------------------------------------------------

                for (Uri uri : received) {

                  instance.receive(uri);
                }


              } catch (Exception ex) {

                instance.notifyError(
                  null,
                  "SHARED_INTENT_ERROR"
                );
              }
            }



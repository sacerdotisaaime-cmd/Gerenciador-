name: Build Android APK - V119 - RELEASE - AUDIO PHOTO SHARE

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ============================================================
      # 1. BAIXAR PROJETO
      # ============================================================
      - name: Baixar projeto
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE
      # ============================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 3. JAVA
      # ============================================================
      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      # ============================================================
      # 4. VALIDAR SECRETS
      # ============================================================
      - name: Validar secrets de assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERRO: ANDROID_KEYSTORE_BASE64 vazio."
            exit 1
          }

          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "ERRO: ANDROID_KEYSTORE_PASSWORD vazio."
            exit 1
          }

          test -n "$ANDROID_KEY_ALIAS" || {
            echo "ERRO: ANDROID_KEY_ALIAS vazio."
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "ERRO: ANDROID_KEY_PASSWORD vazio."
            exit 1
          }

          echo "OK: secrets de assinatura reconhecidas."


      # ============================================================
      # 5. ENCONTRAR ZIP
      # ============================================================
      - name: Encontrar ZIP do projeto
        shell: bash
        run: |
          set -e

          mapfile -t ZIPS < <(
            find . \
              -maxdepth 2 \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | sort
          )

          COUNT="${#ZIPS[@]}"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERRO: nenhum ZIP encontrado."
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "ERRO: existem vários ZIPs."
            echo "Deixe somente o ZIP da versão que será compilada."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIPS[0]}"

          echo "ZIP selecionado:"
          echo "$ZIP_FILE"

          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 6. DESCOMPACTAR
      # ============================================================
      - name: Descompactar projeto
        shell: bash
        run: |
          set -e

          rm -rf app
          mkdir -p app

          unzip -q "$ZIP_FILE" -d app


      # ============================================================
      # 7. LOCALIZAR PROJETO
      # ============================================================
      - name: Localizar projeto
        shell: bash
        run: |
          set -e

          PROJECT_PACKAGE=$(
            find app \
              -name package.json \
              -not -path "*/node_modules/*" \
              -print \
              | head -n 1
          )

          if [ -z "$PROJECT_PACKAGE" ]; then
            echo "ERRO: package.json não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_PACKAGE")

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 8. AJUSTAR DEPENDÊNCIAS
      # ============================================================
      - name: Ajustar dependências
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          node <<'NODE'
          const fs = require('fs');

          const file = 'package.json';

          const pkg = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          const deps =
            pkg.dependencies ||
            (pkg.dependencies = {});

          deps['@capacitor/core'] = '^7.4.3';
          deps['@capacitor/android'] = '^7.4.3';
          deps['@capacitor/camera'] = '^7.0.5';
          deps['@capacitor/share'] = '^7.0.2';
          deps['@capacitor/filesystem'] = '^7.0.2';
          deps['@capacitor-community/contacts'] = '7.2.0';
          deps['capacitor-voice-recorder'] = '7.0.6';
          deps['@capacitor/barcode-scanner'] = '2.0.4';

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + '\n'
          );
          NODE

          rm -rf node_modules
          rm -f package-lock.json


      # ============================================================
      # 9. INSTALAR
      # ============================================================
      - name: Instalar dependências
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npm install

          npm install -D @capacitor/cli@7.4.3


      # ============================================================
      # 10. BUILD WEB
      # ============================================================
      - name: Compilar aplicação web
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx vite build


      # ============================================================
      # 11. ADICIONAR ANDROID
      # ============================================================
      - name: Adicionar Android
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap add android


      # ============================================================
      # 12. SDK MÍNIMO
      # ============================================================
      - name: Ajustar SDK Android
        shell: bash
        run: |
          set -e

          VARIABLES="$PROJECT_DIR/android/variables.gradle"

          if [ -f "$VARIABLES" ]; then
            sed -i \
              's/minSdkVersion = [0-9]*/minSdkVersion = 26/' \
              "$VARIABLES"
          fi


      # ============================================================
      # 13. SINCRONIZAR CAPACITOR
      # ============================================================
      - name: Sincronizar Capacitor
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap sync android


      # ============================================================
      # 14. CRIAR PERMISSION BRIDGE
      # ============================================================
      - name: Criar PermissionBridge
        shell: bash
        run: |
          set -e

          ANDROID_SRC="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao"

          mkdir -p "$ANDROID_SRC"

          cat > "$ANDROID_SRC/PermissionBridgePlugin.java" <<'JAVA'
          package com.sacerdotisaaime.gestao;

          import android.Manifest;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.OpenableColumns;
          import android.provider.Settings;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.List;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;

          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
            name = "PermissionBridge",
            permissions = {
              @Permission(
                alias = "contacts",
                strings = {
                  Manifest.permission.READ_CONTACTS,
                  Manifest.permission.WRITE_CONTACTS
                }
              ),
              @Permission(
                alias = "microphone",
                strings = {
                  Manifest.permission.RECORD_AUDIO
                }
              )
            }
          )
          public class PermissionBridgePlugin extends Plugin {

            private static PermissionBridgePlugin instance;

            private static Intent pendingSharedIntent;

            private static final String INBOX_DIR =
              "shared-media-inbox";

            private static final long MAX_AUDIO_BYTES =
              50L * 1024L * 1024L;

            private static final long MAX_PHOTO_BYTES =
              20L * 1024L * 1024L;


            @Override
            public void load() {

              super.load();

              instance = this;

              Intent pending =
                pendingSharedIntent;

              pendingSharedIntent = null;

              if (pending != null) {
                handleSharedIntent(pending);
              }
            }


            private File inboxDir() {

              File dir =
                new File(
                  getContext().getFilesDir(),
                  INBOX_DIR
                );

              if (!dir.exists()) {
                dir.mkdirs();
              }

              return dir;
            }


            private String typeFor(Uri uri) {

              try {

                return getContext()
                  .getContentResolver()
                  .getType(uri);

              } catch (Exception ignored) {

                return null;
              }
            }


            private String displayName(Uri uri) {

              try {

                android.database.Cursor cursor =
                  getContext()
                    .getContentResolver()
                    .query(
                      uri,
                      new String[]{
                        OpenableColumns.DISPLAY_NAME
                      },
                      null,
                      null,
                      null
                    );

                if (cursor != null) {

                  try {

                    if (cursor.moveToFirst()) {
                      return cursor.getString(0);
                    }

                  } finally {

                    cursor.close();
                  }
                }

              } catch (Exception ignored) {
              }

              return null;
            }


            private String b64(String value) {

              return android.util.Base64
                .encodeToString(
                  (
                    value == null
                      ? ""
                      : value
                  ).getBytes(
                    java.nio.charset.StandardCharsets.UTF_8
                  ),
                  android.util.Base64.URL_SAFE |
                  android.util.Base64.NO_WRAP |
                  android.util.Base64.NO_PADDING
                );
            }


            private String unb64(String value) {

              try {

                return new String(
                  android.util.Base64.decode(
                    value,
                    android.util.Base64.URL_SAFE
                  ),
                  java.nio.charset.StandardCharsets.UTF_8
                );

              } catch (Exception ignored) {

                return "";
              }
            }


            private String[] parse(File file) {

              return file
                .getName()
                .split("__", -1);
            }


            private JSObject metadata(File file) {

              String[] p =
                parse(file);

              JSObject o =
                new JSObject();

              if (p.length < 5) {
                return o;
              }

              o.put("id", p[0]);
              o.put("kind", p[3]);
              o.put("mimeType", unb64(p[1]));
              o.put("name", unb64(p[2]));
              o.put("size", file.length());

              o.put(
                "receivedAt",
                new java.text.SimpleDateFormat(
                  "yyyy-MM-dd'T'HH:mm:ss.SSSXXX",
                  java.util.Locale.US
                ).format(
                  new java.util.Date(
                    file.lastModified()
                  )
                )
              );

              return o;
            }


            private File findById(
              String id
            ) {

              if (
                id == null ||
                id.trim().isEmpty()
              ) {
                return null;
              }

              File[] files =
                inboxDir().listFiles();

              if (files == null) {
                return null;
              }

              for (File file : files) {

                if (
                  file.getName()
                    .startsWith(id + "__")
                ) {
                  return file;
                }
              }

              return null;
            }


            private boolean isAudio(
              String mime,
              String name
            ) {

              String m =
                mime == null
                  ? ""
                  : mime.toLowerCase();

              String n =
                name == null
                  ? ""
                  : name.toLowerCase();

              return m.startsWith("audio/")
                || n.endsWith(".mp3")
                || n.endsWith(".m4a")
                || n.endsWith(".aac")
                || n.endsWith(".ogg")
                || n.endsWith(".opus")
                || n.endsWith(".wav")
                || n.endsWith(".webm");
            }


            private boolean isPhoto(
              String mime,
              String name
            ) {

              String m =
                mime == null
                  ? ""
                  : mime.toLowerCase();

              String n =
                name == null
                  ? ""
                  : name.toLowerCase();

              return m.startsWith("image/")
                || n.endsWith(".jpg")
                || n.endsWith(".jpeg")
                || n.endsWith(".png")
                || n.endsWith(".webp")
                || n.endsWith(".heic")
                || n.endsWith(".heif");
            }


            private String kindFor(
              String mime,
              String name
            ) {

              if (isAudio(mime, name)) {
                return "audio";
              }

              if (isPhoto(mime, name)) {
                return "photo";
              }

              return "other";
            }


            private File storeUri(
              Uri uri
            ) throws Exception {

              String mime =
                typeFor(uri);

              String name =
                displayName(uri);

              if (
                name == null ||
                name.trim().isEmpty()
              ) {
                name = "media";
              }

              String kind =
                kindFor(mime, name);

              if ("other".equals(kind)) {
                return null;
              }

              File dir =
                inboxDir();

              String id =
                java.util.UUID
                  .randomUUID()
                  .toString();

              String filename =
                id +
                "__" +
                b64(mime) +
                "__" +
                b64(name) +
                "__" +
                kind +
                "__" +
                System.currentTimeMillis();

              File destination =
                new File(
                  dir,
                  filename
                );

              long limit =
                "audio".equals(kind)
                  ? MAX_AUDIO_BYTES
                  : MAX_PHOTO_BYTES;

              long total = 0;

              InputStream input =
                getContext()
                  .getContentResolver()
                  .openInputStream(uri);

              if (input == null) {
                return null;
              }

              try (
                InputStream in = input;

                FileOutputStream output =
                  new FileOutputStream(
                    destination
                  )
              ) {

                byte[] buffer =
                  new byte[64 * 1024];

                int count;

                while (
                  (count = in.read(buffer))
                    != -1
                ) {

                  total += count;

                  if (total > limit) {

                    output.close();

                    destination.delete();

                    throw new Exception(
                      "Arquivo muito grande."
                    );
                  }

                  output.write(
                    buffer,
                    0,
                    count
                  );
                }
              }

              return destination;
            }


            private List<Uri> collectUris(
              Intent intent
            ) {

              List<Uri> result =
                new ArrayList<>();

              if (intent == null) {
                return result;
              }

              if (
                intent.getExtras() != null &&
                intent.getExtras().containsKey(
                  Intent.EXTRA_STREAM
                )
              ) {

                try {

                  android.os.Parcelable single =
                    intent.getParcelableExtra(
                      Intent.EXTRA_STREAM
                    );

                  if (single instanceof Uri) {

                    result.add(
                      (Uri) single
                    );
                  }

                } catch (Exception ignored) {
                }
              }


              if (
                intent.getClipData() != null
              ) {

                android.content.ClipData clip =
                  intent.getClipData();

                for (
                  int i = 0;
                  i < clip.getItemCount();
                  i++
                ) {

                  Uri uri =
                    clip.getItemAt(i)
                      .getUri();

                  if (
                    uri != null &&
                    !result.contains(uri)
                  ) {

                    result.add(uri);
                  }
                }
              }


              if (
                android.os.Build.VERSION.SDK_INT >= 33
              ) {

                try {

                  ArrayList<Uri> streams =
                    intent.getParcelableArrayListExtra(
                      Intent.EXTRA_STREAM,
                      Uri.class
                    );

                  if (streams != null) {

                    for (Uri uri : streams) {

                      if (
                        uri != null &&
                        !result.contains(uri)
                      ) {

                        result.add(uri);
                      }
                    }
                  }

                } catch (Exception ignored) {
                }

              } else {

                try {

                  ArrayList<Uri> streams =
                    intent.getParcelableArrayListExtra(
                      Intent.EXTRA_STREAM
                    );

                  if (streams != null) {

                    for (Uri uri : streams) {

                      if (
                        uri != null &&
                        !result.contains(uri)
                      ) {

                        result.add(uri);
                      }
                    }
                  }

                } catch (Exception ignored) {
                }
              }

              return result;
            }


            public static void handleSharedIntent(
              Intent intent
            ) {

              if (intent == null) {
                return;
              }

              String action =
                intent.getAction();

              if (
                !Intent.ACTION_SEND.equals(action) &&
                !Intent.ACTION_SEND_MULTIPLE.equals(action)
              ) {
                return;
              }

              if (instance == null) {

                pendingSharedIntent =
                  intent;

                return;
              }

              instance.processSharedIntent(
                intent
              );
            }


            private void processSharedIntent(
              Intent intent
            ) {

              List<Uri> uris =
                collectUris(intent);

              if (uris.isEmpty()) {
                return;
              }

              JSArray added =
                new JSArray();

              for (Uri uri : uris) {

                try {

                  File stored =
                    storeUri(uri);

                  if (stored == null) {
                    continue;
                  }

                  added.put(
                    metadata(stored)
                  );

                } catch (Exception ignored) {
                }
              }

              if (added.length() == 0) {
                return;
              }

              JSObject event =
                new JSObject();

              event.put(
                "items",
                added
              );

              notifyListeners(
                "sharedMediaReceived",
                event
              );
            }


            @PluginMethod
            public void listSharedMedia(
              PluginCall call
            ) {

              JSArray items =
                new JSArray();

              File[] files =
                inboxDir().listFiles();

              if (files != null) {

                for (File file : files) {

                  if (file.isFile()) {

                    items.put(
                      metadata(file)
                    );
                  }
                }
              }

              JSObject result =
                new JSObject();

              result.put(
                "items",
                items
              );

              call.resolve(result);
            }


            @PluginMethod
            public void readSharedMedia(
              PluginCall call
            ) {

              String id =
                call.getString("id");

              File file =
                findById(id);

              if (
                file == null ||
                !file.exists()
              ) {

                call.reject(
                  "MEDIA_NOT_FOUND",
                  "Mídia não encontrada."
                );

                return;
              }

              JSObject result =
                metadata(file);

              result.put(
                "path",
                file.getAbsolutePath()
              );

              call.resolve(result);
            }


            @PluginMethod
            public void deleteSharedMedia(
              PluginCall call
            ) {

              String id =
                call.getString("id");

              File file =
                findById(id);

              if (file != null) {
                file.delete();
              }

              call.resolve();
            }


            @PluginMethod
            public void requestContacts(
              PluginCall call
            ) {

              if (
                getPermissionState("contacts")
                  == PermissionState.GRANTED
              ) {

                JSObject result =
                  new JSObject();

                result.put(
                  "granted",
                  true
                );

                result.put(
                  "state",
                  "granted"
                );

                call.resolve(result);

                return;
              }

              requestPermissionForAlias(
                "contacts",
                call,
                "contactsPermissionResult"
              );
            }


            @PermissionCallback
            private void contactsPermissionResult(
              PluginCall call
            ) {

              boolean granted =
                getPermissionState("contacts")
                  == PermissionState.GRANTED;

              JSObject result =
                new JSObject();

              result.put(
                "granted",
                granted
              );

              result.put(
                "state",
                granted
                  ? "granted"
                  : "denied"
              );

              call.resolve(result);
            }


            @PluginMethod
            public void requestMicrophone(
              PluginCall call
            ) {

              if (
                getPermissionState("microphone")
                  == PermissionState.GRANTED
              ) {

                JSObject result =
                  new JSObject();

                result.put(
                  "granted",
                  true
                );

                result.put(
                  "state",
                  "granted"
                );

                call.resolve(result);

                return;
              }

              requestPermissionForAlias(
                "microphone",
                call,
                "microphonePermissionResult"
              );
            }


            @PermissionCallback
            private void microphonePermissionResult(
              PluginCall call
            ) {

              boolean granted =
                getPermissionState("microphone")
                  == PermissionState.GRANTED;

              JSObject result =
                new JSObject();

              result.put(
                "granted",
                granted
              );

              result.put(
                "state",
                granted
                  ? "granted"
                  : "denied"
              );

              call.resolve(result);
            }


            @PluginMethod
            public void getPermissionStates(
              PluginCall call
            ) {

              JSObject result =
                new JSObject();

              result.put(
                "contacts",
                getPermissionState(
                  "contacts"
                ).toString()
              );

              result.put(
                "microphone",
                getPermissionState(
                  "microphone"
                ).toString()
              );

              call.resolve(result);
            }


            @PluginMethod
            public void openSettings(
              PluginCall call
            ) {

              try {

                Intent intent =
                  new Intent(
                    Settings.ACTION_APPLICATION_DETAILS_SETTINGS
                  );

                intent.setData(
                  Uri.parse(
                    "package:" +
                    getContext()
                      .getPackageName()
                  )
                );

                getActivity()
                  .startActivity(intent);

                call.resolve();

              } catch (Exception ex) {

                call.reject(
                  "SETTINGS_ERROR",
                  ex.getMessage()
                );
              }
            }
          }
          JAVA


      # ============================================================
      # 15. MAIN ACTIVITY
      # ============================================================
      - name: Configurar MainActivity
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao/MainActivity.java"

          cat > "$MAIN" <<'JAVA'
          package com.sacerdotisaaime.gestao;

          import android.content.Intent;
          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity
            extends BridgeActivity {

            @Override
            public void onCreate(
              Bundle savedInstanceState
            ) {

              registerPlugin(
                PermissionBridgePlugin.class
              );

              super.onCreate(
                savedInstanceState
              );

              PermissionBridgePlugin
                .handleSharedIntent(
                  getIntent()
                );
            }


            @Override
            protected void onNewIntent(
              Intent intent
            ) {

              super.onNewIntent(intent);

              setIntent(intent);

              PermissionBridgePlugin
                .handleSharedIntent(
                  intent
                );
            }
          }
          JAVA


      # ============================================================
      # 16. CONFIGURAR MANIFEST PARA COMPARTILHAMENTO
      # ============================================================
      - name: Configurar Android para receber áudio e fotos
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST" || {
            echo "ERRO: AndroidManifest.xml não encontrado."
            exit 1
          }

          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          text = path.read_text()

          patterns = [
              r'<activity\b[^>]*android:name="[^"]*\.MainActivity"[^>]*>',
              r'<activity\b[^>]*android:name="com\.sacerdotisaaime\.gestao\.MainActivity"[^>]*>',
              r'<activity\b[^>]*android:name="MainActivity"[^>]*>',
          ]

          match = None

          for pattern in patterns:

              match = re.search(
                  pattern,
                  text,
                  flags=re.IGNORECASE
              )

              if match:
                  break

          if not match:
              raise SystemExit(
                  "ERRO: MainActivity não encontrada no Manifest."
              )

          activity_open = match.group(0)

          # --------------------------------------------------------
          # Android 12+
          # --------------------------------------------------------

          if "android:exported=" not in activity_open:

              activity_open = (
                  activity_open[:-1] +
                  ' android:exported="true">'
              )

          else:

              activity_open = re.sub(
                  r'android:exported="[^"]*"',
                  'android:exported="true"',
                  activity_open
              )

          # --------------------------------------------------------
          # Manter a mesma Activity para receber novos shares
          # --------------------------------------------------------

          if "android:launchMode=" not in activity_open:

              activity_open = (
                  activity_open[:-1] +
                  ' android:launchMode="singleTask">'
              )

          else:

              activity_open = re.sub(
                  r'android:launchMode="[^"]*"',
                  'android:launchMode="singleTask"',
                  activity_open
              )

          text = (
              text[:match.start()] +
              activity_open +
              text[match.end():]
          )

          # --------------------------------------------------------
          # Localizar novamente a MainActivity
          # --------------------------------------------------------

          match = None

          for pattern in patterns:

              match = re.search(
                  pattern,
                  text,
                  flags=re.IGNORECASE
              )

              if match:
                  break

          if not match:
              raise SystemExit(
                  "ERRO: MainActivity não encontrada novamente."
              )

          close = text.find(
              "</activity>",
              match.end()
          )

          if close < 0:
              raise SystemExit(
                  "ERRO: fechamento da MainActivity não encontrado."
              )

          marker = (
              "<!-- Gestão Sacerdotista Aimê - "
              "compartilhamento -->"
          )

          # --------------------------------------------------------
          # Remover filtros anteriores marcados
          # --------------------------------------------------------

          while marker in text:

              start = text.find(marker)

              end = text.find(
                  "</activity>",
                  start
              )

              if end < 0:
                  break

              # Remover somente os filtros entre o marcador
              # e o próximo fechamento da Activity.
              section = text[
                  start:end
              ]

              text = (
                  text[:start] +
                  text[end:]
              )

          # --------------------------------------------------------
          # Filtros definitivos
          # --------------------------------------------------------

          filters = r'''
              <!-- Gestão Sacerdotista Aimê - compartilhamento -->

              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="audio/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND_MULTIPLE" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="audio/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="image/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND_MULTIPLE" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="image/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="*/*" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND_MULTIPLE" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="*/*" />
              </intent-filter>
          '''

          # --------------------------------------------------------
          # Inserir filtros antes do fechamento da MainActivity
          # --------------------------------------------------------

          match = None

          for pattern in patterns:

              match = re.search(
                  pattern,
                  text,
                  flags=re.IGNORECASE
              )

              if match:
                  break

          if not match:
              raise SystemExit(
                  "ERRO: MainActivity não encontrada para inserção."
              )

          close = text.find(
              "</activity>",
              match.end()
          )

          if close < 0:
              raise SystemExit(
                  "ERRO: fechamento da MainActivity não encontrado."
              )

          text = (
              text[:close] +
              filters +
              "\n        " +
              text[close:]
          )

          path.write_text(text)
          PY


      # ============================================================
      # 17. DECLARAR PERMISSÕES
      # ============================================================
      - name: Declarar permissões Android
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import sys

          manifest = Path(sys.argv[1])

          text = manifest.read_text()

          permissions = [
              "android.permission.READ_CONTACTS",
              "android.permission.WRITE_CONTACTS",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
          ]

          marker = "<application"

          if marker not in text:
              raise SystemExit(
                  "ERRO: <application> não encontrado."
              )

          additions = []

          for permission in permissions:

              if (
                  f'android:name="{permission}"'
                  not in text
              ):

                  additions.append(
                      f'    <uses-permission '
                      f'android:name="{permission}" />\n'
                  )

          if additions:

              text = text.replace(
                  marker,
                  "".join(additions) +
                  marker,
                  1
              )

          manifest.write_text(text)
          PY


      # ============================================================
      # 18. VALIDAR MANIFEST ANTES DO BUILD
      # ============================================================
      - name: Validar receptor de compartilhamento
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          echo "======================================"
          echo "VALIDANDO MANIFEST"
          echo "======================================"


          # --------------------------------------------------------
          # Permissões
          # --------------------------------------------------------

          for PERM in \
            READ_CONTACTS \
            WRITE_CONTACTS \
            RECORD_AUDIO \
            CAMERA
          do

            FULL="android.permission.$PERM"

            grep -q "$FULL" "$MANIFEST" || {
              echo "ERRO: $FULL não está no Manifest."
              exit 1
            }

            echo "OK: $FULL"

          done


          # --------------------------------------------------------
          # Activity exportada
          # --------------------------------------------------------

          grep -q \
            'android:exported="true"' \
            "$MANIFEST" || {
              echo "ERRO: exported=true ausente."
              exit 1
            }

          echo "OK: exported=true"


          # --------------------------------------------------------
          # singleTask
          # --------------------------------------------------------

          grep -q \
            'android:launchMode="singleTask"' \
            "$MANIFEST" || {
              echo "ERRO: MainActivity sem singleTask."
              exit 1
            }

          echo "OK: singleTask"


          # --------------------------------------------------------
          # ACTION_SEND
          # --------------------------------------------------------

          grep -q \
            'android.intent.action.SEND' \
            "$MANIFEST" || {
              echo "ERRO: ACTION_SEND ausente."
              exit 1
            }

          echo "OK: ACTION_SEND"


          # --------------------------------------------------------
          # ACTION_SEND_MULTIPLE
          # --------------------------------------------------------

          grep -q \
            'android.intent.action.SEND_MULTIPLE' \
            "$MANIFEST" || {
              echo "ERRO: SEND_MULTIPLE ausente."
              exit 1
            }

          echo "OK: SEND_MULTIPLE"


          # --------------------------------------------------------
          # AUDIO
          # --------------------------------------------------------

          grep -q \
            'android:mimeType="audio/\*"' \
            "$MANIFEST" || {
              echo "ERRO: audio/* ausente."
              exit 1
            }

          echo "OK: audio/*"


          # --------------------------------------------------------
          # IMAGE
          # --------------------------------------------------------

          grep -q \
            'android:mimeType="image/\*"' \
            "$MANIFEST" || {
              echo "ERRO: image/* ausente."
              exit 1
            }

          echo "OK: image/*"


          # --------------------------------------------------------
          # GENÉRICO
          # --------------------------------------------------------

          grep -q \
            'android:mimeType="\*/\*"' \
            "$MANIFEST" || {
              echo "ERRO: */* ausente."
              exit 1
            }

          echo "OK: */*"


          echo ""
          echo "======================================"
          echo "MANIFEST VALIDADO COM SUCESSO"
          echo "======================================"


      # ============================================================
      # 19. VALIDAR CÓDIGO NATIVO
      # ============================================================
      - name: Validar código nativo de compartilhamento
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao/MainActivity.java"

          BRIDGE="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao/PermissionBridgePlugin.java"


          test -f "$MAIN" || {
            echo "ERRO: MainActivity.java não encontrado."
            exit 1
          }


          test -f "$BRIDGE" || {
            echo "ERRO: PermissionBridgePlugin.java não encontrado."
            exit 1
          }


          # --------------------------------------------------------
          # MainActivity
          # --------------------------------------------------------

          grep -q \
            'handleSharedIntent' \
            "$MAIN" || {
              echo "ERRO: MainActivity não chama handleSharedIntent."
              exit 1
            }

          echo "OK: MainActivity chama handleSharedIntent."


          # --------------------------------------------------------
          # ACTION_SEND
          # --------------------------------------------------------

          grep -q \
            'ACTION_SEND' \
            "$BRIDGE" || {
              echo "ERRO: ACTION_SEND ausente no Bridge."
              exit 1
            }

          echo "OK: ACTION_SEND no Bridge."


          # --------------------------------------------------------
          # ACTION_SEND_MULTIPLE
          # --------------------------------------------------------

          grep -q \
            'ACTION_SEND_MULTIPLE' \
            "$BRIDGE" || {
              echo "ERRO: ACTION_SEND_MULTIPLE ausente no Bridge."
              exit 1
            }

          echo "OK: ACTION_SEND_MULTIPLE no Bridge."


          # --------------------------------------------------------
          # EXTRA_STREAM
          # --------------------------------------------------------

          grep -q \
            'EXTRA_STREAM' \
            "$BRIDGE" || {
              echo "ERRO: EXTRA_STREAM ausente."
              exit 1
            }

          echo "OK: EXTRA_STREAM."


          # --------------------------------------------------------
          # ClipData
          # --------------------------------------------------------

          grep -q \
            'getClipData' \
            "$BRIDGE" || {
              echo "ERRO: getClipData ausente."
              exit 1
            }

          echo "OK: ClipData."


          # --------------------------------------------------------
          # Armazenamento nativo
          # --------------------------------------------------------

          grep -q \
            'shared-media-inbox' \
            "$BRIDGE" || {
              echo "ERRO: shared-media-inbox ausente."
              exit 1
            }

          echo "OK: shared-media-inbox."


          # --------------------------------------------------------
          # Evento para a camada web
          # --------------------------------------------------------

          grep -q \
            'sharedMediaReceived' \
            "$BRIDGE" || {
              echo "ERRO: evento sharedMediaReceived ausente."
              exit 1
            }

          echo "OK: sharedMediaReceived."


          echo ""
          echo "======================================"
          echo "CÓDIGO NATIVO VALIDADO"
          echo "======================================"


      # ============================================================
      # 20. PREPARAR KEYSTORE
      # ============================================================
      - name: Preparar keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          KEYSTORE="$PROJECT_DIR/android/app/release-key.jks"

          printf '%s' \
            "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          chmod 600 "$KEYSTORE"

          echo "Keystore preparada."


      # ============================================================
      # 21. VERSÃO + ASSINATURA
      # ============================================================
      - name: Configurar versão V119 e assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/android/app/build.gradle"

          test -f "$APP_GRADLE" || {
            echo "ERRO: build.gradle não encontrado."
            exit 1
          }


          python3 - "$APP_GRADLE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          text = path.read_text()


          # ========================================================
          # V119
          # ========================================================

          if re.search(
              r'versionName\s+"[^"]+"',
              text
          ):

              text = re.sub(
                  r'versionName\s+"[^"]+"',
                  'versionName "1.19.0"',
                  text,
                  count=1
              )

          else:

              text = text.replace(
                  'android {',
                  '''android {
                  defaultConfig {
                      versionName "1.19.0"
                      versionCode 119
                  }
              ''',
                  1
              )


          if re.search(
              r'versionCode\s+\d+',
              text
          ):

              text = re.sub(
                  r'versionCode\s+\d+',
                  'versionCode 119',
                  text,
                  count=1
              )


          # ========================================================
          # SIGNING CONFIG
          # ========================================================

          if 'signingConfigs {' not in text:

              signing = '''
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              '''

              text = text.replace(
                  'android {',
                  'android {' + signing,
                  1
              )

          elif 'signingConfigs.release' not in text:

              text = text.replace(
                  'signingConfigs {',
                  '''signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              ''',
                  1
              )


          # ========================================================
          # RELEASE BUILD TYPE
          # ========================================================

          build_types =
            re.search(
              r'buildTypes\s*\{',
              text
            )

          if not build_types:

              text += '''
              
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              '''

          else:

              tail = text[
                  build_types.end():
              ]

              release =
                re.search(
                  r'release\s*\{',
                  tail
                )

              if not release:

                  pos = build_types.end()

                  text = (
                      text[:pos] +
                      '''
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
                      ''' +
                      text[pos:]
                  )

              else:

                  release_start = (
                      build_types.end() +
                      release.start()
                  )

                  release_end =
                    text.find(
                      "}",
                      release_start
                    )

                  release_block = (
                    text[
                      release_start:
                      release_end + 1
                    ]
                    if release_end > release_start
                    else ""
                  )

                  if (
                      'signingConfig signingConfigs.release'
                      not in release_block
                  ):

                      insert_pos =
                        text.find(
                          "{",
                          release_start
                        ) + 1

                      text = (
                          text[:insert_pos] +
                          '''
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      ''' +
                          text[insert_pos:]
                      )

          path.write_text(text)
          PY


          # ========================================================
          # VALIDAR KEYSTORE
          # ========================================================

          keytool -list \
            -keystore \
            "$PROJECT_DIR/android/app/release-key.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          echo "OK: keystore e alias validados."


      # ============================================================
      # 22. VALIDAR V119
      # ============================================================
      - name: Validar versão V119
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/android/app/build.gradle"

          grep -q \
            'versionName "1.19.0"' \
            "$APP_GRADLE" || {
              echo "ERRO: versionName 1.19.0 não encontrado."
              exit 1
            }

          grep -q \
            'versionCode 119' \
            "$APP_GRADLE" || {
              echo "ERRO: versionCode 119 não encontrado."
              exit 1
            }

          echo "OK: V119 configurada."


      # ============================================================
      # 23. COMPILAR APK
      # ============================================================
      - name: Gerar APK RELEASE
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "ERRO: senha do keystore não chegou."
            exit 1
          }

          test -n "$ANDROID_KEY_ALIAS" || {
            echo "ERRO: alias não chegou."
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "ERRO: senha da chave não chegou."
            exit 1
          }

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew assembleRelease --no-daemon


      # ============================================================
      # 24. LOCALIZAR APK
      # ============================================================
      - name: Localizar APK final
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then

            echo "ERRO: APK não encontrado."

            find "$PROJECT_DIR/android" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # 25. VALIDAR PERMISSÕES NO APK
      # ============================================================
      - name: Validar permissões no APK
        shell: bash
        run: |
          set -e

          APK="$APK_PATH"

          AAPT=$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt \
              | sort -V \
              | tail -n 1
          )

          test -n "$AAPT" || {
            echo "ERRO: aapt não encontrado."
            exit 1
          }

          echo "======================================"
          echo "PERMISSÕES DO APK"
          echo "======================================"

          "$AAPT" dump permissions "$APK" \
            | tee /tmp/apk-permissions.txt


          for PERM in \
            READ_CONTACTS \
            WRITE_CONTACTS \
            RECORD_AUDIO \
            CAMERA
          do

            FULL="android.permission.$PERM"

            grep -q "$FULL" \
              /tmp/apk-permissions.txt || {

              echo "ERRO: $FULL não está no APK."

              exit 1
            }

            echo "OK NO APK: $FULL"

          done


          echo ""
          echo "Permissões do APK validadas."


      # ============================================================
      # 26. VALIDAR INTENTS NO APK
      # ============================================================
      - name: Validar compartilhamento no APK
        shell: bash
        run: |
          set -e

          APK="$APK_PATH"

          AAPT=$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt \
              | sort -V \
              | tail -n 1
          )

          test -n "$AAPT" || {
            echo "ERRO: aapt não encontrado."
            exit 1
          }


          FINAL_MANIFEST="/tmp/final-v119-manifest.txt"


          echo "======================================"
          echo "MANIFEST FINAL DO APK"
          echo "======================================"

          "$AAPT" dump xmltree \
            "$APK" \
            AndroidManifest.xml \
            | tee "$FINAL_MANIFEST"


          # --------------------------------------------------------
          # ACTION_SEND
          # --------------------------------------------------------

          grep -q \
            'android.intent.action.SEND' \
            "$FINAL_MANIFEST" || {

            echo "ERRO: ACTION_SEND não entrou no APK."

            exit 1
          }

          echo "OK NO APK: ACTION_SEND"


          # --------------------------------------------------------
          # ACTION_SEND_MULTIPLE
          # --------------------------------------------------------

          grep -q \
            'android.intent.action.SEND_MULTIPLE' \
            "$FINAL_MANIFEST" || {

            echo "ERRO: SEND_MULTIPLE não entrou no APK."

            exit 1
          }

          echo "OK NO APK: SEND_MULTIPLE"


          # --------------------------------------------------------
          # AUDIO
          # --------------------------------------------------------

          grep -q \
            'audio/\*' \
            "$FINAL_MANIFEST" || {

            echo "ERRO: audio/* não entrou no APK."

            exit 1
          }

          echo "OK NO APK: audio/*"


          # --------------------------------------------------------
          # IMAGE
          # --------------------------------------------------------

          grep -q \
            'image/\*' \
            "$FINAL_MANIFEST" || {

            echo "ERRO: image/* não entrou no APK."

            exit 1
          }

          echo "OK NO APK: image/*"


          # --------------------------------------------------------
          # MIME GENÉRICO
          # --------------------------------------------------------

          grep -q \
            '\*/\*' \
            "$FINAL_MANIFEST" || {

            echo "ERRO: */* não entrou no APK."

            exit 1
          }

          echo "OK NO APK: */*"


          echo ""
          echo "======================================"
          echo "V119 VALIDADA NO APK FINAL"
          echo "======================================"
          echo "ACTION_SEND   : OK"
          echo "SEND_MULTIPLE : OK"
          echo "audio/*       : OK"
          echo "image/*       : OK"
          echo "*/*           : OK"
          echo "======================================"


      # ============================================================
      # 27. VALIDAR ASSINATURA
      # ============================================================
      - name: Validar assinatura do APK
        shell: bash
        run: |
          set -e

          APK="$APK_PATH"

          APKSIGNER=$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )

          test -n "$APKSIGNER" || {
            echo "ERRO: apksigner não encontrado."
            exit 1
          }

          "$APKSIGNER" verify \
            --verbose \
            "$APK"


      # ============================================================
      # 28. DISPONIBILIZAR APK
      # ============================================================
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: gestao-sacerdotista-aime-v119-audio-photo-share
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 1


      # ============================================================
      # 29. LIMPAR KEYSTORE
      # ============================================================
      - name: Limpar arquivo temporário de assinatura
        if: always()
        shell: bash
        run: |
          if [ -n "${PROJECT_DIR:-}" ]; then
            rm -f \
              "$PROJECT_DIR/android/app/release-key.jks" \
              2>/dev/null || true
          fi

          BUILD_GRADLE="$PROJECT_DIR/android/app/build.gradle"

          python3 - "$BUILD_GRADLE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )


          # ==================================================
          # VERSION CODE
          # ==================================================

          if re.search(
              r'versionCode\s+\d+',
              text
          ):

              text = re.sub(
                  r'versionCode\s+\d+',
                  'versionCode 120',
                  text,
                  count=1
              )

          else:

              raise SystemExit(
                  "versionCode não encontrado."
              )


          # ==================================================
          # VERSION NAME
          # ==================================================

          if re.search(
              r'versionName\s+"[^"]+"',
              text
          ):

              text = re.sub(
                  r'versionName\s+"[^"]+"',
                  'versionName "1.20.0"',
                  text,
                  count=1
              )

          else:

              raise SystemExit(
                  "versionName não encontrado."
              )


          # ==================================================
          # SIGNING CONFIG
          # ==================================================

          if "signingConfigs {" not in text:

              signing = '''
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              '''

              android_pos = text.find(
                  "android {"

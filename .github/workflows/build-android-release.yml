            @PluginMethod
            public void openSettings(
              PluginCall call
            ) {

              try {

                Intent intent =
                  new Intent(
                    Settings.ACTION_APPLICATION_DETAILS_SETTINGS
                  );

                intent.setData(
                  Uri.parse(
                    "package:" +
                    getContext().getPackageName()
                  )
                );

                getActivity()
                  .startActivity(intent);

                call.resolve();

              } catch (Exception ex) {

                call.reject(
                  "SETTINGS_ERROR",
                  ex.getMessage()
                );
              }
            }

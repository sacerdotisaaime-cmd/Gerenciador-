                JSObject r = new JSObject();
                r.put("ok", false);
                r.put("code", "DRIVE_NOT_CONNECTED");
                r.put("message", "Conecte o Google Drive antes de procurar os backups.");
                call.resolve(r);
                return;
              }
              driveExecutor.execute(() -> {
                try {
                  String root = findDriveFolder(googleAccessToken, "Gestão Sacerdotista Aimê", null);
                  if (root.isEmpty()) {
                    JSObject r = new JSObject(); r.put("ok", true); r.put("items", new JSONArray()); call.resolve(r); return;
                  }
                  String backups = findDriveFolder(googleAccessToken, "Backups", root);
                  if (backups.isEmpty()) {
                    JSObject r = new JSObject(); r.put("ok", true); r.put("items", new JSONArray()); call.resolve(r); return;
                  }
                  String q = "'" + backups + "' in parents and trashed=false and mimeType!='application/vnd.google-apps.folder'";
                  String url = "https://www.googleapis.com/drive/v3/files?q=" + urlEncode(q) + "&pageSize=100&orderBy=createdTime desc&fields=files(id,name,size,createdTime,mimeType,trashed,description)";
                  JSONObject listed = new JSONObject(http("GET", url, googleAccessToken, null, null));
                  JSONArray files = listed.optJSONArray("files");
                  JSONArray items = new JSONArray();
                  if (files != null) {
                    for (int i = 0; i < files.length(); i++) {
                      JSONObject f = files.getJSONObject(i);
                      JSObject item = new JSObject();
                      item.put("id", f.optString("id", ""));
                      item.put("name", f.optString("name", "backup.zip"));
                      item.put("size", f.optLong("size", 0));
                      item.put("createdTime", f.optString("createdTime", ""));
                      item.put("description", f.optString("description", ""));
                      items.put(item);
                    }
                  }
                  JSObject r = new JSObject(); r.put("ok", true); r.put("items", items); call.resolve(r);
                } catch (Exception ex) {
                  JSObject r = new JSObject(); r.put("ok", false); r.put("code", "DRIVE_LIST_FAILED"); r.put("message", ex.getMessage() == null ? "Não foi possível listar os backups do Google Drive." : ex.getMessage()); call.resolve(r);
                }
              });
            }

            @PluginMethod public void downloadGoogleDriveBackup(PluginCall call) {
              String fileId = call.getString("fileId", "");
              if (fileId == null || fileId.trim().isEmpty()) { call.reject("DRIVE_FILE_ID_MISSING", "ID do backup não informado."); return; }
              if (googleAccessToken == null || googleAccessToken.isEmpty()) { call.reject("DRIVE_NOT_CONNECTED", "Conecte o Google Drive antes de importar o backup."); return; }
              driveExecutor.execute(() -> {
                HttpURLConnection c = null;
                File output = null;
                try {
                  JSONObject meta = getDriveFile(googleAccessToken, fileId);
                  String name = meta.optString("name", "backup-google-drive.zip").replaceAll("[^a-zA-Z0-9._-]", "_");
                  if (!name.toLowerCase(java.util.Locale.US).endsWith(".zip")) name += ".zip";
                  output = new File(getContext().getCacheDir(), "drive-import-" + System.currentTimeMillis() + "-" + name);
                  URL url = new URL("https://www.googleapis.com/drive/v3/files/" + urlEncode(fileId) + "?alt=media");
                  c = (HttpURLConnection) url.openConnection();
                  c.setRequestMethod("GET"); c.setConnectTimeout(30000); c.setReadTimeout(180000);
                  c.setRequestProperty("Authorization", "Bearer " + googleAccessToken);
                  c.setRequestProperty("Accept", "application/zip,application/octet-stream,*/*");
                  int code = c.getResponseCode();
                  if (code < 200 || code >= 300) throw new IllegalStateException("Google Drive HTTP " + code + " ao baixar o backup.");
                  InputStream input = c.getInputStream();
                  try (InputStream in = input; OutputStream out = new FileOutputStream(output)) {
                    byte[] buffer = new byte[1024 * 1024]; int n; long total = 0;
                    while ((n = in.read(buffer)) != -1) { total += n; if (total > 512L * 1024L * 1024L) throw new IllegalStateException("Backup maior que 512 MB."); out.write(buffer, 0, n); }
                  }
                  JSObject r = new JSObject(); r.put("ok", true); r.put("path", output.getName()); r.put("fileName", name); r.put("size", output.length()); call.resolve(r);
                } catch (Exception ex) {
                  if (output != null && output.exists()) try { output.delete(); } catch (Exception ignored) {}
                  call.reject("DRIVE_DOWNLOAD_FAILED", ex.getMessage() == null ? "Não foi possível baixar o backup do Google Drive." : ex.getMessage());
                } finally { if (c != null) c.disconnect(); }
              });
            }

            @PluginMethod public void uploadBackupToGoogleDrive(PluginCall call) {
              String uriString=call.getString("uri","");String fileName=call.getString("fileName","gestao-sacerdotista-aime-backup.zip");String description=call.getString("description","");if(uriString.isEmpty()){call.reject("DRIVE_URI_MISSING","Arquivo de backup não informado.");return;}
              if(googleAccessToken==null||googleAccessToken.isEmpty()){
                Identity.getAuthorizationClient(getActivity()).authorize(driveAuthorizationRequest()).addOnSuccessListener(result->{ if(result.hasResolution()){JSObject r=new JSObject();r.put("ok",false);r.put("needsAuthorization",true);r.put("message","Conecte o Google Drive antes de enviar o backup.");call.resolve(r);return;} googleAccessToken=result.getAccessToken(); if(googleAccessToken==null||googleAccessToken.isEmpty()){call.reject("DRIVE_TOKEN_EMPTY","Token do Google Drive vazio.");return;} performDriveUpload(call,Uri.parse(uriString),fileName,googleAccessToken,description); }).addOnFailureListener(e->call.reject("DRIVE_AUTH_FAILED",e.getMessage()==null?"Falha ao autorizar o Drive":e.getMessage()));
                return;
              }
              performDriveUpload(call,Uri.parse(uriString),fileName,googleAccessToken,description);
            }

            private void performDriveUpload(PluginCall call,Uri uri,String fileName,String token,String description){driveExecutor.execute(()->{try{String root=findOrCreateFolder(token,"Gestão Sacerdotista Aimê",null);String backups=findOrCreateFolder(token,"Backups",root);JSONObject uploaded=uploadResumable(token,uri,fileName,backups,description);String id=uploaded.getString("id");JSONObject verified=getDriveFile(token,id);long localSize=uriLength(uri);long remoteSize=Long.parseLong(verified.optString("size","-1"));if(remoteSize!=localSize)throw new IllegalStateException("Validação do Drive falhou: tamanho local e remoto diferentes.");int deleted=rotateDriveBackups(token,backups,id);JSObject result=new JSObject();result.put("ok",true);result.put("fileId",id);result.put("folderId",backups);result.put("fileName",verified.optString("name",fileName));result.put("size",remoteSize);result.put("deleted",deleted);call.resolve(result);}catch(Exception ex){call.reject("DRIVE_UPLOAD_FAILED",ex.getMessage()==null?"Falha ao enviar o backup para o Google Drive":ex.getMessage());}});}
          }
          JAVA

      - name: Criar agendador nativo do Backup Mestre
        shell: bash
        run: |
          set -e
          ANDROID_SRC="$PROJECT_DIR/android/app/src/main/java/com/sacerdotisaaime/gestao"
          mkdir -p "$ANDROID_SRC"
          cat > "$ANDROID_SRC/BackupAlarmScheduler.java" <<'JAVA'
          package com.sacerdotisaaime.gestao;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import java.util.Calendar;

          public final class BackupAlarmScheduler {
            private static final String PREFS = "gestao_backup_schedule_v1";
            private static final String PENDING = "automatic_backup_pending";
            private static final int REQUEST_CODE = 14950;
            private BackupAlarmScheduler() {}

            private static PendingIntent pendingIntent(Context context) {
              Intent intent = new Intent(context, MainActivity.class);
              intent.setAction("com.sacerdotisaaime.gestao.AUTOMATIC_BACKUP");
              intent.putExtra("GESTAO_AUTOMATIC_BACKUP", true);
              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
              int flags = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0);
              return PendingIntent.getActivity(context, REQUEST_CODE, intent, flags);
            }

            public static void saveSchedule(Context context, boolean enabled, int hour, int minute) {
              context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putBoolean("enabled", enabled).putInt("hour", hour).putInt("minute", minute).apply();
            }
            public static boolean isEnabled(Context context) { return context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getBoolean("enabled", false); }
            public static int getHour(Context context) { return context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getInt("hour", 21); }
            public static int getMinute(Context context) { return context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getInt("minute", 0); }

            public static boolean schedule(Context context, int hour, int minute) {
              AlarmManager alarm = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
              if (alarm == null) throw new IllegalStateException("AlarmManager indisponível.");
              PendingIntent pi = pendingIntent(context);
              Calendar target = Calendar.getInstance();
              target.set(Calendar.SECOND, 0); target.set(Calendar.MILLISECOND, 0);
              target.set(Calendar.HOUR_OF_DAY, hour); target.set(Calendar.MINUTE, minute);
              if (target.getTimeInMillis() <= System.currentTimeMillis()) target.add(Calendar.DAY_OF_YEAR, 1);
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && alarm.canScheduleExactAlarms()) {
                alarm.setAlarmClock(new AlarmManager.AlarmClockInfo(target.getTimeInMillis(), pi), pi);
                return true;
              }
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) alarm.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, target.getTimeInMillis(), pi);
              else alarm.set(AlarmManager.RTC_WAKEUP, target.getTimeInMillis(), pi);
              return false;
            }

            public static void cancel(Context context) {
              AlarmManager alarm = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
              if (alarm != null) alarm.cancel(pendingIntent(context));
            }
            public static void markPending(Context context) { context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putBoolean(PENDING, true).apply(); }
            public static boolean consumePending(Context context) {
              android.content.SharedPreferences p = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              boolean pending = p.getBoolean(PENDING, false);
              if (pending) p.edit().putBoolean(PENDING, false).apply();
              return pending;
            }
            public static void rescheduleIfEnabled(Context context) { if (isEnabled(context)) { try { schedule(context, getHour(context), getMinute(context)); } catch (Exception ignored) {} } }
          }
          JAVA

          cat > "$ANDROID_SRC/BackupBootReceiver.java" <<'JAVA'
          package com.sacerdotisaaime.gestao;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          public class BackupBootReceiver extends BroadcastReceiver {
            @Override public void onReceive(Context context, Intent intent) {
              if (intent == null) return;
              String action = intent.getAction();
              if (Intent.ACTION_BOOT_COMPLETED.equals(action) || Intent.ACTION_MY_PACKAGE_REPLACED.equals(action) || Intent.ACTION_TIMEZONE_CHANGED.equals(action) || Intent.ACTION_TIME_CHANGED.equals(action)) BackupAlarmScheduler.rescheduleIfEnabled(context);
            }
          }
          JAVA

